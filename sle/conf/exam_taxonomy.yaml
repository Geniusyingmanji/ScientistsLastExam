# Scientists' Last Exam surface map.
#
# This is not Humanity's Last Exam (closed one-shot Q&A), not Scientist's First
# Exam (multidisciplinary understanding), and not sgi-bench (full-paper auto-research).
# Those occupy neighbouring cells. SLE occupies the remaining one: with a budgeted
# oracle and an open-loop control, does a searcher get scientifically better?
#
# Every listed task fills exactly one form cell. Counts are a test, not a comment.

schema_version: 1
scenario: multidisciplinary_search
out_of_scope:
  - id: SFE
    reason: one-shot multidisciplinary understanding; SLE does not score a single answer
  - id: sgi-bench
    reason: full-pipeline auto-research (paper, figures, claims); SLE scores a hidden oracle
  - id: HLE
    reason: closed exam items; SLE items are programs plus a frozen executable oracle

optimization_analogue:
  engineering_design: engineering design under a frozen simulator (same form as Frontier-Eng; no task is shared with it)
  combinatorial: open-record construction with an executable mathematical verifier
  molecular_design: molecular or macromolecular design under a frozen scientific oracle
  certificate_bound: >-
    the product is a verifiable argument rather than an object, and the score is the strength
    of the bound the argument proves; admitted only where the standard relaxation is not
    already tight, which is why the Delsarte half of NonlinearCodeRecords was cut instead
discovery_kind:
  formula: recover a law, or refuse when no law in the family holds
  structure: recover a graph, network or geometry
  evidence: decide what a body of measurements supports
  substance: say which materials, phases or species are present
  parameter_inversion: recover numbers of a form that is already named

