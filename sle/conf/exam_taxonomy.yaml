# Optimization branch inventory; discovery tasks are maintained on main.
schema_version: 1
scenario: scientific_optimization
out_of_scope:
- id: SFE
  reason: one-shot multidisciplinary understanding; SLE does not score a single answer
- id: sgi-bench
  reason: full-pipeline auto-research (paper, figures, claims); SLE scores a hidden oracle
- id: HLE
  reason: closed exam items; SLE items are programs plus a frozen executable oracle
optimization_analogue:
  engineering_design: engineering design under a frozen simulator (same form as Frontier-Eng; no task
    is shared with it)
  combinatorial: open-record construction with an executable mathematical verifier
  molecular_design: molecular or macromolecular design under a frozen scientific oracle
  certificate_bound: the product is a verifiable argument rather than an object, and the score is the
    strength of the bound the argument proves; admitted only where the standard relaxation is not already
    tight, which is why the Delsarte half of NonlinearCodeRecords was cut instead
