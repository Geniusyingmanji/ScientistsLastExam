schema_version: 1
scenario: multidisciplinary_discovery
out_of_scope:
- id: optimization
  reason: Design and record optimization tasks live on the optimization branch.
- id: one_shot_qa
  reason: Discovery requires evidence, investigation and explicit limits, not a single keyed answer.
optimization_analogue: {}
discovery_kind:
  formula: recover a law, or refuse when no law in the family holds
  structure: recover a graph, network or geometry
  evidence: decide what a body of measurements supports
  substance: say which materials, phases or species are present
  parameter_inversion: recover numbers of a form that is already named
