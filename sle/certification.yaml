      single-site traces, and abstaining is the only correct answer there. Calibrated on the benchmark host: baseline 0.0833
      mechanism, shipped least-squares learner 0.5833 while claiming a coupling between uncoupled spins a quarter of the time
      and never recognising the symmetric chains. Retained as a candidate pending external review, independent recomputation,
