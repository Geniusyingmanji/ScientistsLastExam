  SystemsBiology/EnzymeKineticsLaw:
    status: quarantined
    reason: 'Frontier exclusion 2026-09-18 (retired_saturated). Historical replay only; see sle/conf/discovery_eligibility.yaml
      for version-bound evidence and re-entry gates. Active rate-law identification: the candidate spends a 28-call budget
      on a substrate-and-inhibitor assay, names one of six published laws with its constants, and declines on the three worlds
      that obey none. Competitive, uncompetitive and noncompetitive inhibition are provably inseparable from a single substrate
      titration, so the score turns on designing the experiment rather than on recalling the laws. One out-of-family world
      is a cooperative enzyme that is also competitively inhibited: at zero inhibitor it fits Hill to 0.9 sigma, so a candidate
      that does not vary the inhibitor books a false discovery rather than merely scoring low. Ablating the reference measures
      what each competence is worth - 0.990 with three inhibitor levels and both refusal tests, 0.315 with one level, 0.490
      when never declining, 0.000 with neither - and blanket abstention scores 0.000 by construction. A Claude Opus 5 draw
      on 2026-09-02 settles it: three seeds, first proposal 0.9905 / 0.9882 / 0.9890 against the reference''s 0.9904, law
      identification 1.00, false discovery 0.00, 28 of 28 assay calls. The winning program titrates at three inhibitor levels
      and runs both refusal tests; there is no exploit in it. Saturated for the current frontier and retained as an on-ramp
      that still separates a naive analysis from a competent one, not as frontier evidence. The draw also moved a public key:
      the model wrote float() on noise_sigma_hint, which held a sentence, and nine of nine proposals scored zero on the naming
      before the fix.'
    citation_ids:
    - doi:10.1016/0926-6569(63)90226-8
    - doi:10.1021/bi201284u
    - doi:10.1042/bj0190338
    - doi:10.1214/aos/1176344136
  ParticlePhysics/DiscrepantMeasurements:
    status: candidate
    reason: 'Evidence synthesis migrated out of clinical trials: eight groups publish a value and a one-sigma uncertainty
      for the same constant and scatter further than those uncertainties allow. Four defects are possible - sound, globally
      understated errors, one group with an unquoted systematic, or two methods that disagree - and the three defective ones
      overlap in chi-square per degree of freedom (2.2-11.8, 1.8-5.7, 3.9-10.2 against a sound table''s 0.4-1.9), so the diagnosis
      is not reachable from the published table. It is reachable from five charged split tests against eight groups, and only
      by spending them at both ends of the deviation ordering: the deviant tail splits badly under both a single systematic
      and a global understatement, so the tail alone halves culprit identification. Ablation - 0.842 buying at both ends,
      0.701 on the deviant tail only, 0.586 on typical groups only, 0.425 buying nothing, 0.509 never declining, 0.000 declining
      everything. A Claude Opus 5 draw on 2026-09-02 reached the reference''s 0.8421 on two of three seeds - one on the first
      proposal, one on the second after 0.6817 - and exceeded it on none. The third seed stalls at 0.6817 across all three
      proposals while buying 3.8 of its 5 split tests, which is the failure the axes exist to make legible. A harder on-ramp
      than EnzymeKineticsLaw and one that shows a real proposal-to-proposal gain, but the reference sits at the ceiling this
      scoring admits, so it is not frontier evidence.'
    citation_ids:
    - doi:10.1103/PhysRev.40.207
    - doi:10.1103/PhysRevD.110.030001
    - doi:10.1103/RevModPhys.93.025010
    - doi:10.1016/0197-2456(86)90046-2
