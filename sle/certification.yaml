  MaterialsScience/PhaseDiagramDiscovery:
    status: candidate
    reason: 'The first task whose artifact is a substance rather than a parameter set: from 26 budgeted synthesis-and-diffraction
      calls the candidate must say which equilibrium phases a hidden binary system contains and over which composition ranges,
      or decline when replicates show the system never equilibrates. Two-phase fields return lever-rule superpositions that
      read as new compounds unless decomposed; an impurity adds peaks that only replication can reject; boundaries are only
      reachable through lever-rule regression, because the gaps are 0.2-0.3 wide and grid midpoints lose 0.72 of the score.
      Ablation: 0.730 with decomposition, replication and regression; 0.006 with grid-midpoint boundaries; 0.444 never declining;
      0.000 for the naive grid, with a 0.86 false-phase rate. The reference deliberately sits at 0.730 on half the budget,
      so the boundary axis retains headroom; the admission bar recorded on the card is that a first Opus 5 proposal must not
      reach it - and a Claude Opus 5 draw on 2026-09-02 (clean-revision run) passed: first proposals 0.10 / 0.67 / 0.34 against
      the reference''s 0.730, best of nine 0.6706, none reaching the reference. The near-miss got the phase set exactly right
      and fell short only on boundary placement, the lever-rule skill the task isolates. Unsaturated at the frontier; the
      run is single-arm at budget 3, so it shows headroom, not yet feedback-driven improvement.'
