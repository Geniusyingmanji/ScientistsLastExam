      model reaching 0.5833 mechanism while claiming a coupling on a quarter of the genuinely
      uncoupled pairs and never recognising the magnetically equivalent world it cannot solve.
      Retained as a candidate pending external NMR review, an independent recomputation, and any
      model measurement at all - no search has been run against it yet.
    citation_ids:
