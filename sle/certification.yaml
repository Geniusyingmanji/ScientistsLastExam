  Exoplanets/RadialVelocityPlanets:
    status: candidate
    reason: >-
      planets identified in a radial-velocity series against a stellar rotation signal and nightly
      cadence aliases, with astropy LombScargle as the periodogram oracle. False discovery is a
      first-class axis because that is this field's characteristic failure - the literature carries
      retracted detections traced to activity and aliasing. Calibrated at the shipped level: baseline
      0.5000 mechanism with a 0.889 false-discovery rate, shipped pre-whitening detector 0.8750 with
      0.611. The signal-to-noise regime was lowered from the first sizing, where both scored 1.0 and
      the mechanism axis measured nothing. Retained as a candidate pending external review,
      independent recomputation, and any model measurement.
    citation_ids:
