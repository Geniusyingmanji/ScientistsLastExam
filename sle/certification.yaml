      - doi:10.1088/0004-637X/764/1/3
  Mathematics/SequenceLawRecovery:
    status: candidate
    reason: >-
      linear recurrence recovered from an integer prefix containing transcription errors, verified
      exactly with SymPy against a held-out continuation rather than against the visible terms. About
      a third of each set is shown with too few terms to pin a unique minimal rule, where abstaining
      is correct. Calibrated at the shipped level: baseline 0.0000 (a fixed Fibonacci guess), shipped
      error-tolerant solver 0.7500 with a 0.50 correct-refusal rate. Corruption was added because
      exact solving on clean prefixes is complete and left nothing above the reference. Retained as a
      candidate pending external review, independent recomputation, and any model measurement.
    citation_ids:
      - doi:10.1145/3208976.3209017
      - doi:10.1090/S0025-5718-1980-0583502-2
  Spectroscopy/SpinSystemInference:
    status: candidate
    reason: >-
      second-order spin system recovery from an nmrsim-simulated NMR spectrum, with the full
      Zeeman-plus-coupling Hamiltonian as the oracle rather than a first-order reimplementation.
      Reports the discovery triple separately: combined_score carries mechanism recovery alone
      while false-discovery rate and calibrated refusal sit beside it. Calibrated on the benchmark
