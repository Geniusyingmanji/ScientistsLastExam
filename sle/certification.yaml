  ParticlePhysics/DiscrepantMeasurements:
    status: candidate
    reason: >-
      Evidence synthesis migrated out of clinical trials: eight groups publish a value and a one-sigma
      uncertainty for the same constant and scatter further than those uncertainties allow. Four defects
      are possible - sound, globally understated errors, one group with an unquoted systematic, or two
      methods that disagree - and the three defective ones overlap in chi-square per degree of freedom
      (2.2-11.8, 1.8-5.7, 3.9-10.2 against a sound table's 0.4-1.9), so the diagnosis is not reachable
      from the published table. It is reachable from five charged split tests against eight groups, and
      only by spending them at both ends of the deviation ordering: the deviant tail splits badly under
      both a single systematic and a global understatement, so the tail alone halves culprit
      identification. Ablation - 0.842 buying at both ends, 0.701 on the deviant tail only, 0.586 on
      typical groups only, 0.425 buying nothing, 0.509 never declining, 0.000 declining everything.
      A Claude Opus 5 draw on 2026-09-02 reached the reference's 0.8421 on two of three seeds - one on
      the first proposal, one on the second after 0.6817 - and exceeded it on none. The third seed
      stalls at 0.6817 across all three proposals while buying 3.8 of its 5 split tests, which is the
      failure the axes exist to make legible. A harder on-ramp than EnzymeKineticsLaw and one that
      shows a real proposal-to-proposal gain, but the reference sits at the ceiling this scoring
      admits, so it is not frontier evidence.
