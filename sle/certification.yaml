      bounds; it is not a formal real-arithmetic certificate. The complete positional reference scores 0.8193980000000003
      development and 0.72987 held out; baseline zero and the fixed strongest historical shortcut 0.4274261428571428. All
      substantive capability ablations lower development score. Correct claim-denominator FDR, all-world validity and per-world
      candidate isolation are verified. At c02e402, 151 targeted Linux tests and the 13-call contribution gate passed. Three
      independent valid first proposals score 0.21659171428571433, 0.2761347142857143 and 0.2652197142857144, all below the
      complete reference. Their original receipts remain immutable and documentation-only compatibility is checked separately.
