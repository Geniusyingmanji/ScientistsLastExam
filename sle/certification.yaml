  Algorithm/GraphFromDistances:
    status: candidate
    reason: >-
      hidden weighted graph recovered from a budget of shortest-path queries, with networkx as the
      distance oracle rather than a reimplementation of Dijkstra. Reports the discovery triple
      separately: edge-recovery F1 as combined_score, with false edges and identifiability refusal
      beside it. About half of each world set contains an edge lying on no shortest path, which no
      query can reveal and where abstaining is the only correct answer. Calibrated on the benchmark
      host at the shipped level: baseline 0.4308 (every queried distance read as an edge), shipped
      triangle-inequality reconstructor 0.7900 with a 0.0444 false-discovery rate. Retained as a
      candidate pending external review, independent recomputation, and any model measurement.
    citation_ids:
      - doi:10.1137/S0097539702418498
      - doi:10.1007/BF01386390
  QuantumDynamics/HamiltonianLearning:
    status: candidate
    reason: >-
      spin-chain fields and couplings recovered from QuTiP-generated magnetisation dynamics, with the
      full Schrodinger evolution as the oracle. Some chains carry an exchange symmetry that makes two
      spins' parameters unidentifiable from single-site traces, and abstaining is the only correct
      answer there. Calibrated on the benchmark host: baseline 0.0833 mechanism, shipped least-squares
      learner 0.5833 while claiming a coupling between uncoupled spins a quarter of the time and never
      recognising the symmetric chains. Retained as a candidate pending external review, independent
      recomputation, and any model measurement.
    citation_ids:
      - doi:10.1103/PhysRevLett.112.190501
      - doi:10.1016/j.cpc.2012.11.019
