# Known searcher conditions, keyed by the `llm_condition_sha256` recorded in every run manifest.
#
# Why this exists. Manifests written before the readable `llm_condition` field was added carry
# only the hash, so 222 runs in this repository had no attributable model. Separating models in
# the admission report then split one model's evidence between its name and "unrecorded" and
# weakened both halves. The hash is deterministic over the searcher condition, so the attribution
# is recoverable exactly - no re-running, and no rewriting of the original artifacts, which would
# destroy the provenance this repository depends on.
#
# Each entry is a claim that a hash was produced by that condition. Regenerate a hash with:
#   python3 -c "import sys; sys.path.insert(0,'.'); \
#     from sle.config import load_llm_client; \
#     from sle.algorithms.common import llm_condition_sha256; \
#     print(llm_condition_sha256(load_llm_client('<config path>')))"
schema_version: 1
