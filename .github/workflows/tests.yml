# The benchmark's guarantees live in the candidate sandbox and the cohort runner, and both need
# Linux tools (bubblewrap, util-linux flock) that a developer laptop does not have. Without CI the
# only Linux run of the suite was whoever happened to ssh into the benchmark host: three external
# PRs landed with zero checks, and a merge went out with five red tests because a pipe swallowed
# pytest's exit code.
#
# Why the system interpreter and not actions/setup-python: the suite runs under /usr/bin/python3,
# and the candidate sandbox binds that exact CPython runtime, selected package entries, and their
# resolved shared-library closure. Packages therefore have to be installed for the interpreter
# that invokes pytest. The sandbox does not expose the rest of /usr, /lib, or /lib64.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sandbox:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Evidence-binding tests read git history and refuse dirty or unknown revisions.
          fetch-depth: 0
      - name: Sandbox tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap util-linux python3-pip
          bwrap --version && flock --version
          # This is only an availability probe. The test suite exercises the narrower production
          # mount contract and will fail if the runner stops allowing unprivileged namespaces.
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr --ro-bind /lib /lib \
                --ro-bind /lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true && echo "bwrap ok"
      - name: Python dependencies into the system interpreter
        run: |
          /usr/bin/python3 --version
          sudo /usr/bin/python3 -m pip install --upgrade pip
          sudo /usr/bin/python3 -m pip install "numpy==1.24.4" "scipy==1.10.1" pyyaml pytest
          # The sandbox resolves site-packages for the interpreter it execs; prove they are there.
          /usr/bin/python3 -c "import numpy, scipy, yaml; print(numpy.__file__)"
      - name: Inventory and card audits
        run: |
          /usr/bin/python3 scripts/audit_tasks.py --output /tmp/certification.json
          /usr/bin/python3 scripts/check_numeric_keys_hold_numbers.py
      - name: Test suite
        # The exit code is the gate. Never pipe this into anything.
        #
        # SLE_REQUIRE_FROZEN_INVENTORY is set on main and not on a pull request. The frozen
        # certification and baseline documents can only be regenerated on a Linux host with the
        # candidate sandbox, by a maintainer, so a task PR necessarily arrives with its tasks
        # outside them. Failing the contributor's run for that tests nothing about their work and
        # trains everyone to ignore a red check. Failing main for it is exactly right: by then
        # the refresh is the maintainer's own step, and skipping it is the regression.
        env:
          SLE_REQUIRE_FROZEN_INVENTORY: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: /usr/bin/python3 -m pytest tests/ -q -p no:cacheprovider
