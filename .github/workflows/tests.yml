# The benchmark's guarantees live in the candidate sandbox and the cohort runner, and both need
# Linux tools (bubblewrap, util-linux flock) that a developer laptop does not have. Without CI the
# only Linux run of the suite was whoever happened to ssh into the benchmark host: three external
# PRs landed with zero checks, and a merge went out with five red tests because a pipe swallowed
# pytest's exit code. This runs the whole suite where it can actually pass, on the two Python
# versions that matter - 3.8 is the benchmark host, 3.11 is the development default.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Evidence-binding tests read git history and refuse dirty or unknown revisions.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Sandbox tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap util-linux
          bwrap --version && flock --version
          # Bubblewrap needs unprivileged user namespaces; GitHub's Ubuntu runners allow them,
          # and this makes the failure explicit if that ever changes.
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python }}" = "3.8" ]; then
            python -m pip install "numpy==1.24.4" "scipy==1.10.1" pyyaml
          else
            python -m pip install numpy scipy pyyaml
          fi
          python -m pip install pytest
      - name: Inventory and card audits
        run: |
          python scripts/audit_tasks.py --output /tmp/certification.json
          python scripts/check_numeric_keys_hold_numbers.py
      - name: Test suite
        # Exit code is the gate. Never pipe this into anything.
        run: python -m pytest tests/ -q -p no:cacheprovider
