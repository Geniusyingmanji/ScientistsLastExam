      - isbn:9780521708425
      - isbn:9780931830149

  ClimateScience/EnergyBalanceModel:
    status: quarantined
    reason: explicit diffusion iteration is numerically unstable, embedded ERA5 attribution is not provenance-backed, and one steady profile cannot identify the seven claimed parameters; replace with a documented multi-regime inverse task

  Acoustics/RoomImpulseResponse:
    status: quarantined
    reason: reference-length candidates crash against a shorter baseline and the fixed simplified image-source proxy lacks robust hidden-scene validation
  Astrodynamics/LowThrustTransfer:
    status: quarantined
    reason: the 30-day trajectory uses 1000 Euler steps, causing catastrophic unforced orbital-energy drift; fuel anchors are unsupported
  ControlTheory/InvertedPendulumSwingUp:
