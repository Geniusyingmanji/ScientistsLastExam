schema_version: 2
scientific_question: Recover sparse controlled dynamical laws by actively selecting experiments, and refuse when the public model library is unsupported.
artifact: A term-support matrix, coefficient matrix, confidence, and optional null or model-inadequacy abstention.
oracle:
  model: procedurally parameterized stable two-state controlled systems, including null and out-of-library worlds
  feasibility: finite coefficient/support matrices, bounded budgeted experiment callbacks, and optional calibrated abstention
  deterministic: true
normalization:
  baseline: run one small experiment and abstain on every hidden world
  reference: exact sparse coefficients on in-library worlds and correct abstention on null or misspecified worlds
  score: development mechanism recovery normalized above always-abstain; shifted mechanism and sealed rollout prediction remain separate
citations:
- id: doi:10.1073/pnas.1517384113
  title: Discovering governing equations from data by sparse identification of nonlinear dynamical systems
- id: doi:10.1073/pnas.0609476104
  title: Automated reverse engineering of nonlinear dynamical systems
- id: doi:10.1214/ss/1177009939
  title: 'Bayesian Experimental Design: A Review'
invariants:
- exact coefficients attain perfect support, coefficient and sealed rollout scores
- experiment callbacks charge every requested integration step and fail closed on overspend
- null and out-of-library worlds reward supported abstention rather than fabricated mechanisms
- validation mechanism, rollout and per-world metrics remain evaluator-only
known_shortcuts: The public polynomial library and low-dimensional deterministic simulator are controlled research abstractions. Public seeds require a future server-held split, and real discovery claims require independent equations, measurement models and physical validation.
