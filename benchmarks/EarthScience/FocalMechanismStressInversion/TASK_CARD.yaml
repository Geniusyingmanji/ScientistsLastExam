schema_version: 2
scientific_question: Can a noisy focal-mechanism catalog with two-fold nodal-plane
  ambiguity be resolved into one stress regime (axes, shape ratio, plane assignments),
  while refusing catalogs that mix regimes or carry no coherent signal?
artifact: Principal stress axes as (trend, plunge) pairs, the shape ratio R, a 0/1
  plane choice per event, optional abstention and a confidence scalar.
oracle:
  model: deterministic seeded deviatoric stress tensors, slip-tendency-filtered fault
    sampling with Wallace-Bott slip directions, Aki-Richards nodal-plane geometry,
    Gaussian angular perturbation of both planes per event in seeded order, regime
    mixtures and uniform incoherent catalogs
  feasibility: bounded axis angles and R, a complete 0/1 plane row, charged unique
    re-analysis within a sixteen-credit budget
  deterministic: true
  external_tooling: none beyond NumPy
difficulty_ladder:
  default_level: 1
  levels:
    1: 4-degree coarse noise, 1.2-degree re-analysis
    2: 6-degree coarse noise, 1.8-degree re-analysis
    3: 8.5-degree coarse noise, 2.6-degree re-analysis
normalization:
  baseline: single un-iterated tensor fit on first-listed planes
  reference: multi-start Michael inversion with plane swaps, budgeted re-analysis and
    misfit-distribution refusal
  score: geometric mean of axis, shape-ratio and plane-assignment scores on supported
    worlds, normalized above always abstaining; false discovery and refusal separate
citations:
- id: doi:10.1029/JB089iB13p11517
  title: "Determination of stress from slip data: Faults and folds"
- id: doi:10.1017/S0016756800059987
  title: The mechanics of oblique slip faulting
invariants:
- the Wallace-Bott shear of the true tensor lies along every true slip direction
- both nodal planes of an event are perturbed independently and listed in seeded order
- axes are scored on absolute cosine so sign flips are free
- a full abstention scores exactly zero after normalization
- re-analysis is charged, once per event, and overspending invalidates the world
known_shortcuts: A constant-regime family (twelve azimuths, fixed R and plane-a
  assignment) scores 0.000. Removing the refusal gates drops the score to 0.098 with
  false-discovery rate 1.0. Formal clean Linux calibration and independent seismology
  review remain pending.
