schema_version: 2
scientific_question: Infer whether actively selected zircon U-Pb analyses support one concordant crystallization age or one crystallization-plus-lead-loss discordia, estimate the event ages, and refuse resolvable multi-event histories.
artifact: A geological history label, one or two event ages, confidence, cited measurement identifiers, or a model-inadequacy refusal.
oracle:
  model: coupled 207Pb*/235U and 206Pb*/238U radioactive-growth curves; supported lead-loss analyses are noisy points on one chord between two concordia ages, while unsupported suites combine two distinct lower intercepts
  feasibility: unique charged grain analyses under an 18-unit budget, two published precision levels, bounded finite ages, and evidence identifiers restricted to observations actually made
  deterministic: true
normalization:
  baseline: one screen measurement followed by a fixed 1000 Myr concordant interpretation
  reference: the six highest-signal analytical domains, followed by weighted concordia and discordia fits and residual-based family refusal
  score: development event-history and age recovery normalized above valid blanket abstention; age, false-discovery, refusal, coverage, confidence and held-out transfer axes remain separate
citations:
- id: doi:10.1029/TR037i003p00320
  title: Discordant uranium-lead ages, I
- id: doi:10.1016/S0016-7037(98)00059-3
  title: On the Treatment of Concordant Uranium-Lead Ages
- id: doi:10.5194/gchron-6-37-2024
  title: Modeling apparent Pb loss in zircon U-Pb geochronology
invariants:
- each concordant analysis lies on the two-decay-constant Wetherill concordia up to stated measurement noise
- every supported lead-loss suite shares exactly two concordia intercepts and varies along their chord
- unsupported suites combine two separated lower intercepts, so a single discordia leaves a resolvable residual
- screen and analytical measurements consume one and three units respectively; repeats and overspend fail closed
- cited evidence identifiers must come from distinct measurements actually made in the current world
- blanket abstention is exactly zero after normalization; mechanism, false discovery, refusal and coverage remain separate with published denominators
- malformed candidates score invalid without escaping the evaluator
- held-out worlds and per-world truth remain evaluator-only
known_shortcuts: A sweep of 192 apparent-age threshold strategies that never fit the coupled concordia or a discordia reaches 0.345 against the truth-blind reference's 0.914; using three rather than six analytical domains reaches 0.861, contiguous-domain selection 0.550, all-screen measurements 0.494, ignoring uncertainties 0.000, never refusing 0.664 and rounding ages to 50 Myr 0.553. The reduced-order model omits common-Pb correction, decay-constant uncertainty, open-system diffusion profiles and inter-laboratory systematics, so the task remains a candidate pending server-held histories and independent geochronology review.
