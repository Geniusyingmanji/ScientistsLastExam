schema_version: 2
scientific_question: Can an agent construct a cost-aware observation-network archive that improves ice-sheet
  forecasts under uncertain sensitivities and dynamics?
artifact: Four to sixteen unique, bounded-cost selections from a public catalog of velocity, elevation,
  thickness, grounding-line and basal-radar observations.
oracle:
  model: deterministic linear-Gaussian ice-sheet OSSE with a public proxy sensitivity matrix, fixed Kalman
    update, seeded state/noise ensembles and sealed sensitivity, noise and forecast-dynamics shifts; ensemble
    forecast errors and CRPS are shape-checked and reduced with NumPy
  feasibility: unique valid catalog selections with three to ten observations and total cost within the
    public budget
  deterministic: true
  external_tooling: NumPy for ensemble/forecast shape checks, RMSE and CRPS reduction
difficulty_ladder:
  default_level: 1
  levels:
    1: working observation noise, proxy-exact mismatch and stresses
    2: 15 percent more noise, 25 percent more mismatch and 18 percent stronger stresses
    3: 32 percent more noise, 55 percent more mismatch and 38 percent stronger stresses
normalization:
  baseline: four clustered low-cost velocity networks recomputed for each world
  reference: Unit-normalized forecast A-optimal greedy selection with budget-feasible exchange refinement;
    it searches a coarse budget grid and scores 0.680 against an oracle anchor that covers every
    integer budget from five through eighteen.
  score: exact-OSSE forecast-skill-versus-cost Pareto hypervolume above baseline, floored at zero and
    uncapped above the dense-budget anchor; CRPS, physical RMSE, posterior diagnostics, held-out transfer and worst-shift
    robustness remain separate
citations:
- id: doi:10.5194/tc-19-5423-2025
  title: Estimation of the state and parameters in ice sheet model using an ensemble Kalman filter and
    Observing System Simulation Experiments
- id: doi:10.5194/tc-17-4661-2023
  title: Choice of observation type affects Bayesian calibration of Greenland Ice Sheet model simulations
invariants:
- adding an independent finite-noise observation cannot increase public linear-Gaussian posterior covariance
- posterior covariance remains symmetric positive definite for every valid design
- zero proxy-exact shift makes proxy and exact OSSE metrics agree
- every design within a world is compared on the same deterministic truth and noise ensemble
- identical fixed designs reproduce physical RMSE, CRPS and hypervolume exactly
- the shipped greedy archive exceeds the clustered weak baseline on development worlds
known_shortcuts: 'The historical greedy construction scores 0.435609 development and 0.317681
  robustness against the current 0.679581/0.554644 witness. Filling every omitted integer budget
  with the same public greedy/exchange method reaches the score-one anchor by construction, so the
  reference score is not a model-difficulty result. Sensor-type quotas, cost-only and single-forecast
  selections remain unmeasured. The linear-Gaussian OSSE requires clean Linux replay, server-held
  worlds, nonlinear ice-flow replication and mission-domain review.'
