schema_version: 2
scientific_question: Can an agent construct a cost-aware observation-network archive that improves ice-sheet forecasts under uncertain sensitivities and dynamics?
artifact: Four to sixteen unique, bounded-cost selections from a public catalog of velocity, elevation, thickness, grounding-line and basal-radar observations.
oracle:
  model: deterministic linear-Gaussian ice-sheet OSSE with a public proxy sensitivity matrix, fixed Kalman update, seeded state/noise ensembles and sealed sensitivity, noise and forecast-dynamics shifts
  feasibility: unique valid catalog selections with three to ten observations and total cost within the public budget
  deterministic: true
normalization:
  baseline: four clustered low-cost velocity networks recomputed for each world
  reference: a shipped truth-blind greedy A-optimal multibudget archive recomputed from the public proxy
  score: exact-OSSE forecast-skill-versus-cost Pareto hypervolume above baseline; CRPS, physical RMSE, posterior diagnostics, held-out transfer and worst-shift robustness remain separate
citations:
- id: doi:10.5194/tc-19-5423-2025
  title: Estimation of the state and parameters in ice sheet model using an ensemble Kalman filter and Observing System Simulation Experiments
- id: doi:10.5194/tc-17-4661-2023
  title: Choice of observation type affects Bayesian calibration of Greenland Ice Sheet model simulations
invariants:
- adding an independent finite-noise observation cannot increase public linear-Gaussian posterior covariance
- posterior covariance remains symmetric positive definite for every valid design
- zero proxy-exact shift makes proxy and exact OSSE metrics agree
- identical fixed designs reproduce physical RMSE, CRPS and hypervolume exactly
- the shipped greedy archive exceeds the clustered weak baseline on development worlds
known_shortcuts: The state and observation operators are low-dimensional linear-Gaussian abstractions. They omit nonlinear grounding-line migration, non-Gaussian structural error, orbital constraints and correlated instrument bias. Public worlds need server-held replacements, full ice-flow replication and mission-domain review before operational interpretation.
