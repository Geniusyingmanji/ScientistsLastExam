  external_assets: none
  note: All runtime worlds are generated from original repository code; cited publications are not redistributed.
contamination:
  status: cannot_be_ruled_out
  rationale: The equations, scaffold and fixed procedural family are public and were built with AI assistance; server-held worlds and an independent model family are still required.
