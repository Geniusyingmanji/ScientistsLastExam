schema_version: 2
scientific_question: Can a charged GNSS/InSAR survey identify a supported volcanic source family and parameters while refusing null or resolvably out-of-family deformation?
artifact: Probabilities over a public source family, one bounded parameter row, confidence and optional model-inadequacy abstention.
oracle:
  model: deterministic elastic Mogi, sill and dike responses with procedural sources, zero-deformation nulls and two-source or rheological misspecification
  feasibility: finite bounded source artifacts and unique charged station surveys under an eighteen-unit budget
  deterministic: true
normalization:
  baseline: one coarse GNSS survey followed by abstention on every world
  reference: a shipped truth-blind family-and-parameter grid-search witness and exact supported-world ceiling
  score: source probability, parameter recovery and sealed displacement prediction normalized above always abstaining; Brier calibration and refusal remain separate
citations:
- id: doi:10.1029/2009JB006958
  title: Statistical selection of the best seismic source mechanisms from inversions of synthetic volcanic long-period events
invariants:
- translated sources produce correspondingly translated displacement fields
- exact source families and parameters attain unit mechanism and sealed-prediction scores
- null and resolvable two-source or rheological responses reward refusal
- GNSS and InSAR observations agree under the public look-vector projection
- survey cost is charged and malformed or overspent surveys fail closed
known_shortcuts: The public half-space source expressions are reduced-order elastic abstractions with synthetic independent noise. They omit topography, heterogeneous elastic structure, temporal source evolution and atmospheric InSAR errors. Public procedural worlds require server-held confirmation and real claims require independent geodetic and geological evidence.
