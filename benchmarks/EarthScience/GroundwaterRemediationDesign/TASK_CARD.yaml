schema_version: 2
scientific_question: Can an agent construct a receptor-compliant pump-and-treat Pareto archive that balances contaminant removal and lifecycle cost across uncertain transport regimes?
artifact: Four to sixteen unique remediation plans, each containing bounded extraction-well locations, start years and pumping rates.
oracle:
  model: deterministic Gaussian advection-dispersion-decay plume with location-dependent capture, discounted pumping cost and sealed velocity, dispersion, decay and continued-release shifts
  feasibility: finite unique archives, bounded wells and pumping, and receptor concentrations below the public cleanup threshold
  deterministic: true
normalization:
  baseline: four low-intensity single-well plans recomputed for every aquifer
  reference: a shipped truth-blind plume-aligned multirate archive recomputed for every aquifer
  score: exact-model cleanup-versus-lifecycle-cost Pareto hypervolume above baseline; feasibility, proxy promotion, held-out transfer and worst-shift robustness remain separate
citations:
- id: doi:10.1016/S0309-1708(01)00020-3
  title: Multi-objective optimal design of groundwater remediation systems
- id: doi:10.1186/2193-2697-2-6
  title: Groundwater remediation design using physics-based flow, transport, and optimization technologies
invariants:
- zero pumping cannot remove more contaminant than an otherwise identical active plan
- lifecycle cost increases with well count or pumping volume under fixed geometry
- only receptor-compliant plans contribute Pareto hypervolume
- exact and proxy transport agree when all hidden shift multipliers are one
- the shipped reference archive exceeds the weak baseline on development aquifers
known_shortcuts: The deterministic Gaussian plume and empirical capture kernel are reduced-order abstractions. They omit transient heads, layered three-dimensional flow, sorption and treatment-plant hydraulics. Public aquifers need server-held replacements, MODFLOW transport replication and independent hydrogeology review before any field claim.
