schema_version: 2
scientific_question: Can a bounded dating program jointly recover chronology and a probabilistic paleotemperature
  history while refusing null or nonstationary proxy systems?
artifact: Temperature mean/std and monotone sample ages, with legacy constant offsets accepted.
oracle:
  model: Monotone piecewise-linear variable-accumulation age-depth maps, linear pseudoproxies, red-noise
    climate, dating noise and unsupported regimes; NumPy climate scoring.
  feasibility: finite aligned reconstructions, positive uncertainty and charged per-record dating under
    a sixteen-unit budget
  deterministic: true
  external_tooling: NumPy for fixed-grid climate time-series alignment, CE and RMSE reduction
difficulty_ladder:
  default_level: 1
  levels:
    1: 6 accumulation segments, offset <=150 years
    2: 9 accumulation segments, offset <=190 years and elevated noise
    3: 12 accumulation segments, offset <=230 years and elevated noise
normalization:
  baseline: three sparse dating calls, constant age offsets and an overconfident proxy-average reconstruction
    on every world
  reference: Public-input joint monotone accumulation/climate MAP fitting followed by age-error-aware
    GP reconstruction.
  score: Geometric mean of clipped CE, exp(-age_MAE/65 - age_increment_MAE/12), and exp(-CRPS/0.45), normalized
    above always abstaining.
citations:
- id: doi:10.1029/2020GL090485
  title: Quantifying Structural Uncertainty in Paleoclimate Data Assimilation
- id: doi:10.5194/cp-16-1325-2020
  title: Greenland temperature and precipitation over the last 20,000 years using data assimilation
invariants:
- exact climate and chronology attain unit mechanism skill on supported pseudoproxies
- coefficient of efficiency and RMSE agree with independent direct formulas
- normal CRPS is finite, proper and decreases for sharper calibrated reconstructions
- null and resolvable nonlinear or nonstationary proxy systems reward refusal
- every date consumes budget and invalid or overspent requests fail closed
- Age curves with correct endpoints but wrong internal increments lose chronology skill.
known_shortcuts: 'Historical reviewed head: five-date linear interpolation / unweighted mean / constant
  std attained 0.698764/0.682105 against 0.736298/0.708775. This invalidated the earlier shortcut claim.
  The revised curve-increment score and joint public-input reference are audited by verification/replay_review.py
  (1008 fixed cheap strategies and six ablations); current Linux results are in references/review_replay.json
  and known_best.md. No calibration draw is claimed. Current clean Linux replay: best 0.435979/0.387287,
  reference 0.797985/0.714963; 1008 grid settings.'
