schema_version: 2
scientific_question: Can a bounded dating program jointly recover chronology and a probabilistic paleotemperature history while refusing null or nonstationary proxy systems?
artifact: Temperature mean and uncertainty on a public time grid, one age offset per proxy, confidence and optional model-inadequacy abstention.
oracle:
  model: deterministic procedural linear pseudoproxies with hidden chronology offsets, red-noise climate histories, independent dating noise, nulls and nonlinear nonstationary misspecification; climate fields are coordinate-aligned and reduced with xarray
  feasibility: finite aligned reconstructions, positive uncertainty and charged per-record dating under a sixteen-unit budget
  deterministic: true
  external_tooling: xarray 2023.6.0 for coordinate-labeled climate time-series alignment, CE and RMSE reduction
difficulty_ladder:
  default_level: 1
  levels:
    1: offsets within 150 years and working proxy/dating noise
    2: offsets within 190 years with 18 percent more proxy noise and 25 percent more dating noise
    3: offsets within 230 years with 38 percent more proxy noise and 55 percent more dating noise
normalization:
  baseline: three sparse dating calls followed by abstention on every world
  reference: the evaluator recomputes a shipped truth-blind dated-proxy interpolation witness and exact pseudoproxy ceiling on every world
  score: CE, chronology and CRPS recovery normalized above always abstaining; raw RMSE, uncertainty calibration, refusal and held-out transfer remain separate
citations:
- id: doi:10.1029/2020GL090485
  title: Quantifying Structural Uncertainty in Paleoclimate Data Assimilation
- id: doi:10.5194/cp-16-1325-2020
  title: Greenland temperature and precipitation over the last 20,000 years using data assimilation
invariants:
- exact climate and chronology attain unit mechanism skill on supported pseudoproxies
- coefficient of efficiency and RMSE agree with independent direct formulas
- normal CRPS is finite, proper and decreases for sharper calibrated reconstructions
- null and resolvable nonlinear or nonstationary proxy systems reward refusal
- every date consumes budget and invalid or overspent requests fail closed
known_shortcuts: xarray supplies authoritative labeled climate-array alignment and reduction, not the proxy-system physics. The benchmark uses global standardized pseudoproxies, a single offset per archive and independent Gaussian observation errors. It omits preservation bias, depth-dependent accumulation, multivariate local climate and real proxy-system calibration. Public procedural worlds need server-held confirmation and no result is an Earth reconstruction.
