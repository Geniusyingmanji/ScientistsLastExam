novelty_risk:
  level: medium
  rationale: Optimal fingerprinting, total least squares and the residual consistency check are textbook (Hasselmann 1993; Allen and Tett 1999; Allen and Stott 2003) and a model may recognise them. What is not published is which world is misspecified, and the ablation shows the score turns on combining a control-based null, the noise-aware fit and the consistency test under one budget rather than on recalling any of them.
