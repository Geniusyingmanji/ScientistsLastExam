schema_version: 2
scientific_question: Can budgeted diffraction windows quantify a mineral mixture,
  ignore an amorphous hump, and refuse an unknown crystalline phase?
artifact: A claimed mineral set, crystalline weight fractions, optional abstention
  and a confidence scalar.
oracle:
  model: twelve-mineral public peak library with Gaussian peaks and width jitter,
    seeded Dirichlet mixtures of two to four phases, amorphous humps at 20-35
    percent, and unknown-phase worlds with five sharp out-of-library peaks
  feasibility: library names only, unique nonempty sets, fractions summing to one,
    charged scans within a four-unit budget
  deterministic: true
  external_tooling: none beyond NumPy/SciPy
difficulty_ladder:
  default_level: 1
  levels:
    1: the shipped noise, library and mixture structure
normalization:
  baseline: two fixed minerals with uniform fractions
  reference: weighted nonnegative least squares over merged windows with a
    local-contrast sharpness refusal gate
  score: 0.7 set F1 plus 0.3 log-ratio fraction score on supported worlds,
    normalized above always abstaining
citations:
- id: doi:10.1107/S0021889869006558
  title: A profile refinement method for nuclear and magnetic structures
invariants:
- claimed fractions are relative to the crystalline portion
- the amorphous hump is broad and must not trigger refusal
- unknown-phase peaks are sharp and unabsorbable by any library fit
- a full abstention scores exactly zero after normalization
known_shortcuts: Fixed two-mineral claims score zero; the reference reaches 0.396/0.450 with zero false discoveries and full refusal, leaving fraction accuracy as the documented headroom. Formal clean Linux calibration and independent review remain pending.
licensing:
  task_package: repository_license_not_declared
  external_assets: none
  note: All peak libraries are synthetic; cited publications are not redistributed.
contamination:
  status: cannot_be_ruled_out
  rationale: The mineral names and peak positions echo real powder files; the
    mixtures, humps and unknown phases are procedural.
