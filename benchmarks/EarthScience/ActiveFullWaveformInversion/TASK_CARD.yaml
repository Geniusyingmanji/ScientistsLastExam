schema_version: 2
scientific_question: Can a bounded shot program recover a supported acoustic velocity structure and refuse
  null or resolvably non-acoustic responses?
artifact: A bounded two-dimensional velocity grid, confidence and an optional model-inadequacy abstention.
oracle:
  model: deterministic constant-density 2-D acoustic finite differences with procedural smooth anomalies,
    no-anomaly nulls and attenuating out-of-family responses; waveform misfit is aligned and aggregated
    with NumPy
  feasibility: finite bounded velocity grids and strictly charged source acquisitions under a three-unit
    budget
  deterministic: true
  external_tooling: NumPy for fixed-grid time/receiver waveform alignment and reduction
difficulty_ladder:
  default_level: 1
  levels:
    1: working noise and anomaly count
    2: 30 percent more observation noise and one additional anomaly
    3: 65 percent more observation noise and two additional anomalies
normalization:
  baseline: one central shot followed by abstention on every world
  reference: Bounded two-stage smoothed/full-waveform least squares over a 3x5 velocity correction grid.
  score: depth-weighted structure and sealed-frequency waveform recovery normalized above always abstaining;
    refusal, calibration and held-out transfer remain separate
citations:
- id: doi:10.1190/1.3238367
  title: An overview of full-waveform inversion in exploration geophysics
- id: arxiv:2003.14181
  title: 'Wavefield Reconstruction Inversion: an example'
invariants:
- constant velocity produces stable finite waveforms and identical repeated traces
- exact supported velocity fields attain unit structural and sealed-waveform scores
- no-anomaly and attenuating responses reward refusal instead of fabricated structure
- every acquisition consumes budget and overspending fails closed
- held-out shots, frequencies, worlds and mechanism metrics remain evaluator-only
known_shortcuts: 'NumPy supplies fixed-grid shape checks and array reductions, not the wave
  physics. The local simulator is a small constant-density acoustic benchmark with public grid geometry
  and omits elasticity, three-dimensional acquisition, realistic source signatures and field preprocessing.
  Public procedural worlds require future server-held replacements, and scientific claims require independent
  wave solvers and field validation. Hardening: The reference now optimizes signed spatial velocity corrections
  instead of drawing a fixed negative lens. A finer grid, source design and more complete inversion remain
  open. Reproduce local sweeps with scripts/diagnose_pr9_earth.py --sweeps; numerical admission
  evidence is pending clean Linux replay.'
