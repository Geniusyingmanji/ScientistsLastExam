schema_version: 2
scientific_question: Can a bounded shot program recover a supported acoustic velocity structure and refuse
  null or resolvably non-acoustic responses?
artifact: A bounded two-dimensional velocity grid, confidence and an optional model-inadequacy abstention.
oracle:
  model: deterministic constant-density 2-D acoustic finite differences with smooth random heterogeneous
    velocity fields throughout the full depth range, unresolved near-null structure, independently varying
    source-timing errors and structural attenuation; NumPy waveform alignment and aggregation
  feasibility: finite bounded velocity grids and strictly charged source acquisitions under a three-unit
    budget
  deterministic: true
  external_tooling: NumPy for fixed-grid time/receiver waveform alignment and reduction
difficulty_ladder:
  default_level: 1
  levels:
    1: working noise and smooth heterogeneous fields
    2: diagnostic only; 30 percent more noise and more spatial components; unvalidated after the world
      revision
    3: diagnostic only; 65 percent more noise and more spatial components; unvalidated after the world
      revision
normalization:
  baseline: one central shot followed by a confident background-velocity claim on every world
  reference: Standalone public-input acoustic inversion witness; algorithm and measured comparisons are
    recorded in references/known_best.md.
  score: background-relative depth-weighted structural skill (background or worse gives zero) and sealed-frequency
    waveform recovery normalized above always abstaining; refusal, calibration and held-out transfer remain
    separate
citations:
- id: doi:10.1190/1.3238367
  title: An overview of full-waveform inversion in exploration geophysics
- id: arxiv:2003.14181
  title: 'Wavefield Reconstruction Inversion: an example'
invariants:
- constant velocity produces stable finite waveforms and identical repeated traces
- exact supported velocity fields attain unit structural and sealed-waveform scores
- background and worse-than-background predictions receive zero structural skill
- structured attenuating worlds occur in both splits; at least one defeats the old global energy gate
- near-null, source-timing and attenuating responses reward refusal instead of fabricated structure
- every acquisition consumes budget and overspending fails closed
- held-out shots, frequencies, worlds and mechanism metrics remain evaluator-only
- ten supported worlds per split with disjoint development and heldout seeds
- all three unsupported regimes have seed-dependent velocity fields and independent noise; the near-null is a shared negative control, not independent geological-transfer evidence
- the deep region contains genuine structure; a fixed shallow-only reconstruction discards signal
known_shortcuts: 'The September 10 maintainer review invalidated the previous claimed bound: continuous
  Gaussian fitting with discrepancy stopping and a depth cap achieved 0.820084/0.561552 versus the old
  reference 0.714101/0.660180. The old 58.7/55.0 percent ratios were not upper bounds. This revision changes
  the world family and recording duration; archived scores are not transferable. scripts/audit_fwi_revision.py
  tests continuous one/three/five-blob families with noise and depth priors and all single/pair source
  choices. The final three-shot reference measures 0.664800/0.551567; best development-selected single
  and pair measure 0.512128/0.391881 and 0.620585/0.469126. These finite audits are not universal shortcut
  bounds. Full threshold sweeps, uncertainty and remaining admission limitations are recorded in references/known_best.md.'
licensing:
