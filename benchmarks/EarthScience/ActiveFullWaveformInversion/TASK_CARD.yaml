  evaluator_security: targeted_regressions_and_real_linux_sandbox_checks
provenance:
  class: procedural
  target_source: Repository-visible deterministic acoustic simulator with development and held-out structural,
    noise and model-misspecification regimes.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: predeclared_procedural_seeds_completed_external_validation_pending
novelty_risk:
  level: medium
  rationale: Geophysics/GravityInversion also uses paid observations and model-inadequacy refusal, but
    recovers potential-field parameters. This task returns a two-dimensional acoustic velocity grid and
    tests transfer to sealed shots and frequencies. The public acoustic scaffold remains a contamination
    risk; builder-model independence is not established.
