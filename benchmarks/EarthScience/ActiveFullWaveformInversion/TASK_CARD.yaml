  status: complete
  builder_model_ids:
  - openai-codex
  builder_scaffolds:
  - repository-native-earth-science-task-pattern
  calibrator_model_ids: []
  calibration_runs: []
  calibration_evidence_status: missing
  edits_triggered_by_model: No frontier-model draw has been run. Local code review replaced the fixed
    negative lens with signed spatial velocity corrections and added contract and regression checks; the
    historical method comparison is retained as non-causal diagnostic evidence. The 2026-09-07 revision
    measured the three first-shot no-inversion families, found a constant lens above the single-pass 3x5
    reference, and replaced that reference with a coarse-to-fine 3x5-to-5x8 grid-continuation fit (historically
    0.615339 development). The September 9 revision removes the structural-score floor, adds structured
    attenuation and measures paid-shot ablation; current scores and method margins are recorded in known_best.md
    and pinned in tests/test_pr9_earth_hardening.py. A subsequent solver-only revision adds exact tangent
    sensitivities, minimum-change regularization and late receiver balancing; development-only selection,
    source freeze and fresh-world failures are documented in references/solver_confirmation_2026-09-09.json.
    No scoring or world changes were made for that solver improvement. A separate review completion then
    isolates noise streams by world kind and remeasures both references and all probes without retuning
    the solver or changing the score formula. The September 11 review follow-up replaces the low-dimensional
    Gaussian truth family with smooth random heterogeneous fields, covers deep structure, expands both
    splits to ten supported worlds and independently varies all unsupported regimes. Continuous Gaussian
    fitting, exhaustive source choices and stratified world uncertainty are now included in the review
    audit. Exact derivatives are a numerical implementation choice, not claimed independent scientific
    capability.
