  note: All waveforms and velocity worlds are generated from original repository code; cited publications
    are not redistributed.
contamination:
  status: cannot_be_ruled_out
  rationale: The acoustic family, grid and scaffold are public and AI-assisted; server-held worlds and
    an independent solver are still required.
review:
