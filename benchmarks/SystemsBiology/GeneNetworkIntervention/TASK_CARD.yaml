schema_version: 1
scientific_question: Recover a signed nonlinear dynamic gene-regulatory network through active CRISPRi/a-like perturbations, design a sparse phenotype intervention, and refuse when the public network family is unsupported.
artifact: Signed source-by-target weights, kinetic parameters, a calibrated nontrivial-network or model-family claim, and a sparse intervention on actionable regulators of a protected phenotype readout.
oracle:
  model: procedurally parameterized stable four-gene logistic-sigmoid ODEs with null networks and latent-regulator alternatives
  feasibility: finite bounded network and kinetic artifacts, charged perturbation callbacks, protected readout, sparse intervention, and calibrated abstention
  deterministic: true
normalization:
  baseline: one vehicle experiment followed by abstention on every hidden world
  reference: exact signed network and kinetic parameters, correct unsupported-world refusal, and a truth-only grid intervention used only for invariant calibration
  score: development geometric joint of mechanism, sealed prediction and phenotype utility normalized above always-abstain; intervention transfer and held-out panels remain separate
citations:
  - id: doi:10.1126/science.1081900
    title: Inferring Genetic Networks and Identifying Compound Mode of Action via Expression Profiling
  - id: doi:10.1016/j.cell.2014.09.029
    title: Genome-Scale CRISPR-Mediated Control of Gene Repression and Activation
  - id: doi:10.1016/j.cell.2016.11.038
    title: "Perturb-Seq: Dissecting Molecular Circuits with Scalable Single-Cell RNA Profiling of Pooled Genetic Screens"
  - id: doi:10.1016/j.cell.2022.05.013
    title: Mapping information-rich genotype-phenotype landscapes with genome-scale Perturb-seq
invariants:
  - exact signed networks and parameters attain perfect mechanism and sealed trajectory scores on supported worlds
  - intervention callbacks charge duration and target count and fail closed after any overspend or malformed query
  - protected phenotype readout cannot be directly perturbed and final designs are at most two-target interventions
  - null and latent-regulator worlds reward refusal and penalize fabricated four-gene mechanisms
  - candidate code gets a fresh sandbox process and private tmpfs for every hidden world
  - held-out mechanism, prediction, intervention transfer, refusal and per-world metrics remain evaluator-only
known_shortcuts: The four-gene deterministic logistic-sigmoid family is a controlled synthetic abstraction, not a named cell line. Public procedural seeds require server-held replacement, and biological claims require measurement-error models, batch and cell-state variation, independent assays, off-target analysis and wet-lab validation.
review:
  domain: pending_external_systems_biology
  evaluator_security: automated_equation_solver_sandbox_budget_metric_sealing_and_malformed_artifact_tests
