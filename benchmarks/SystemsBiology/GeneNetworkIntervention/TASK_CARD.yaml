schema_version: 2
scientific_question: Recover a signed nonlinear dynamic gene-regulatory network through active CRISPRi/a-like perturbations, design a sparse phenotype intervention, and refuse when the public network family is unsupported.
artifact: Signed source-by-target weights, kinetic parameters, a calibrated nontrivial-network or model-family claim, and a sparse intervention on actionable regulators of a protected phenotype readout.
oracle:
  model: procedurally parameterized stable four-gene logistic-sigmoid ODEs with null networks and latent-regulator alternatives
  feasibility: finite bounded network and kinetic artifacts, charged perturbation callbacks, protected readout, sparse intervention, and calibrated abstention
  deterministic: true
normalization:
  baseline: one vehicle experiment followed by abstention on every hidden world
  reference: exact signed network and kinetic parameters, correct unsupported-world refusal, and a truth-only grid intervention used only for invariant calibration
  score: development geometric joint of mechanism, sealed prediction and phenotype utility normalized above always-abstain; intervention transfer and held-out panels remain separate
