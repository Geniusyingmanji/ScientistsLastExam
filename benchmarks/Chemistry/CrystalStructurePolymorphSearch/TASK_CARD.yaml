schema_version: 2
scientific_question: Given only a binary composition and frozen periodic pair potential, can a budgeted global search find a low-enthalpy crystal while retaining structurally distinct low-energy polymorphs?
artifact: A deterministic search policy that proposes periodic orthorhombic seeds through a charged local-relaxation callback and returns three callback-issued candidate identifiers.
oracle:
  model: periodic shifted 12-6 binary Lennard-Jones energy over the complete 5 by 5 by 5 image stencil covering the largest cutoff plus external-pressure volume work, followed by deterministic L-BFGS-B relaxation of coordinates, volume, and orthorhombic shape
  feasibility: exact species count and order, finite three-vector cell, finite N by 3 fractional coordinates, public length/volume/aspect/separation bounds, three distinct session-issued candidates, and no callback-budget violation
  deterministic: true
normalization:
  baseline: three deterministic random seeds followed by the same local relaxation
  reference: twenty-four deterministic multistarts spanning cubic and anisotropic cells, followed by exact three-member archive selection; a witness rather than a global-optimality certificate
  score: best relaxed enthalpy plus a small species-aware low-energy fingerprint-diversity term, normalized to baseline zero and witness one with no upper clip; held-out transfer and raw scientific metrics remain separate
citations:
- id: doi:10.1103/PhysRevB.73.224104
  title: A periodic genetic algorithm with real-space representation for crystal structure and polymorph prediction
- id: doi:10.1016/j.cpc.2006.07.020
  title: Crystal structure prediction using ab initio evolutionary techniques principles and applications
invariants:
- energy is invariant to a common fractional translation of all atoms
- the five-by-five-by-five periodic image stencil completely covers the largest pair cutoff under the minimum relaxed cell length
- every final candidate was locally relaxed by the trusted callback in the current world
- atom identities and stoichiometric order cannot be changed by a submission
- cell volume is parameterized to remain within its frozen bounds throughout relaxation
- the shipped three-seed archive is valid in all five worlds and defines score zero
- the twenty-four-start witness is valid in all five worlds and defines score one
- caught invalid queries and callback-budget overruns fail the world
- development score is search-visible while held-out, raw enthalpy, diversity, polymorph count, and per-world metrics are sealed
known_shortcuts: >-
  Current admission is blocked. In two canonical Linux Python 3.11 / NumPy 1.24.4 /
  SciPy 1.10.1 sandbox passes, pure 24-call cubic multistart scores 1.0910731033536747,
  incumbent perturbation/restarts score 1.299970759773847, and replaying only the three
  development-world witness records scores 1.6247986523685534 with three online calls.
  All beat the original 1.0 reference or 0.9 guard threshold. Record replay falls back
  to baseline on the two unseen compositions and has zero source-heldout score, which
  does not affect the development-only primary score. All five worlds are public
  source constants; no private or open-instance anti-memorization guarantee exists.
  Energy-only archive selection retains 0.9922909569748118, so strong diversity-driven
  difficulty is unsupported. The 25-iteration local optimizer does not verify convergence.
  This small binary LJ surrogate omits electronic structure, many-body interactions,
  variable stoichiometry, space-group constraints, phonons, temperature, kinetics and DFT.
  No output is a real-material discovery claim.
