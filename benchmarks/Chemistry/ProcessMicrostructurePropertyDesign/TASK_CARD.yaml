  - a 441-point blend-temperature grid exposed the strength of fixing time, cooling and draw at one corner
  - 343-point blend-time-draw, blend-cooling-draw and blend-temperature-draw grids scored 1.20449, 1.00999 and 1.01105 before the second hardening pass
  - the former fixed-bin reference had been selected with evaluator-private objectives and therefore did not provide candidate-equivalent construction evidence
