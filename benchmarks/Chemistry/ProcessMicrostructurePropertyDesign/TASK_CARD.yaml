  - increase reduced Arrhenius selectivity to Ec 7 and k 700, cooling sensitivity to 0.30, and align the energy normalization with the reachable 7.5 envelope
  - test no-draw, short-time, fast-cooling and single-low-temperature ablations with a 0.90 ceiling
  - anchor to a deterministic 1024-point public proxy search followed by two 11-point-per-axis coordinate-exchange passes while retaining uncapped score and sealed transfer gates
