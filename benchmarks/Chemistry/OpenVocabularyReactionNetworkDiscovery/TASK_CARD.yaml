schema_version: 2
scientific_question: Can a budgeted active policy construct previously unlisted molecular graphs and elementary edges, recover an exact synthetic reaction network, control false discoveries, and refuse null or model-inadequate worlds?
artifact: A canonicalizable coloured-molecular-graph species set, directed bond-exchange reaction set with activation energies, Boolean refusal, and calibrated confidence.
oracle:
  model: Deterministic analytic heavy-atom graph grammar with element-preserving canonicalization, one-bond-exchange edges, minimum-barrier resolution across repeated-element atom maps, exact activation barriers, null worlds, and model-inadequate worlds.
  feasibility: Every probed and submitted graph conserves the atom inventory, is connected and valence-valid; edges obey the public elementary grammar; canonical duplicate species or edges, malformed output, and budget violations fail closed.
  deterministic: true
normalization:
  baseline: Submit one legal but confidently wrong fixed edge; an independent no-probe always-abstain control also scores zero.
  reference: Independent active-frontier exploration prioritizing unseen products with a qualitative bond-strength barrier surrogate and public grammar-branching tie-break, using at most 24 charged probes per world.
  score: Mean supported-network recovery and correct unsupported-world refusal, normalized above the exact always-abstain floor to the budgeted reference and left uncapped; complete recovery can exceed one.
