novelty_risk:
  level: medium
  rationale: Reaction-network exploration and graph canonicalization are established. Frontier-Eng reaction tasks optimize continuous conditions or catalysts for fixed known reactions, whereas this cell constructs unlisted species graphs and directed edges, probes barriers, and scores false discovery and refusal without exposing a catalogue. The exact networks are benchmark-specific, and the small grammar makes exhaustive search a known shortcut, so difficulty must be measured rather than inferred.
