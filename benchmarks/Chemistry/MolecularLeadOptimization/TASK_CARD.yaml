invariants:
- SMILES canonicalization idempotence - resubmitting a canonical SMILES changes nothing
- submission-order permutation invariance of the retained set, since selection is by descending QED
- duplicate submissions collapse to one retained molecule
- monotone non-increasing retained-set size as the diversity ceiling tightens
known_shortcuts: |
  Maximizing QED alone is not sufficient and was verified not to be: a combinatorial enumeration
  over twenty privileged cores reaches mean QED 0.945, essentially the QED ceiling, yet scores
  only 0.14 because it can field just 13 of the 120 required mutually dissimilar scaffolds. The
  panel-novelty filter blocks the obvious recall shortcut of returning memorized approved-drug
  SMILES. QED, SA score and PAINS are all public, well-documented functions, so a strong search
  is expected; the difficulty is diversity-constrained breadth, not descriptor knowledge.
