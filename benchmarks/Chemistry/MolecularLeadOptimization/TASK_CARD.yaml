schema_version: 2
scientific_question: How many structurally distinct, synthetically accessible, filter-clean and novel small molecules can a search field at the drug-likeness level of approved oral drugs?
artifact: A deterministic generator returning SMILES for a disclosed multi-parameter lead-optimization profile.
oracle:
  model: RDKit cheminformatics pipeline - QED, Ertl-Schuffenhauer synthetic accessibility, Lipinski and Veber descriptors, PAINS substructure catalogue, 2048-bit Morgan radius-2 fingerprints with Tanimoto similarity
  reference_panel: 20 approved small-molecule drugs; every SMILES verified against its published average molecular weight before admission (maximum deviation 0.02 g/mol)
  feasibility: single covalent species inside the physicochemical window, below the synthetic-accessibility ceiling, free of PAINS substructures, novel against the panel, and mutually dissimilar
  deterministic: true
  external_tooling: all properties come from RDKit, not from a bespoke reimplementation
normalization:
  baseline: eight trivial small molecules that parse but clear no filter; scores exactly 0
  reference: mean QED of the structurally distinct approved drugs satisfying the same profile, recomputed at evaluation time
  score: uncapped portfolio value - summed QED over the diverse retained set amortized over the requested size, divided by the reference level
  measured_anchors:
    development: {panel_pool: 11, reference_mean_qed: 0.6998, n_required: 120, diversity_max_tanimoto: 0.25}
    sealed: {panel_pool: 8, reference_mean_qed: 0.7313, n_required: 60, diversity_max_tanimoto: 0.20}
