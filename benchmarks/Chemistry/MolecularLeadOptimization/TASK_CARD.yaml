novelty_risk:
  level: medium
  rationale: QED, the SA score and PAINS are public, well-documented functions and a strong search is expected. A score above 1.0 would be a cheminformatics result about diversity-constrained generation, not evidence of a drug candidate; no target activity, selectivity or pharmacokinetics is modelled.
