schema_version: 2
scientific_question: Can a policy preserve and discriminate competing pair-potential hypotheses by actively selecting energy/force queries, quantify parameter uncertainty and refuse misspecified interactions?
artifact: A preregistered hypothesis trajectory followed by an evidence-bound model, parameter intervals, hidden-configuration predictor, second-virial curve and Boyle-temperature decision, or a supported model-inadequacy refusal.
oracle:
  nominal: three-particle energies and Cartesian forces from public Mie 12-6 or Morse pair-potential families
  observations: actively selected bounded configurations at public temperatures with deterministic hidden energy and force noise
  misspecification: Buckingham exponential-6 pair interactions, an Axilrod-Teller three-body term, or temperature-dependent pair parameters
  feasibility: exact typed finite submission, monotone preregistered retained hypotheses, budgeted query callback and immutable returned evidence IDs
  deterministic: true
normalization:
  baseline: one valid equilateral configuration query followed by all-world library-inadequacy refusal
  reference: truth-blind diverse-distance/geometry/temperature acquisition, weighted nonlinear model comparison, covariance intervals and virial integration
  score: development lineage-acquisition-hypothesis-model-parameter-interval-prediction-thermodynamic-confidence joint normalized above the split-specific perfect all-world-refusal baseline; held-out and sealed regimes remain separate
