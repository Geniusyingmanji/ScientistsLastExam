schema_version: 2
scientific_question: From a budgeted one-dimensional SAXS trace, name the diblock melt morphology (lamella, hex, bcc, gyroid, or disorder) or refuse when the trace is a kinetically trapped mixture of two lattices or an ABC triblock with two q* families.
artifact: A morphology name from the public family list, a confidence, and an optional refusal.
oracle:
  model: frozen SAXS traces built from textbook diblock harmonic ratios plus a Leibler-like RPA peak, with mixture and ABC out-of-family worlds
  feasibility: charged I(q) measurements, morphology recovery on in-family worlds, and calibrated refusal of mixture and ABC traces
  deterministic: true
normalization:
  baseline: always publish lamellae
  reference: first-Bragg-peak location plus distinctive-harmonic probes, with an incommensurate second-peak refusal
  score: development mechanism recovery normalized above always-abstain; signal recovery, false discovery, refusal, coverage and the held-out split stay separate
citations:
- id: doi:10.1021/ma9512115
  title: "Unifying Weak- and Strong-Segregation Block Copolymer Theories"
- id: doi:10.1021/ma60080a030
  title: "Theory of Microphase Separation in Block Copolymers"
invariants:
- in-family ordered traces are a single q* family with the Matsen-Bates / Leibler harmonic ratios
- a kinetically trapped mixture and an ABC triblock each put two incommensurate q* families on the same trace
- a single broad RPA peak with no Bragg harmonics is disorder and is in-family
- declining every world scores exactly zero; the axes separate blanket abstention from confident publication
- measure calls are charged and overspend fails closed; malformed submissions score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: The generator is a reduced one-dimensional harmonic trace, not a live SCFT solve and not a digitization of Matsen and Bates Figure 2. World seeds are repository-visible and require a future server-held split. A denser q mesh can still improve q* and is leftover headroom, not an exploit.
