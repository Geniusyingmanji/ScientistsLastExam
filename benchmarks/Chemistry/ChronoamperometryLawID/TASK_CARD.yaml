schema_version: 2
scientific_question: Can a budgeted set of potential steps identify which published current-law family generated the transients, while refusing fractional transport and baseline drift that no family can express?
artifact: Six-family probabilities, active bounded parameters, optional abstention and a confidence scalar.
oracle:
  model: deterministic seeded parameters in the six public closed forms, potential response through the public amplitude factor, Gaussian noise scaling with each step's peak current, plus t^-1/3 anomalous worlds and family-plus-linear-drift worlds
  feasibility: probabilities over exactly the six families summing to one, bounded active parameter slots, charged steps within a six-unit budget
  deterministic: true
  external_tooling: none beyond NumPy/SciPy
difficulty_ladder:
  default_level: 1
  levels:
    1: 1.5 percent peak-current noise, unit drift strength
    2: 2.8 percent noise, 1.5x drift
    3: 4.5 percent noise, 2.2x drift
normalization:
  baseline: one step, uniform family probabilities and mid-range parameters
  reference: three steps, per-family bounded least squares with Akaike-style penalty, chi-square gate and variable-projection drift test
  score: geometric mean of family probability, active-parameter recovery and sealed extrapolation, normalized above always abstaining
citations:
- id: isbn:9780471057528
  title: "Electrochemical Methods: Fundamentals and Applications"
invariants:
- every family current scales with the public amplitude factor, so a shared linear term across potentials is unmodellable drift
- anomalous worlds decay as t^-1/3 and fit no family within the chi-square gate
- a full abstention scores exactly zero after normalization
- inactive parameter slots are unconstrained; active slots respect public bounds
known_shortcuts: Uniform probabilities with mid-range parameters score 0.000; the reference reaches 0.963/0.882 development/robustness with zero false discoveries. Removing the model-selection penalty drops the reference to 0.876. Formal clean Linux calibration and independent review remain pending.
