schema_version: 2
scientific_question: Can a budgeted set of potential steps identify which published current-law family generated the transients, while refusing fractional transport and baseline drift that no family can express?
artifact: Six-family probabilities, active bounded parameters, optional abstention and a confidence scalar.
oracle:
  model: deterministic seeded parameters in the six public closed forms, potential response through the public amplitude factor, Gaussian noise scaling with each step's peak current, plus t^-1/4 anomalous worlds and family-plus-linear-drift worlds
  feasibility: probabilities over exactly the six families summing to one, bounded active parameter slots, charged steps within a three-unit budget
  deterministic: true
  external_tooling: none beyond NumPy/SciPy
difficulty_ladder:
  default_level: 1
  levels:
    1: 1.5 percent peak-current noise, unit drift strength
    2: 2.8 percent noise, 1.5x drift
    3: 4.5 percent noise, 2.2x drift
normalization:
  baseline: one step, uniform family probabilities and mid-range parameters
  reference: three steps, per-family bounded least squares with Akaike-style penalty, chi-square gate and variable-projection drift test
  score: geometric mean of family probability, strict active-parameter recovery and
    sealed extrapolation, normalized above always abstaining; 1.73 percent normalized
    parameter RMS error and 2.89 percent sealed relative error each receive half credit
citations:
- id: isbn:9780471057528
  title: "Electrochemical Methods: Fundamentals and Applications"
invariants:
- every family current scales with the public amplitude factor, so a shared linear term across potentials is unmodellable drift
- anomalous worlds decay as t^-1/4 and fit no family within the chi-square gate
- cross-potential amplitude cancellation isolates additive drift without responding to
  the anomalous world's amplitude-scaled fractional decay
- a full abstention scores exactly zero after normalization
- inactive parameter slots are unconstrained; active slots respect public bounds
known_shortcuts: Uniform probabilities with mid-range parameters score 0.000. On the
  2026-09-12 hardened head the three-step reference reaches 0.798322/0.514162; deleting
  one step drops it to 0.788740/0.472766 and one step reaches 0.589515/0.454747. Disabling
  either refusal statistic lowers development refusal from 1.0 to 0.5, on different
  frozen worlds. Formal clean Linux calibration and independent review remain pending.
