schema_version: 2
scientific_question: Does a Hess-closure enthalpy network, under a replicate and
  cross-check budget, support a consistency verdict, a localized fault or a named
  drifting instrument — and is refusal on an unresolved rank-deficient branch honest?
artifact: A verdict string, flagged measurement ids, an optional instrument name,
  corrected enthalpies for every determination and a confidence scalar.
oracle:
  model: deterministic eight-isomer interconversion network with rank-7 closure, seeded
    enthalpies, balanced three-class instrument assignment with stated precisions,
    Gaussian noise, systematic instrument offsets, single slips of 28-110 kJ/mol, and a
    rank-deficient forward/reverse branch whose attribution is resolvable only by a budgeted
    cross-check
  feasibility: complete corrected-enthalpy coverage, verdict from the public vocabulary,
    unique flags, charged queries within a six-unit budget
  deterministic: true
  external_tooling: none beyond NumPy
difficulty_ladder:
  default_level: 1
  levels:
    1: stated instrument precisions, drift offsets 4-8 kJ/mol
    2: 25 percent larger uncertainties and stronger drifts
    3: 55 percent larger uncertainties and strongest drifts
normalization:
  baseline: trusts every reported value and calls the batch consistent
  reference: weighted network adjustment with exhaustive single-row drop-and-refit, coherent
    same-direction class testing with one confirming cross-check, rank-deficiency triage
  score: correction gain, verdict correctness and flagged-set diagnosis blended per
    world, normalized above both all-consistent and all-underdetermined null strategies;
    false discovery and refusal remain
    separate
citations:
- id: doi:10.1021/jp047912y
  title: Introduction to Active Thermochemical Tables - Several key enthalpies revisited
- id: doi:10.1021/acs.jpca.6c03567
  title: A perspective on Active Thermochemical Tables as critical data infrastructure
invariants:
- Hess closure holds exactly on the noise-free network
- replicates shrink random error but never a systematic offset; cross-checks reveal both
- one rank-deficient fault ambiguity is resolvable only by a targeted cross-check
- the passive auditor scores exactly zero after normalization
- malformed or overspent laboratory calls invalidate the world even when caught
known_shortcuts: Both all-consistent and all-underdetermined strategies now score zero,
  including with improved corrections. On the current head the reference is
  0.535168/0.565973. Reverting exhaustive drop-and-refit to largest-residual-only leaves
  development unchanged but drops held-out to 0.233600; removing rank-deficient-branch
  resolution gives 0.509228/0.554594, and removing drift diagnosis gives
  0.314229/0.422570. The executable no-query three-gate probe reaches
  0.509228/0.382935, leaving only a 4.85 percent development margin. Clean Linux
  calibration remains pending.
