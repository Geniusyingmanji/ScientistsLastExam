  edits_triggered_by_model: 2026-09-05 local build caught least-squares smearing of a
    giant slip into a fake class drift, a length-truncated corrected-enthalpy artifact,
    an over-tight chi-square gate that false-alarmed clean worlds, and an aggregate
    drift signal absorbed below detection; each was fixed and pinned by tests.
    The 2026-09-08 review found that the supposed pendant pair repeated an existing
    core edge and that replication removed its offset. The pair now alone observes
    an eighth species, either member may carry a persistent offset, and exact
    observational equivalence is tested. Null-strategy normalization and dynamic
    refusal/FDR denominators were also corrected; earlier calibration is superseded.
    The 2026-09-12 hardening removes the rank-deficient pair's ids and scoring branches
    from candidate-facing text, reports zero-eligible refusal as null, and divides
    coverage only by worlds where attribution is warranted after the chosen queries.
