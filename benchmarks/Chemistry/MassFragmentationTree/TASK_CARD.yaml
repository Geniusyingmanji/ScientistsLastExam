schema_version: 2
scientific_question: Can a budgeted multi-energy MS/MS audit recover a fragmentation tree
  while refusing worlds where no tree is identifiable (no surviving precursor, co-isolated
  isobar)?
artifact: Fragment-ion m/z nodes, directed edges labelled by public neutral losses,
  optional model-inadequacy abstention and a confidence scalar.
oracle:
  model: deterministic CHNO molecules, hidden multiplicative survival-cascade fragmentation
    trees over the public loss library, Gaussian mass error, log-normal intensity error,
    flat locally loss-compatible background peaks, in-source precursor loss and about-one-dalton co-isolates whose
    carbon count differs by one so isotope ratios separate them
  feasibility: at most 256 finite positive unique node m/z values and 4096 unique edges
    referencing distinct submitted nodes through mass-consistent public-library losses,
    with heavier-to-lighter direction and at most one parent per child; charged
    measurements under an eight-unit budget
  deterministic: true
  external_tooling: none beyond NumPy/SciPy (Hungarian matching)
difficulty_ladder:
  default_level: 1
  levels:
    1: 0.004 Da mass error, eight to twelve background peaks
    2: 0.007 Da mass error, ten to fifteen background peaks
    3: 0.012 Da mass error, twelve to nineteen background peaks
normalization:
  baseline: one low-energy scan claiming the intact precursor as the entire tree
  reference: truth-blind decomposition, background filtering, greedy loss attachment and
    precursor-window refusal
  score: node F1 averaged with edge F1 on supported worlds, normalized above always
    abstaining; false discovery and refusal remain separate
citations:
- id: doi:10.1073/pnas.1509788112
  title: Searching molecular structure databases with tandem MS spectra using CSI:FingerID
- id: doi:10.1186/s13321-016-0116-8
  title: Fragmentation Trees Reloaded
invariants:
- submitting the exact hidden tree scores one on supported worlds
- repeated edges cannot inflate matching recall and both F1 axes stay within zero and one
- the precursor ion never survives in in-source worlds at any energy or zoom
- co-isolates differ by about one dalton and one carbon, so M+1 isotope ratios separate
  the two precursor ions inside one zoom window
- background peaks stay flat across energies while analyte fragments rise; some decoys
  deliberately form public-library mass gaps with analyte peaks
- malformed or overspent measurement calls invalidate the world even when caught
- a full abstention scores exactly zero after normalization
known_shortcuts: The review's all-peaks/all-pairs graph is now invalid because it is not
  a tree. Its single-parent repair reaches 0.389747/0.456859 against the unchanged
  0.564467/0.524831 reference after loss-compatible flat decoys were added. Earlier top-k
  and root-attachment probes remain lower. Formal clean Linux calibration and independent
  domain validation remain pending.
licensing:
  task_package: repository_license_not_declared
  external_assets: none
  note: All runtime worlds are generated from original repository code; cited publications
    are not redistributed.
contamination:
  status: cannot_be_ruled_out
  rationale: The instrument contract, loss library and procedural family are public and
    were built with AI assistance; server-held molecules and an independent cascade model
    are still required.
review:
  domain: pending_external_mass_spectrometry
  evaluator_security: targeted_local_regressions_added_clean_linux_sandbox_replay_pending
provenance:
  class: procedural
  target_source: Repository-visible deterministic fragmentation cascade with development
    and held-out molecules, trees, backgrounds and failure regimes.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_completed
novelty_risk:
  level: medium
  rationale: CrowdedSpectrumAssignment and NMRSpectrumFitting are the closest
    in-repository spectral inverse problems, while GraphFromDistances is the nearest graph
    reconstruction task. None combines active MS/MS queries, neutral-loss tree topology
    and no-precursor/co-isolate refusal; the procedural worlds remain builder-dependent.
