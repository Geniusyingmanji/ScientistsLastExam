  calibration_runs: []
  calibration_evidence_status: missing
  edits_triggered_by_model: 2026-09-05 local build caught a zoom-path bug that resurrected
    the precursor in in-source worlds, a background filter that killed saturated fragments,
    and duplicate nodes from per-energy mass noise; each was fixed and pinned by tests.
    The 2026-09-08 review found repeated correct edges inflated edge recall beyond
    one; canonical duplicate edges are now rejected and true-edge hits deduplicated.
    Submitted node and edge counts are bounded before matching. Invalid outputs no
    longer count as discoveries, and deterministic replay is documented as ordered
    query-sequence replay with fresh repeated-measurement noise. The 2026-09-12 review
    then exposed an all-peaks/all-pairs shortcut; edge validation now enforces a
    mass-consistent single-parent forest and flat background includes loss-compatible
    decoys that require energy-contrast filtering.
