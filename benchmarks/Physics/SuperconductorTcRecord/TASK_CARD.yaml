novelty_risk:
  level: medium
  rationale: Allen-Dynes theory and the headline Tc numbers for well-known systems (H3S, LaH10) are textbook facts a model may recall directly. What is not obviously recallable is the precise implied lambda at each citation, that lambda=3.95 places the fcc-YH10 prediction above every confirmed system's coupling strength, and that pushing LaH10 to its window edge exceeds the published record -- these require applying the formula and searching, not reciting a number.
lineage:
  status: complete
  builder_model_ids:
  - anthropic:claude-sonnet-5
  builder_scaffolds:
