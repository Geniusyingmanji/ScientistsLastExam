invariants:
- Tc is always computed by evaluating the public Allen-Dynes formula at (lambda, omega_log); it is never a fitted curve whose only justification is agreement with citations
- lambda at every literal citation is solved by root-finding, not chosen, and is checked numerically to reproduce the cited Tc to within floating-point precision
- the two independently solved LaH10 lambdas (2.343 at 136 GPa, 2.344 at 170 GPa) agree to three decimal places, an emergent numerical confirmation of Errea et al. 2020's own "weakly pressure-dependent" characterization, not an assumption built into the model
- dynamical plausibility is exactly (no noise) lambda <= 3.5 AND pressure within a family's disclosed window; lambda_max_plausible is itself a literal citation (Errea et al. 2020's anharmonic lambda for LaH10), not an arbitrary threshold
- YH10fcc's proxy claim (305-326 K) implies lambda=3.951 at a comparable omega_log, above lambda_max_plausible -- a computable, re-derivable reason it is excluded, not a "never synthesized" flag
- combined_score is true_tc_k divided by 250.0 (KNOWN_RECORD_TC_K, Drozdov et al. 2019's literal confirmed record); there is no baseline subtraction, so normalization is well-defined in every regime without a numerical floor guard
- tc_model("LaH10hydride", 240.0) = 258.24 K, exceeding the 250 K published record, because omega_log rises mildly with pressure while lambda stays roughly flat within the disclosed window -- a real, checkable consequence of pushing the same formula to the edge of a window the record-setting paper itself did not test at
- a synthetic near-optimal policy submitting LaH10hydride at 240 GPa scores 1.033 on the development instance, and the shipped reference search itself scores 1.026, both confirming uncapped exceedance is real and reachable, not nominal
- the shipped reference search uses two-probe replicate screening on top candidate families specifically because a single probe cannot reliably separate LaH10 from YH9 (true Tc ~12 K apart, within one probe's ~5% noise); an earlier single-probe version of this search scored below the baseline on both apparatus instances for these fixed seeds, which is why replication is not optional in the shipped algorithm
- heldout score, probe efficiency and predicted_tc_k calibration error remain evaluator-only
known_shortcuts: Allen-Dynes theory and several of these six systems' headline Tc numbers are well-known facts a model may recall directly from training data; reciting them is necessary but not sufficient, since finding a pressure that beats the published record requires applying the formula at an untested point and correctly discounting the unrealized fcc-YH10 prediction via the lambda ceiling, not reciting a number. lambda(pressure)'s piecewise-linear shape between and beyond exact citations is a disclosed research abstraction, not literal DFT/Eliashberg output. mu_star is fixed at 0.10 for every family and pressure, a simplification; real Coulomb pseudopotentials vary by system and method. "Never realized as of construction" (2026-09) is a claim about search results gathered then, not a permanent physical claim.
