  edits_triggered_by_model: >-
    Three rounds of user review drove four successive versions. v1 was a purely procedural model
    with an invented continuous doping axis and per-world random physics jitter, rejected as not
    comparable to the cited papers' real conditions. v2 replaced it with a finite 8-row lookup
    table of literal citations, fixing comparability but making the score incapable of exceeding
    the table's own maximum. v3 modeled pressure continuously via a Gaussian fit to Tc and
    normalized against a fixed search-algorithm witness, making uncapped scoring real but leaving
    the metric one step removed from an actual physical quantity. v4 (this version), on explicit
    request that the objective match what human scientists report (Tc and pressure) and that
    feasibility be verifiable by code rather than tied to synthesis history, replaced the Gaussian
    fit with the literal Allen-Dynes formula evaluated at a solved lambda(pressure), replaced the
    search-witness normalization with a plain ratio to the actual published record (250 K), and
    replaced the "never realized in lab" flag with a computable lambda <= 3.5 criterion grounded in
    Errea et al. 2020's own reported value. Building v4 also caught and fixed a reference-search
    fragility v3's design could not have exposed: single-probe screening occasionally misranked
    LaH10 against YH9 (true Tc ~12 K apart, within one probe's noise), which a two-probe replicate
    screen fixed. No frontier searcher draw has been run against any version.
  shortcut_discoverer: user_review_plus_builder_self_audit
