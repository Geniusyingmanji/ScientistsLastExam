schema_version: 2
scientific_question: At what real conventional-superconductor family and continuous pressure does the public Allen-Dynes formula, evaluated at parameters solved to reproduce six cited records exactly, predict the highest dynamically plausible Tc -- and can a budgeted search find a point that beats the actual published record of 250 K?
artifact: A single (family, pressure_gpa) choice with a diagnostic Tc prediction and confidence, produced under a per-instance probe budget over a continuous pressure variable.
oracle:
  model: the public Allen-Dynes formula evaluated at a per-family lambda(pressure) solved (scipy.optimize.brentq) so it reproduces six cited (family, pressure, Tc) anchors from nine papers exactly, including one theoretical prediction never experimentally realized
  feasibility: a single (family, pressure_gpa) pair with family in problem["families"] and pressure_gpa finite and within [0, apparatus_pressure_ceiling_gpa], a finite non-negative predicted_tc_k, a finite confidence in [0,1], and no more than probe_budget_calls charged probe() calls; dynamical plausibility is gated by a disclosed, computable lambda <= 3.5 criterion, not by laboratory-confirmation history
  deterministic: true
normalization:
  baseline: proxy-trusting policy -- the family with the highest quoted historical-proxy Tc upper bound (a family with no quoted number can never win), submitted at that proxy's own quoted pressure, zero probes spent, never checking the implied lambda
  reference: budgeted replicate-screened probe-and-climb search (verification/reference_search.py) that avoids the one real, never-realized prediction (lambda=3.95 > 3.5) and climbs LaH10 toward its stability-window edge
  score: true Tc at the submitted (family, pressure_gpa), computed via the same Allen-Dynes formula from the true lambda/omega_log (0 if not dynamically plausible), divided by 250.0 K -- Drozdov et al. 2019's own confirmed record, not a search-algorithm reward; a plain, uncapped ratio with no baseline subtraction. heldout apparatus score, probe usage and predicted_tc_k calibration error remain evaluator-only diagnostics
