schema_version: 2
scientific_question: Can an agent actively distinguish continuous and first-order phase transitions from smooth crossover or unsupported BKT-like behavior, and recover finite-size scaling parameters under a measurement budget?
artifact: A transition type, thermodynamic critical temperature, continuous-transition exponents, finite-size shift, confidence, evidence lineage, or calibrated refusal.
oracle:
  model: deterministic reduced-order finite-size-scaling laboratory with continuous, first-order, crossover and BKT-like hidden worlds
  feasibility: valid bounded experiment queries, finite physical parameter claims, evidence IDs from the current laboratory, and calibrated refusal
  deterministic: true
normalization:
  baseline: one low-cost experiment followed by abstention on every hidden world
  reference: exact hidden descriptors for supported worlds and correct refusal on crossover and BKT-like worlds
  score: development mechanism recovery normalized above always-abstain; sealed-size prediction and shifted validation remain separate
citations:
- id: doi:10.1103/PhysRevB.30.1477
  title: Finite-size scaling at first-order phase transitions
- id: doi:10.1038/NPHYS4037
  title: Learning phase transitions by confusion
- id: doi:10.1103/PhysRevLett.132.207301
  title: Mapping Out Phase Diagrams with Generative Classifiers
invariants:
- exact supported-world descriptors and correct unsupported-world refusal attain score one
- always abstaining attains normalized score zero
- repeated evaluation of the same candidate is deterministic
- every accepted non-abstaining claim cites at least two immutable observations from its own world
- overspending or malformed callback requests fail closed
- mechanism recovery, false discovery, calibrated refusal and discovery coverage remain separately reported
- sealed-size prediction and validation-world metrics remain evaluator-only
known_shortcuts: The finite-size laboratory is a reduced-order emulator rather than raw material data or a full Monte Carlo engine. Public world families can create recognition shortcuts; server-held families, independent simulators and domain review are required before certification. Reference witnesses are calibration anchors, not experimental claims. No external dataset or restricted source is bundled; task code and generated observations are procedural and repository-local.
