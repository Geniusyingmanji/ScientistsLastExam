schema_version: 2
scientific_question: From a budgeted pulsar-pair correlation table, say whether the spatial kernel is the Hellings-Downs quadrupole of an isotropic GWB, and decline when a clock monopole, an ephemeris dipole, or an uncorrelated common process fits as well or better.
artifact: A kernel name, a confidence, and an optional refusal.
oracle:
  model: procedurally placed pulsars with pair angles and noisy correlations drawn from Hellings-Downs, monopole, dipole, or uncorrelated kernels
  feasibility: charged parametric pair-table replicates, unique-kernel gating on claimed Hellings-Downs, and calibrated refusal
  deterministic: true
normalization:
  baseline: treat a positive mean pair correlation as a GWB and always publish Hellings-Downs
  reference: least-squares comparison of the four public kernels; publish HD only when it uniquely beats the others
  score: development mechanism recovery normalized above always-abstain; signal recovery, false discovery, refusal, coverage and the held-out split stay separate
citations:
- id: doi:10.3847/2041-8213/acdac6
  title: "The NANOGrav 15 yr Data Set: Evidence for a Gravitational-Wave Background"
- id: doi:10.1086/183954
  title: "Upper limits on the isotropic gravitational radiation background from pulsar timing observations"
invariants:
- Hellings-Downs ORF is 1/2 - x/4 + (3/2) x ln x with x=(1-cos θ)/2; HD(π)=1/4 and HD(π/2)≈-0.15
- a clock error is a monopole Γ=1 and an ephemeris error is a dipole cos θ; neither is a GWB
- CURN / white pair noise has no angular kernel
- declining every world scores exactly zero; the axes separate blanket abstention from confident publication
- the legacy-named bootstrap callback draws parametric replicates from the hidden kernel; calls are charged and overspend fails closed
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: Eighteen isotropically placed pulsars and a four-kernel least-squares test are a research abstraction of a PTA, not a full Bayesian GWB analysis with red-noise hyperparameters. World seeds are repository-visible and require a future server-held split. The legacy-named bootstrap is a parametric redraw from the hidden generating kernel, not an empirical resample, so it can make kernel selection easier and must be replaced before frontier certification.
