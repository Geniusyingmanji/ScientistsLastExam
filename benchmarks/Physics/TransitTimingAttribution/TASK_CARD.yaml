invariants:
- repeated evaluation is deterministic
- unsupported-world refusals and false discoveries are reported separately from supported-world quality
- every non-abstaining claim cites at least two current query IDs
- overspending, invented IDs and malformed output fail closed
- mechanism, forecast, coverage and false-discovery metrics remain separate
- acquisition-design credit uses distinct cited measurements and a per-world feasible optimum
- development and held-out each contain three independently seeded panels with varying horizons
- held-out worlds, unsupported-family labels and exact descriptors remain evaluator-only
- development and held-out each include both unsupported reasons with non-unit denominators
known_shortcuts: A development-only scan covers 8 normalized five-query schedules, 5 RMS limits, 4 supported-family BIC gaps, 4 residual-correlation limits, and 6 out-of-family BIC gaps, for 3840 truth-blind fixed policies. The strongest policy scores 0.432153 versus reference 0.594835, or 72.65%, below the unchanged 80% guard. Its schedule is normalized to each world's candidate-visible follow-up interval, so variable horizons cannot invalidate it. Baseline and constant-family controls score zero; prior fixed-world A/B/C measurements are retained only as historical evidence in known_best.
