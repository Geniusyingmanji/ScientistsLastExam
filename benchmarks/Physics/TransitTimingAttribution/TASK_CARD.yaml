scientific_question: Can an agent actively distinguish planet-induced transit-timing variations from stellar activity, clock drift, and unsupported mixtures under a follow-up observation budget?
artifact: A TTV mechanism claim, perturbation period, next-offset forecast, confidence and immutable evidence lineage, or calibrated refusal.
oracle:
  model: deterministic reduced-order transit-timing residual laboratory with continuous-period planet and activity signals, clock drift, and two distinct unsupported families
  feasibility: bounded integer transit queries, finite mechanism parameters, evidence IDs from current measurements and calibrated refusal
  deterministic: true
normalization:
  baseline: one legal follow-up timing followed by abstention
  reference: three spread follow-ups plus one model-disagreement query, continuous-period least-squares/BIC refinement, and residual diagnostics; clean replay combined 0.430139 (development 0.632413, held-out 0.430139)
  score: each split uses all-world reward minus blanket-refusal reward, divided by supported count and bounded below at zero, multiplied by correct-refusal rate and squared discovery precision; combined_score is the lower split score, and wrong mechanisms receive no period or forecast credit
citations:
- id: doi:10.1111/j.1365-2966.2005.08922.x
  title: On detecting terrestrial planets with timing of giant planet transits
- id: doi:10.1126/science.1107822
  title: The Use of Transit Timing to Detect Terrestrial-Mass Extrasolar Planets
invariants:
- repeated evaluation is deterministic
- unsupported-world refusals and false discoveries are reported separately from supported-world quality
- every non-abstaining claim cites at least two current query IDs
- overspending, invented IDs and malformed output fail closed
- mechanism, forecast, coverage and false-discovery metrics remain separate
- held-out worlds, unsupported-family labels and exact descriptors remain evaluator-only
- development and held-out each include both unsupported reasons with non-unit denominators
known_shortcuts: PR11 review identified fixed-order, free-unsupported-claim, shared-noise and threshold-grid exploits. Per-world coordinate-seeded noise, shuffled unequal splits, fresh sessions, two unsupported reasons and the precision/refusal gates block those paths. The headline is the lower of development and held-out split scores, so development-selected schedules cannot gain from split-specific variance. Constant-family, counter and fitted no-refusal probes score 0 on both splits. The expanded development-selected fixed-schedule grids, including the 48/50-transit neighbours, reach combined 0.301806 for family A (1,000 policies; split scores 0.574956/0.301806), 0.159146 for family B (200; 0.543759/0.159146), and 0.322946 for family C (200; 0.515176/0.322946), below the 0.430139 reference. Reproduce all grids with verification/calibrate.py and the strongest witness plus degenerate probes with verification/replay_probes.py; these are finite measured families, not universal bounds.
