scientific_question: Can an agent actively distinguish planet-induced transit-timing variations from stellar activity, clock drift, and unsupported mixtures under a follow-up observation budget?
artifact: A TTV mechanism claim, perturbation period, next-offset forecast, confidence and immutable evidence lineage, or calibrated refusal.
oracle:
  model: deterministic reduced-order transit-timing residual laboratory with continuous-period planet and activity signals, clock drift, and two distinct unsupported families
  feasibility: bounded integer transit queries, finite mechanism parameters, evidence IDs from current measurements and calibrated refusal
  deterministic: true
normalization:
  baseline: one legal follow-up timing followed by abstention
  reference: three spread follow-ups plus one model-disagreement query, continuous-period least-squares/BIC refinement, and residual diagnostics; development-only expected combined 0.632413, with original measurements preserved in known_best
  score: each split uses all-world reward minus blanket-refusal reward, divided by supported count and bounded below at zero, multiplied by correct-refusal rate and squared discovery precision; for candidates valid on every world combined_score is development_score only, held-out scientific scores remain private, any invalid world rejects the entire submission with public valid=0 and combined_score=0, and wrong mechanisms receive no period or forecast credit
citations:
- id: doi:10.1111/j.1365-2966.2005.08922.x
  title: On detecting terrestrial planets with timing of giant planet transits
- id: doi:10.1126/science.1107822
  title: The Use of Transit Timing to Detect Terrestrial-Mass Extrasolar Planets
invariants:
- repeated evaluation is deterministic
- unsupported-world refusals and false discoveries are reported separately from supported-world quality
- every non-abstaining claim cites at least two current query IDs
- overspending, invented IDs and malformed output fail closed
- mechanism, forecast, coverage and false-discovery metrics remain separate
- held-out worlds, unsupported-family labels and exact descriptors remain evaluator-only
- development and held-out each include both unsupported reasons with non-unit denominators
known_shortcuts: The search score now uses development only; the previous min(development,heldout) headline violated the sealed-feedback boundary and its results remain historical. The same frozen A/B/C schedules are retained without reselection. Their registered development-score expectations are 0.574956 (A, 1000 policies), 0.543759 (B, 200), and 0.515176 (C, 200), versus reference 0.632413. These values do not satisfy the unchanged 20% separation margin; current-source secure verification must retain any failure. Original grids and limited-scope replay results are preserved in known_best; they are not universal shortcut bounds. Constant-family, counter and fitted no-refusal probes remain separate degenerate controls.
