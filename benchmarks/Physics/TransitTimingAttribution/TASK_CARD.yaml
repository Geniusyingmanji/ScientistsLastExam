scientific_question: Can an agent actively distinguish the declared synthetic periodic, activity-surrogate and quadratic-clock residual families, forecast timing offsets and refuse out-of-family histories under a follow-up observation budget?
artifact: A claim within the declared synthetic TTV residual families, timing-modulation period in transit-number units, next-offset forecast, confidence and immutable evidence lineage, or calibrated refusal; no unique astrophysical cause or unseen-planet orbital parameters are inferred.
oracle:
  model: deterministic reduced-order transit-timing residual laboratory with continuous-period planet and activity signals, clock drift, and two distinct unsupported families
  feasibility: bounded integer transit queries, finite mechanism parameters, evidence IDs from current measurements and calibrated refusal
  deterministic: true
normalization:
  baseline: two legal follow-up timings, both cited, followed by a deterministic, overconfident fixed-planet claim; never abstains and scores exactly zero
  reference: three spread follow-ups plus one model-disagreement query using a 12-model BIC-weighted posterior, continuous-period least-squares/BIC refinement, residual diagnostics, and explicit stationary-extra-component and phase-evolution checks; development-only expected combined 0.754681, with original measurements preserved in known_best
  score: each split uses all-world reward minus blanket-refusal reward, divided by supported count and bounded below at zero, multiplied by correct-refusal rate and squared discovery precision; for candidates valid on every world combined_score is development_score only, held-out scientific scores remain private, any invalid world rejects the entire submission with public valid=0 and combined_score=0, and wrong mechanisms receive no period or forecast credit
