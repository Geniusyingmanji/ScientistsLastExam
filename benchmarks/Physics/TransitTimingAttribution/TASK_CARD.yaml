novelty_risk:
  level: medium
  rationale: Unlike Exoplanets/RadialVelocityPlanets, this task attributes transit-timing residuals under an active follow-up schedule rather than detecting planets in a fixed radial-velocity series; unlike ParticlePhysics/LookElsewhereAnomaly, refusal is triggered by histories outside the declared stationary periodic/quadratic families rather than insufficient global statistical significance. Physics/CriticalPhenomenaLab also couples active experiments to mechanism attribution, but estimates scaling-law classes rather than timing families and forecasts; Exoplanets/TransmissionSpectrumSpecies resolves fixed spectral mixtures, whereas this task chooses future time coordinates and scores extrapolation and acquisition design.
