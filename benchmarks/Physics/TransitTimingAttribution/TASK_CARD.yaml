invariants:
- repeated evaluation is deterministic
- unsupported-world refusals and false discoveries are reported separately from supported-world quality
- every non-abstaining claim cites at least two current query IDs
- overspending, invented IDs and malformed output fail closed
- mechanism, forecast, coverage and false-discovery metrics remain separate
- held-out worlds, unsupported-family labels and exact descriptors remain evaluator-only
- development and held-out each include both unsupported reasons with non-unit denominators
known_shortcuts: The search score uses development only; the previous min(development,heldout) headline violated the sealed-feedback boundary and its results remain historical. The same frozen A/B/C schedules are retained byte-for-byte without reselection. Their registered development-score expectations are 0.574956 (A, 1000 policies), 0.543759 (B, 200), and 0.515176 (C, 200), versus reference 0.754681. The strongest is 76.18% of reference, below the unchanged 80% limit. Original grids and limited-scope replay results are preserved in known_best; they are not universal shortcut bounds. Constant-family, counter and fitted no-refusal probes remain separate degenerate controls.
