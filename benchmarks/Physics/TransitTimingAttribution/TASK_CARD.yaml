schema_version: 2
scientific_question: Can an agent actively distinguish planet-induced transit-timing variations from stellar activity, clock drift, and unsupported mixtures under a follow-up observation budget?
artifact: A TTV mechanism claim, perturbation period, next-offset forecast, confidence and immutable evidence lineage, or calibrated refusal.
oracle:
  model: deterministic reduced-order transit-timing residual laboratory with planet, activity, clock and unsupported worlds
  feasibility: bounded integer transit queries, finite mechanism parameters, evidence IDs from current measurements and calibrated refusal
  deterministic: true
normalization:
  baseline: one legal follow-up timing followed by abstention
  reference: four follow-ups and least-squares/BIC comparison of quadratic clock and periodic models; clean Linux replay 0.900201 development and 0.901472 held-out
  score: all-world reward minus blanket-refusal reward, divided by supported count and clipped below at zero, multiplied by correct-refusal rate; wrong mechanisms receive no period or forecast credit
citations:
- id: doi:10.1111/j.1365-2966.2005.08922.x
  title: On detecting terrestrial planets with timing of giant planet transits
- id: doi:10.1126/science.1107822
  title: The Use of Transit Timing to Detect Terrestrial-Mass Extrasolar Planets
invariants:
- repeated evaluation is deterministic
- unsupported-world refusals and false discoveries are reported separately from supported-world quality
- every non-abstaining claim cites at least two current query IDs
- overspending, invented IDs and malformed output fail closed
- mechanism, forecast, coverage and false-discovery metrics remain separate
- held-out worlds and exact descriptors remain evaluator-only
known_shortcuts: PR11 review identified a fixed-order counter exploit and free unsupported claims. Shuffled orders, distinct split sizes and fresh candidate sessions now block that path. Constant-family, counter and fitted no-refusal probes all score 0 on both splits; reference is 0.900201/0.901472. Reproduce with verification/replay_probes.py. These targeted regressions are not an exhaustive low-dimensional grid bound; finite period grids remain a reduced-order limitation.
