  rationale: Unlike Exoplanets/RadialVelocityPlanets, this task attributes transit-timing residuals under an active follow-up schedule rather than detecting planets in a fixed radial-velocity series; unlike ParticlePhysics/LookElsewhereAnomaly, refusal is triggered by physically unsupported or non-identifiable timing histories rather than insufficient global statistical significance, and the claimed object is a physical timing mechanism rather than an anomaly significance class.
