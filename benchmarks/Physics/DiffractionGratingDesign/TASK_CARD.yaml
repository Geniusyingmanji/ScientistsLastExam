known_shortcuts: The evaluator is an isotropic, lossless, one-dimensional periodic model with finite Fourier truncation and dense boundary matching. It omits roughness, absorption, finite aperture, fabrication and measurement, and its calibrated witness is not a global optimum. Server-held regimes, an independent scattering-matrix or full-wave solver, fabrication, optical measurement and external review are required before engineering or discovery claims.
