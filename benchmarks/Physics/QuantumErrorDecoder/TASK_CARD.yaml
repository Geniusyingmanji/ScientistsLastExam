schema_version: 2
scientific_question: Convert rotated surface-code syndrome data into logical observable predictions with a lower logical error rate than minimum-weight perfect matching.
artifact: A deterministic decoder callable mapping a graphlike detector error model plus a batch of detection-event bitstrings to predicted logical observable flips.
oracle:
  model: Stim-generated rotated surface-code memory-Z circuits with uniform circuit-level depolarizing, measurement-flip and reset-flip noise; seeded detector sampling; decomposed detector error model
  reference_decoder: PyMatching 2 minimum-weight perfect matching on the same decomposed detector error model
  feasibility: prediction array of shape (shots, num_observables) with binary entries, produced without importing the circuit simulator or the reference decoder
  deterministic: true
  external_tooling: oracle depends on community-standard Stim and PyMatching rather than a bespoke reimplementation
normalization:
  baseline: decoder that never predicts a logical flip; scores exactly 0 by construction
  reference: measured PyMatching logical error rates on the same seeded shot sets
  score: uncapped log-scaled logical-error-rate reduction; matching MWPM is 1.0 and beating it exceeds 1.0
  measured_anchors:
    d3_p0.005: {trivial: 0.10335, mwpm: 0.01790}
    d5_p0.005: {trivial: 0.22925, mwpm: 0.01435}
    d5_p0.010: {trivial: 0.35815, mwpm: 0.08565}
    d7_p0.005: {trivial: 0.34235, mwpm: 0.00905}
