  title: 'Stim: a fast stabilizer circuit simulator'
- id: doi:10.22331/q-2025-01-20-1600
  title: 'Sparse Blossom: correcting a million errors per core second with minimum-weight matching'
- id: doi:10.1038/s41586-022-05434-1
  title: Suppressing quantum errors by scaling a surface code logical qubit
- id: doi:10.1038/s41586-024-08148-8
  title: Learning high-accuracy error decoding for quantum processors
invariants:
- detector relabelling consistency between the error model and the syndrome batch
- shot-order permutation invariance of the aggregate logical error rate
- a decoder that ignores the syndrome reproduces the trivial logical error rate exactly
- monotone degradation of the reference anchor with increasing physical noise at fixed distance
known_shortcuts: |
  Importing PyMatching or Stim would reach the anchor without solving the decoding problem;
  both runtime and module-level imports are blocked and scored invalid. The surface code and
  MWPM decoding are extensively documented in public literature and training corpora, so a
  strong first attempt is expected to be reproduction rather than discovery; only scores above
  1.0, which require beating matching, are evidence of a novel decoding strategy. Fixed sampling
  seeds mean a sufficiently long search could in principle overfit the specific shot sets, which
  is what the sealed unseen-distance regimes are reported against.
