schema_version: 2
scientific_question: Joint multi-target recoil law and mass inference with profiled
  speed mixture and controls
artifact: An explicit model or abstention, finite parameter estimates for a supported
  mechanism, and calibrated decision confidence.
oracle:
  model: Poisson counts from coherent momentum-dependent elastic recoil spectra; Gaussian
    nuclear form factor, three isotropic speed components, independent background
    and gain controls
  feasibility: strict typed query and submission validation; per-unit counter-keyed
    sampling; budget overspend permanently invalidates the instance
  deterministic: true
normalization:
  baseline: overconfident legal baseline scores zero; blanket none and blanket abstention
    also score exactly zero
  reference: truth-blind two-stage joint Poisson fit, calibration uncertainty included,
    nuisance-profiled Fisher allocation after a charged three-target pilot
  score: mean mechanism utility minus the 1/7 blanket refusal utility, divided by
    6/7; false discovery rate, refusal, coverage, confidence and heldout diagnostics
    remain separate
citations:
- id: arxiv:1405.1420
  title: Halo-Independent Direct Detection of Momentum-Dependent Dark Matter
invariants:
- Repeated observation units are independent and charged; splitting a batch preserves
  the same counter-indexed observations.
- All public problem values, including the detector energy grid, are identical
  across worlds and splits; no free continuous world identifier is exposed.
- Public validity and feasibility depend only on development, including malformed
  return values; heldout validation cannot change search feedback.
- Global random state does not affect the frozen generator.
- Malformed or overspent candidates fail closed without exposing exception text.
- An omitted mechanism is not the same scientific decision as a valid null mechanism.
known_shortcuts: >-
  Historical variable-grid four-way single-target probe includes null/contact/q2/abstain, all three
  targets, 1/3/12 observation units and 233280 configurations: best development
  0.249535, selected heldout 0.130670, against reference 0.548485/0.499983. Exact
  continuous constant-mass bounds with perfect class decisions are 0.296772/0.294044
  (54.1%/58.8% of reference). Details are in references/known_best.md section 4 and
  experiments/dark_matter_recoil_revision_2026-09-10.json. Regression gates require even perfect-class constant masses to
  stay at most 0.6 times reference on both splits, and the development-selected
  four-way probe below 0.7 times reference with more than 0.15 absolute separation.
  This finite builder probe is not exhaustive; repository-visible seeds permit
  memorization outside the sandbox, and difficulty is not certified. Fixed-halo ablation improves heldout by 0.040096;
  free halo fitting was not uniformly necessary in that historical grid. Current
  shared-grid two-stage reference scores 0.5368049832 / 0.5480087151, with fixed
  four-way 0.2796988413 / 0.0890035523 and fixed-mass 0.2903389817 / 0.2439422043.
  The fixed-halo removal now scores 0.3574036313 / 0.5080162656. All 16 planned
  method calls are valid and full-metric pairs identical. These construction
  measurements do not clear the historical D16 failure.
