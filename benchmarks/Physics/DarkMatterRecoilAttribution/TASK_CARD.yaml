  calibration_evidence_status: historical_only
  edits_triggered_by_model: Builder checks separated incorrect mechanism claims from
    continuous parameter error and incorporated calibration uncertainty into the reference
    fit. PR 72 external review exposed clustered masses and an omitted refusal branch
    in shortcut probes. The revision uses paired log-mass strata, locally supported
    but jointly inconsistent target spectra, and complete four-way probes with exact
    constant-mass bounds. On 2026-09-11, a fixed selection-blind budget-1 campaign
    at clean source 9516d4b0 ran three gpt-5.6-sol high first proposals. Seed label
    0 was valid on all 56 worlds and scored 0.5855425654 development versus the
    predeclared 0.5486397428 reference; it therefore fails criterion D16. Seed 1
    completed only 49 of 56 worlds and is not difficulty evidence. Seed 2 was
    fully valid at 0.2802699453. No oracle, instance, reference, prompt, budget or
    threshold was changed in response. This later documentation update changes
    the package hash; the original plan and receipts retain their source binding.
    A follow-up input-boundary audit found that the public energy grid varied
    continuously by world. It is now shared, retaining the historical RNG draw
    position so other latent parameters are unchanged. This security-driven
    observation revision and a two-stage Fisher allocation reference require
    new source-bound checks and independent model
    calibration; it does not erase the failed first draw.
    The package is held for further scientific review, not admitted or certified.
