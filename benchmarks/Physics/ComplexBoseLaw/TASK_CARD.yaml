schema_version: 2
scientific_question: From budgeted mixed-cavity occupancies, recover the Bose occupation n=1/(exp(C ω^α / T^β)-1) with world-dependent exponents, and decline when the occupancy is Fermi (+1) or independent of temperature.
artifact: A family name, positive C, alpha and beta, a confidence, and an optional refusal.
oracle:
  model: procedurally parameterized Bose or Fermi occupation mixed by a hidden three-mode cavity, plus T-independent blanks
  feasibility: charged (ω, T) measurements, exponent recovery on Bose worlds, and calibrated refusal of Fermi and blanks
  deterministic: true
normalization:
  baseline: always publish textbook Bose occupation with (C, alpha, beta) = (1, 1, 1)
  reference: invert mixed occupancy with x=log(1+1/n); refuse Fermi saturation and T-independent blanks
  score: development mechanism recovery normalized above always-abstain; signal recovery, false discovery, refusal, coverage and the held-out split stay separate
citations:
- id: arxiv:2510.07172
  title: "NewtonBench: Benchmarking Generalizable Scientific Law Discovery in LLM Agents"
- id: doi:10.1007/BF01327738
  title: "Plancks Gesetz und Lichtquantenhypothese"
invariants:
- in-family occupation keeps the Bose minus sign; Fermi is the plus-sign out-of-family
- exponents α and β vary by world around 1.5 and 2 so NewtonBench's printed hard shift cannot be hard-coded
- the laboratory returns a convex combination of occupation at ω and two nearby frequencies, not raw n(ω, T)
- declining every world scores exactly zero; the axes separate blanket abstention from confident publication
- measure calls are charged and overspend fails closed; malformed submissions score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: A three-mode linear mixer is a research abstraction of NewtonBench's complex apparatus, not a full cavity QED simulation. World seeds are repository-visible and require a future server-held split. A joint fit of mixing weights plus (C, α, β) can still improve C and is leftover headroom, not an exploit.
