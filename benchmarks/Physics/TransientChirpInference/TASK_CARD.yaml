  finding: >-
    Maintainer review showed that a zero-crossing fit and a copied H1-only reference could match or
    exceed the prior reference. The redesign pairs each supported coherent world with a localized
    world whose H1 waveform and deterministic H1 noise are identical, so H1-only methods cannot
    solve both members. L1 coherence is now necessary rather than decorative. A 14-H1/10-L1
    reference scores 0.654248 development in the current in-process replay; a fresh 2,916-policy
    development sweep selects a 0.391411 threshold witness, below the unchanged 20 percent line
    0.523399. The supplied zero-crossing attack falls to 0.186648. Clean Linux double replay
    reproduced the reference and selected witness exactly, and the task contribution gate passed.
    All prior reports remain as source-bound historical evidence; fresh model D is still pending.
