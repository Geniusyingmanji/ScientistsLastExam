scientific_question: Can an agent distinguish coherent chirps, narrow-band lines and detector-localized glitches under a finite two-detector strain-observation budget, recover key transient parameters, and refuse low-SNR ambiguity?
artifact: A transient model label, initial frequency, frequency slope, event time, amplitude, confidence and immutable observation evidence, or a calibrated refusal.
oracle:
  model: deterministic coherent sinusoidal/chirping strain families, detector-localized Gaussian glitches and evaluator-only low-SNR ambiguous worlds
  feasibility: 24 unit-cost observations over fixed epochs and H1/L1 detectors, at most one query per epoch/detector pair, bounded finite claims and current-world evidence only
  deterministic: true
normalization:
  baseline: six fixed H1 observations followed by a fixed coherent-line claim
  reference: dual-detector cadence, locally refined chirp/line comparison, localization check and low-SNR refusal; clean replay 0.821949 development and 0.685320 held-out
  score: correct-label science quality with 0.30 model, 0.50 joint initial-frequency/slope or event-time parameter, and 0.20 amplitude weights; confidence is a separate calibration diagnostic; normalized above blanket refusal and multiplied by correct-refusal rate
citations:
- id: doi:10.1103/PhysRevX.6.041015
  title: Observing gravitational-wave transient GW150914 with minimal assumptions
- id: doi:10.1103/PhysRevD.85.122006
  title: FINDCHIRP an algorithm for detection of gravitational waves from inspiraling compact binaries
invariants:
- coherent chirp worlds have positive frequency slope in both detectors while line worlds have zero slope
- glitch worlds are localized primarily to H1 and have a finite event time
- ambiguous low-SNR worlds require refusal; blanket abstention is exactly zero after normalization
- duplicate queries, overspending, unknown epochs/detectors and malformed candidates fail closed
- every answer cites at least six distinct current-world observations
- model accuracy, false discovery, refusal, feasibility and held-out transfer are separate axes
known_shortcuts: PR48's original noise/sign-count heuristic scores 0/0 development/held-out. The maintained development-selected grids reach 0.584719/0.519672 (216-policy morphology), 0.565033/0.459472 (1,620-policy sign-count), 0.440667/0.286497 (2,916-policy threshold), and 0.661183/0.556308 (324-policy morphology with a five-slope lookup table), versus reference 0.821949/0.685320. Selected candidates were replayed twice in the Linux sandbox. These are finite-grid maxima, not universal bounds. All families share one reported noise standard deviation, paired slow chirps/lines overlap in sign counts, and continuous initial-frequency plus slope recovery is scored for both coherent families. Full inspiral waveforms, colored noise, detector calibration and sky delays remain out of scope.
