invariants:
- coherent chirp worlds have positive frequency slope in both detectors while line worlds have zero slope
- every supported H1 waveform is paired between a coherent world and a localized world with identical H1 observations; only L1 separates the pair
- glitch worlds are localized primarily to H1 and have a finite event time
- ambiguous low-SNR worlds require refusal; blanket abstention is exactly zero after normalization
- duplicate queries, overspending, unknown epochs/detectors and malformed candidates fail closed
- every answer cites at least six distinct current-world observations
- model accuracy, false discovery, refusal, feasibility and held-out transfer are separate axes
known_shortcuts: On the paired-world contract, the review-supplied single-channel zero-crossing estimator scores 0.186648/0.159037 and a fair H1-only reference variant scores 0/0 because every supported H1 trace has a coherent/localized twin. Development-selected grids reach 0.331990/0.356481 (216-policy morphology), 0.305562/0.419805 (1,620-policy sign-count), 0.391411/0.438745 (2,916-policy threshold), and 0.275475/0.222719 (324-policy five-slope lookup), versus reference 0.654248/0.601739. The strongest development probe is 59.83% of reference, below the unchanged 20% margin. The frozen reference and strongest witness were each replayed twice with identical full metrics on clean Linux, and the task contribution gate passed. These are finite-grid maxima, not universal bounds. Full inspiral waveforms, colored noise, detector calibration and sky delays remain out of scope.
