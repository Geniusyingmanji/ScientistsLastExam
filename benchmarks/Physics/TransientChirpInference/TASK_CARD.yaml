schema_version: 2
scientific_question: Can an agent distinguish coherent chirps, narrow-band lines and detector-localized glitches under a finite two-detector strain-observation budget, recover key transient parameters, and refuse low-SNR ambiguity?
artifact: A transient model label, frequency slope, event time, amplitude, confidence and immutable observation evidence, or a calibrated refusal.
oracle:
  model: deterministic coherent sinusoidal/chirping strain families, detector-localized Gaussian glitches and evaluator-only low-SNR ambiguous worlds
  feasibility: 24 unit-cost observations over fixed epochs and H1/L1 detectors, at most one query per epoch/detector pair, bounded finite claims and current-world evidence only
  deterministic: true
normalization:
  baseline: six fixed H1 observations followed by a fixed coherent-line claim
  reference: dual-detector cadence, chirp/line grid comparison, localization check and low-SNR refusal
  score: correct-label science quality with 0.50 parameter weight, normalized above blanket refusal and multiplied by correct-refusal rate; mechanism accuracy and composite science remain distinct
citations:
- id: doi:10.1103/PhysRevX.6.041015
  title: Observing gravitational-wave transient GW150914 with minimal assumptions
- id: doi:10.1103/PhysRevD.85.122006
  title: FINDCHIRP an algorithm for detection of gravitational waves from inspiraling compact binaries
invariants:
- coherent chirp worlds have positive frequency slope in both detectors while line worlds have zero slope
- glitch worlds are localized primarily to H1 and have a finite event time
- ambiguous low-SNR worlds require refusal; blanket abstention is exactly zero after normalization
- duplicate queries, overspending, unknown epochs/detectors and malformed candidates fail closed
- every answer cites at least six distinct current-world observations
- model accuracy, false discovery, refusal, feasibility and held-out transfer are separate axes
known_shortcuts: PR48 review found that a noise threshold and sign-count heuristic matched the old reference. The revised worlds share one noise standard deviation and include slow chirps paired with midpoint-matched lines; slope recovery is weighted and also applies to line claims. verification/calibrate.py includes both the historical threshold family and a noise/sign-count/RMS/slope grid. Old numerical bounds no longer apply; revised replay results belong in references/known_best.md. Real detector calibration, colored noise, sky-position delays and full inspiral waveform families remain outside this reduced-order model.
