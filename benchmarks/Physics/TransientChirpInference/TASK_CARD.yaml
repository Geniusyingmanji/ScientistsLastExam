scientific_question: Within declared synthetic waveform families, can an agent distinguish coherent chirps, narrow-band lines and detector-localized glitches under a finite two-detector strain-observation budget, recover key transient parameters, and refuse low-SNR ambiguity?
artifact: A transient model label, initial frequency, frequency slope, event time, amplitude, confidence and immutable observation evidence, or a calibrated refusal.
oracle:
  model: reduced-order Gaussian-windowed linear-frequency chirps and zero-slope lines, with paired coherent/localized channel responses, rescaled day-valued coordinates, independent Gaussian noise and low-SNR refusal worlds; not physical LIGO detector or source-parameter inference
  feasibility: 24 unit-cost observations over fixed epochs and H1/L1 detectors, at most one query per epoch/detector pair, bounded finite claims and current-world evidence only
  deterministic: true
normalization:
  baseline: six fixed H1 observations followed by a fixed coherent-line claim
  reference: 14 H1 plus 10 L1 observations, locally refined phase fit, cross-channel localization test and low-SNR refusal; clean Linux replay 0.654248 development and 0.601739 held-out
  score: correct-label science quality with 0.45 model, 0.35 joint initial-frequency/slope or event-time parameter, and 0.20 amplitude weights; confidence is a separate calibration diagnostic; normalized above blanket refusal and multiplied by correct-refusal rate
