  title: The Calculation of Errors by the Method of Least Squares
- id: doi:10.1103/PhysRevD.110.030001
  title: Review of Particle Physics
- id: doi:10.1103/RevModPhys.93.025010
  title: CODATA recommended values of the fundamental physical constants - 2018
- id: doi:10.1016/0197-2456(86)90046-2
  title: Meta-analysis in clinical trials
invariants:
- the three defective world kinds overlap in chi-square per degree of freedom, so the diagnosis is not reachable from the published table
- a displaced group is displaced because its calibration drifted, so its central offset and its split-test signal are the same fact rather than two independent ones
- two disagreeing methods leave every group internally sound, so no split test can reveal them and the method labels must be read
- the split budget is smaller than the table, and spending it entirely on the deviant tail halves the culprit identification rate
- declining every world scores exactly zero, and the discovery axes distinguish it from publishing a world average on every world
- uncertainty calibration is symmetric in the logarithm, so inflating an error bar threefold scores the same as understating it threefold
- split tests are charged, repeat splits of one group return the same halves, and overspend fails closed
- malformed submissions score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: The four defect kinds and the Gaussian measurement model are controlled research abstractions rather than a real literature. World seeds are repository-visible and require a future server-held split. The task measures which tests a candidate buys and what it concludes, not the reasoning that produced either.
