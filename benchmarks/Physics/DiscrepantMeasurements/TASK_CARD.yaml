schema_version: 2
scientific_question: Given eight published measurements of one constant that scatter further than their quoted uncertainties allow, decide which of four defects the body of evidence has, buy the internal-consistency tests that separate them, and refuse a world average when two methods disagree.
artifact: A diagnosis, a best value with an honest uncertainty, the identified culprit group where there is one, a confidence, and an optional refusal.
oracle:
  model: procedurally parameterized bodies of eight measurements, each group modelled as two halves so that a drifted calibration is visible to a split test and a displaced central value is its consequence
  feasibility: finite bounded parameters, charged split tests, honest-uncertainty scoring symmetric in the logarithm, and calibrated refusal
  deterministic: true
normalization:
  baseline: the inverse-variance weighted mean of the published table, declared consistent, buying nothing and declining nothing
  reference: split tests bought at both ends of the deviation ordering, then diagnosis from where the inconsistency falls
  score: development mechanism recovery normalized above always-abstain; diagnosis, accuracy, uncertainty calibration, culprit identification, false discovery, refusal, coverage and the held-out split stay separate
