novelty_risk:
  level: medium
  rationale: Network reconstruction from driven responses is published (Timme 2007; Casadiego et al. 2017) and a model may recognise the sparse-regression route - the first draw did, and beat the original reference. At eight experiments for twelve units with in-degree four the method alone is not enough; the ablation shows the score turns on the design trade-off between regression quality and hidden-unit detection, where the reference itself keeps only 0.57 coverage.
