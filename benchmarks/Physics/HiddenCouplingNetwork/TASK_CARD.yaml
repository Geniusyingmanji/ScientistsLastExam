schema_version: 2
scientific_question: Recover the signed direct coupling graph of a hidden saturating network from fewer budgeted steady-state experiments than there are units, and decline when unmeasured units make the direct graph unidentifiable.
artifact: A claimed signed edge list over the observed units, a confidence, and an optional refusal.
oracle:
  model: procedurally generated stable networks of tanh-coupled leaky units with sparse random couplings of bounded in-degree, uncoupled variants, and variants with two unmeasured undriven units coupled into and out of the observed ones; steady states solved by damped fixed-point iteration with Newton polishing
  feasibility: charged experiments with bounded drives, signed-edge F1 on fully observed coupled networks, exact gating on uncoupled networks, and calibrated refusal on hidden-unit networks
  deterministic: true
normalization:
  baseline: dense minimum-norm least squares on the raw states over random drives, never declining
  reference: Rademacher multi-unit design, per-unit orthogonal matching pursuit on tanh(x) with a BIC stop and the unit's own drive always in the model, noise-floor refusal when two or more units cannot be explained sparsely
  score: development mechanism recovery normalized above always-abstain; edge F1, false-edge rate, false discovery, null false discovery, refusal, coverage and the held-out split stay separate
citations:
- id: doi:10.1103/PhysRevLett.98.224101
  title: Revealing network connectivity from response dynamics
- id: doi:10.1038/s41467-017-02288-4
  title: Model-free inference of direct network interactions from nonlinear collective dynamics
- id: doi:10.1103/PhysRevE.85.065201
  title: Inferring network topology from complex dynamics
invariants:
- the experiment budget is two thirds of the unit count on both splits, so single-unit drives cannot cover the network and every recovery must come from the per-unit steady-state equations across experiments
- the steady-state relation is linear in tanh(x_j) with the unit's own drive as a known regressor, so a sparse regression on tanh(x) identifies each row; a regression on x is biased at useful amplitudes
- the single hidden unit is weakly coupled, so it flags several observed units' residuals at once without making any one of them obviously unexplainable; a threshold on one unit fires on hard fits and a threshold on three separates the worlds
- an uncoupled network is determinable and the empty graph is its answer; declining there scores zero, and publishing the empty graph everywhere also scores zero
- declining every network scores exactly zero by construction; the axes separate blanket abstention from confident publication
- experiments are charged and overspend fails closed; malformed submissions score zero and never raise out of the evaluator
- held-out split, per-network rows and the discovery axes remain evaluator-only
known_shortcuts: The tanh coupling form and the constant-drive steady-state protocol are controlled research abstractions of network-reconstruction-from-responses; time series, oscillatory regimes and time-varying drives are out of scope. World seeds are repository-visible and require a future server-held split. The first frontier draw (Claude Opus 5, 2026-09-03) reached 0.665 on its first proposal against a reference of 0.631 at fourteen experiments for twelve units, so the budget was cut to eight, the in-degree raised to four and the hidden units reduced to one weakly coupled unit. The reference scores 0.445 there with coverage 0.57 - it declines three of the five solvable networks - so the edge-recovery axis deliberately retains headroom.
