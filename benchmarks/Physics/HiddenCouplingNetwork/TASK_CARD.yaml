novelty_risk:
  level: medium
  rationale: Network reconstruction from driven responses is published (Timme 2007; Casadiego et al. 2017) and a model may recognise the sparse-regression route. What is not published is the budget below the unit count, the hidden-unit worlds and the refusal axis; the ablation shows the score turns on the design trade-off between regression quality and hidden-unit detection rather than on recalling the method.
