scientific_question: Can an agent actively distinguish point-lens, binary-lens and variable-source microlensing events under a finite photometric follow-up budget, recover observable duration, amplitude and feature time, and refuse mixed out-of-family events?
artifact: A model label, characteristic-duration estimate, anomaly or variability amplitude, feature time, confidence and immutable photometric evidence, or a calibrated refusal.
oracle:
  model: deterministic Paczynski point-lens curves with localized binary anomalies, sinusoidal source variability and evaluator-only mixed lens-plus-variability worlds
  feasibility: 24 unit-cost observations over fixed epochs and g/r filters, at most one query per epoch/filter pair, bounded finite claims and evidence restricted to current-world observations
  deterministic: true
normalization:
  baseline: six fixed r-band observations followed by a point-lens claim with fixed parameters
  reference: full r-band cadence, bounded physical point-lens fit, joint localized-anomaly fit, sinusoidal comparison and calibrated mixed-family refusal; continuous duration, amplitude and feature time use 1.8-day, 0.075-amplitude and 1.5-day tolerances
  score: development mechanism recovery normalized above blanket abstention; model accuracy, false discovery, refusal, budget, feasibility and held-out transfer remain separate
citations:
- id: doi:10.1086/164140
  title: Gravitational lens effect on the light from a distant star
- id: doi:10.1086/171443
  title: Extending the MACHO search to about 10^6 solar masses
- id: doi:10.1146/annurev-astro-081811-125518
  title: Microlensing and exoplanets
invariants:
- point-lens worlds follow the Paczynski magnification family and binary worlds add a localized anomaly
- variable-source worlds have smooth periodic source variability without a lensing peak
- all four families have overlapping r-band flux-range intervals, so range alone cannot identify the mechanism
- mixed lens-plus-variability worlds require refusal; blanket abstention is exactly zero after normalization
- duplicate queries, overspending, unknown epochs or malformed candidates fail closed
- every answer cites at least six distinct current-world observations
- model accuracy, false discovery, refusal, feasibility and held-out transfer are separate axes
known_shortcuts: A 576-policy no-fit statistic sweep reaches 0.542283, and a fixed-source-fraction textbook Paczynski/residual/sinusoid candidate reaches 0.417203, versus the bounded truth-blind reference at 0.926256. Both are registered executable probes under the 20% relative-margin guard. Flux ranges overlap across all four families, the instrument reports a common uncertainty floor, and confidence is calibrated against continuous correctness. Color discrimination, parallax, finite-source limb darkening, binary orbital motion and real cadence/weather systematics are not modeled; certification requires server-held events and independent astrophysical review.
