  rationale: Unlike Exoplanets/RadialVelocityPlanets, this is photometric lens-model selection rather than Doppler period search; unlike Exoplanets/TransmissionSpectrumSpecies, it is time-and-filter follow-up rather than atmospheric spectral composition; unlike Exoplanets/TransitTimingAttribution, it attributes magnification morphology rather than transit timing perturbations.
