  edits_triggered_by_model: >-
    None yet. Four construction checkpoints changed the task before any model saw it: the
    certificate representation moved from a submitted matrix to submitted squares once the exact
    PSD test proved unbounded in cost; the numerical solver moved from alternating projections to a
    factored quasi-Newton solve after Dykstra stalled 4e-2 from Tsirelson's bound where the
    factored solve reached 1e-7; the basis enumeration was reordered shortest-first after budget
    truncation left the operator identity unsatisfiable; and the largest budget was reduced from
    100 words to 40.
  shortcut_discoverer: builder_red_team
