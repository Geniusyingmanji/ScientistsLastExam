schema_version: 2
scientific_question: >-
  Produce an exact rational sum-of-squares certificate for Brunner-Gisin I_4422^{13} whose extra
  moments are a Hamming-weight subset of a frozen NPA-2 pool, not a free word budget on I3322.
artifact: >-
  A set of NPA-1 words plus at most k frozen extra moments, and a list of weighted squares over
  them, all rational, whose sum equals beta*I - B as an operator identity.
oracle:
  model: >-
    exact rational arithmetic in the free product of two groups of involutions; extra basis words
    outside the frozen pool are rejected; the bound is the identity coefficient
  feasibility: >-
    non-negative weights, reduced distinct basis words, extras in the frozen pool and within the
    Hamming-weight budget, rational entries within the magnitude cap
  deterministic: true
normalization:
  baseline: >-
    the triangle inequality written as squares over the NPA-1 basis, proving 4 and scoring zero
  reference: >-
    a hand exact SOS that replaces two CHSH blocks using four frozen BB extras and proves 7/2;
    on the logarithmic scale this lands near 0.46, not at one
  score: >-
    mean over k=4,8,12 of log10 progress from the triangle gap (4-0.25) to a wave-1 score-one
    bound of 3.0, measured in distance to the two-qubit value 0.25 and left uncapped; 3.0 is an
    evaluator target the 36-point pairing grid does not reach, not a published NPA-2 number;
    certificates below 0.25 are reported and scored zero
citations:
  - id: arxiv:0711.3362
    title: "Brunner and Gisin, Partial list of bipartite Bell inequalities with four binary settings"
  - id: arxiv:1811.11820
    title: "Cruzeiro and Gisin, Complete list of Bell inequalities with four binary settings"
  - id: doi:10.1103/PhysRevLett.98.010401
    title: "Navascues, Pironio, Acin, Bounding the set of quantum correlations"
invariants:
  - the certificate is submitted as squares; floats are rejected
  - the functional's classical bound is 0 by enumeration of 256 deterministic strategies
  - extra words must belong to the frozen 24-word NPA-2 same-party pool
  - a bound below the two-qubit value 0.25 is reported, not rewarded
  - malformed submissions score zero and never raise out of the evaluator
known_shortcuts: >-
  A 36-point grid over A/B pairings and signs finds the catalog SOS on 2 of 36 points
  (bound 3.5, log-score about 0.46) and fails the identity on the rest. The grid does
  not reach the score-one bound 3.0. Recalling I3322 NPA numbers is worth nothing.
  Degenerate floats, negative weights, pool-violating words, and over-budget extras
  score zero. Dropping one CHSH block of the catalog raises the bound to 3.75 and
  scores about 0.22.
review:
  status: pending_external
  domain: pending_external_quantum_information
  evaluator_security: >-
    Work is bounded by MAX_SQUARES * max_basis^2 capped rationals. Candidate code never runs
    in the oracle process.
provenance:
  class: known_answer
  target_source: >-
    Brunner-Gisin Appendix A table for I_4422^{13}; two-qubit value 0.25 from that paper's Table 1
    and the affine Q=1.25 in arXiv:1811.11820.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: completed_2026_09_06_classical_bound_enumeration
novelty_risk:
  level: medium
  rationale: >-
    BellBoundCertificate scores I3322 (and CHSH) under a free word-length budget with a
    published NPA-2 score-one anchor. This cell is a different inequality, I_4422^{13},
    whose extra moments must be a Hamming-weight subset of a frozen 24-word same-party
    NPA-2 pool. The evaluator algebra is adapted from BellBoundCertificate; the functional,
    the pool, and the score-one bound of 3.0 are not.
lineage:
