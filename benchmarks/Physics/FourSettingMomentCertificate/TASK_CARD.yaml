    QuantumFoundations/BellBoundCertificate (reduce_side / canonical / dagger / multiply /
    _fraction / _read_certificate). Review found a 36-point pairing grid saturating the
    linear 4→3.5 scale; the scale is now logarithmic in the gap to 0.25 with score one
