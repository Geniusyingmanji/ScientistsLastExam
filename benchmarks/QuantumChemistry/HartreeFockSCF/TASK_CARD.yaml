schema_version: 2
scientific_question: Can one deterministic numerical policy find low-energy internally stable closed-shell finite-basis Hartree-Fock occupied spaces across equilibrium, stretched, chain, ring, heteronuclear and polyatomic molecular regimes?
artifact: A finite real n_ao by n_occupied matrix of overlap-orthonormal occupied spatial-orbital coefficients.
oracle:
  model: deterministic restricted closed-shell Hartree-Fock energy and Fock matrix reconstructed from public AO overlap, one-electron and chemist-order two-electron integrals
  feasibility: exact artifact shape and finiteness, overlap orthonormality, electron count, density idempotency and normalized Roothaan-Hall residual; reference energy is never an exclusion threshold
  deterministic: true
normalization:
  baseline: conventional single core-Hamiltonian guess followed by Pulay DIIS, without multistart or stability repair
  reference: lowest internally stable fixed-seed multistart PySCF RHF witness among 97 starts for each frozen finite-basis Hamiltonian; independently replayed with NumPy/SciPy equations and not claimed globally optimal
  score: mean nominal development energy/residual utility is rescaled above the conventional policy; held-out molecules, physical geometry shifts, AO representation changes and occupied-virtual stability remain separate evaluator-only axes
