invariants:
  - every accepted occupied space is finite, real, has the exact public dimensions and is orthonormal in the supplied AO overlap metric
  - every accepted density has the public closed-shell electron count and is idempotent in an orthonormal representation
  - every nominal score is recomputed from the public integrals and gated by the Roothaan-Hall commutator residual
  - frozen reference energies and coefficients are reproduced by independent NumPy/SciPy density, Fock, energy and residual calculations
  - fixed-seed multistart references are internally stable under occupied-virtual rotations; no global or correlated-energy claim is made
  - a feasible solution below a stored reference is accepted and clips at full score rather than being rejected
  - the conventional baseline is valid and deterministic but retains a lower-energy internally stable symmetry-broken solution on the hard ring regime
  - transformed-problem energy and the AO-mapped occupied density are invariant under permutations and dense nonsingular changes of basis
  - nearby physical shifts use freshly generated molecular overlap, one-electron, two-electron and nuclear-repulsion integrals rather than arbitrary tensor noise
  - failure on evaluator-only shifts or representation checks cannot change nominal validity or the search-visible score
  - wrong-shape, non-finite, non-real, nonorthonormal and non-self-consistent nominal artifacts fail closed
  - every molecular problem and validation transformation receives a fresh candidate process and private temporary-filesystem state
  - development selection metrics are separated from held-out transfer, physical-shift, representation-invariance and stability diagnostics
known_shortcuts: The seven frozen small closed-shell systems use STO-3G or 6-31G bases and expose their complete finite-basis Hamiltonians. Programs can branch on these public matrices, so future release work needs server-held procedural molecules, geometries and basis families. RHF omits electron correlation and may be qualitatively wrong under bond stretching; only internal real-RHF stability is scored. Multistart witnesses are reproducible stationary points, not proofs of the global RHF minimum. Chemical claims require larger-basis and correlated-method replication plus independent domain review.
review:
  domain: pending_external
  evaluator_security: automated_equation_reference_stability_representation_physical_shift_fail_closed_metric_sealing_and_fresh_session_tests
