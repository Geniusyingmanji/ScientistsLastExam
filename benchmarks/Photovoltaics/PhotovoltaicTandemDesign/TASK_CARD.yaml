invariants:
  - the 2002-row ASTM-G173-derived data bundle is pinned to pvlib-python v0.13.1 commit and exact upstream and generated SHA-256 hashes under BSD-3-Clause
  - the global-tilt spectrum integrates to approximately 1000.37 watts per square metre on the stored wavelength grid
  - independent detailed-balance integration reproduces canonical ideal one-through-four-junction efficiency limits within the registered discretization tolerance
  - absorptance is zero below the band gap and monotone in optical depth and photon excess energy
  - transmitted photon flux is nonnegative and decreases after every junction
  - series operating current never exceeds any junction short-circuit current and reported maximum power is no lower than endpoint power
  - every archive row is finite, ordered, within bounds, distinct and obeys its public fabrication budget
  - the weak single-junction baseline is valid and has zero normalized nominal and robust score by construction
  - separately replayable nominal and robust witnesses improve their matching baseline for every cap and regime
  - public problems expose observable spectra and budgets but no split, seed, shifts, references or normalization values
  - every scientific regime receives a fresh candidate process and private temporary-filesystem state
  - held-out, robustness, physical-efficiency, current-matching, cost, junction-count and per-regime metrics remain evaluator-only
  - malformed, complex, non-finite, unordered, duplicate, out-of-bound and over-budget artifacts fail closed
known_shortcuts: The deterministic repository-visible reduced-order model omits non-radiative recombination, transport, interfaces, tunnel junctions, luminescent coupling, resistance, thermal balance, actual material availability and manufacturing yield. Fixed spectra and same-model search witnesses are contamination and simulator-overfitting risks. References are normalization anchors, not global optima, certified records or experimental SOTA.
review:
  domain: pending_external_photovoltaics
  evaluator_security: automated_hash_provenance_independent_physics_reference_replay_fresh_sandbox_fail_closed_and_metric_sealing_tests
