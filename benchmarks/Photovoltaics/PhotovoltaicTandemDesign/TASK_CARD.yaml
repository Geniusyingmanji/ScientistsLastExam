schema_version: 1
scientific_question: Can a policy choose the junction count, band gaps and finite optical depths of a series tandem across fabrication budgets without becoming brittle to spectrum, temperature and manufacturing shifts?
artifact: Three budget-conditioned one-to-four-junction designs containing ordered band gaps and finite optical depths.
oracle:
  nominal: hash-bound ASTM-G173-derived spectrum, finite direct-gap absorption, radiative dark current and numerical maximum-power series current matching
  feasibility: finite exact schema, one-to-four junctions, band-gap separation, variable bounds, distinct archive rows and option-specific fabrication cost
  deterministic: true
normalization:
  baseline: weak valid single-junction designs at the maximum allowed optical depth for each budget
  reference: separately calibrated fixed-seed nominal and worst-shift same-model witnesses over junction count, band gaps and optical depths
  score: development mean nominal efficiency improvement controls search; held-out spectra, worst shifts, absolute efficiency, current matching, cost and junction count remain separate
