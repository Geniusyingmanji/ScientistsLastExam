schema_version: 2
scientific_question: Can paid noisy Boolean route tests recover sparse link failures and distinguish structural
  aliases from telemetry model inadequacy?
artifact: A broken-pipe id set, optional abstention and a confidence scalar.
oracle:
  model: 4x4 Boolean route graph with 641 routes, stratified one-to-three-break identifiable worlds, service-twin
    aliases and independent fair-coin telemetry faults; development 24+6+6 and heldout 18+6+6 worlds.
  feasibility: known pipe ids, unique nonempty claims of at most six pipes, charged probes within a twenty-six-unit
    budget
  deterministic: true
  external_tooling: none beyond NumPy
difficulty_ladder:
  default_level: 3
  levels:
    1: single breaks, two percent flips
    2: up to two breaks, four percent flips
    3: up to three breaks, seven percent flips
normalization:
  baseline: one probe blaming the first pipe of the first failed route
  reference: Complete one-to-three-pipe likelihood family, cardinality prior, published noise rate, posterior
    route splitting, signature-group refusal and a fair-coin telemetry alternative.
  score: Squared set Jaccard on supported worlds, normalized above always abstaining; three mandatory
    paid corridor reports consume 3 of the 26 units.
citations:
- id: doi:10.1145/2663716.2663723
  title: Node Failure Localization via Network Tomography
- id: doi:10.1061/(ASCE)0733-9496(2008)134:6(556)
  title: The battle of the water sensor networks
invariants:
- supported-world break sets are signature-unique over the full route family
- twin pipes share exactly the same route signatures
- repeated probes of one route draw fresh flip noise
- a full abstention scores exactly zero after normalization
- three initial corridor reports are charged within the same budget
- independent fair-coin telemetry faults provide a second refusal cause
- one malformed world does not erase valid-world recovery
- fresh sandbox sessions isolate module globals and temporary files between worlds
known_shortcuts: 'Historical reviewer grid 0.960 > reference 0.600 at 898e28e. Revised clean Linux replay:
  1680-point grid best 0.502037 development / 0.110247 heldout, 0 points above reference 0.927083 / 0.802469.
  Removing three-pipe support, active selection, structural refusal, telemetry checking or the cardinality
  prior lowers development to 0.722222, 0.416667, 0.635417, 0.843750 and 0.875000 respectively. Source-bound
  full results: references/review_evidence.json; executable sandbox guard in shortcut_probe. No frontier
  calibration.'
