schema_version: 2
scientific_question: Can budgeted route tests localize broken pipes in a water grid,
  while refusing failures on twin lines no route can separate?
artifact: A broken-pipe id set, optional abstention and a confidence scalar.
oracle:
  model: 4x4 grid with several hundred monotone testable routes plus a twin service
    corridor, seeded identifiable break sets (signature uniqueness enforced at
    generation), twin and mirrored unidentifiable worlds, two percent report flips
  feasibility: known pipe ids, unique nonempty claims of at most six pipes, charged
    probes within a twenty-six-unit budget
  deterministic: true
  external_tooling: none beyond NumPy
difficulty_ladder:
  default_level: 2
  levels:
    1: single breaks, two percent flips
    2: up to two breaks, four percent flips
    3: up to three breaks, seven percent flips
normalization:
  baseline: one probe blaming the first pipe of the first failed route
  reference: likelihood-tracked hypothesis search with information-splitting route
    choice, complexity-penalized break sets, margin claims and structural-alias
    refusal
  score: broken-set F1 on supported worlds, normalized above always abstaining
citations:
- id: doi:10.1061/(ASCE)0733-9496(2008)134:6(556)
  title: The battle of the water sensor networks
invariants:
- supported-world break sets are signature-unique over the full route family
- twin pipes share exactly the same route signatures
- repeated probes of one route draw fresh flip noise
- a full abstention scores exactly zero after normalization
known_shortcuts: The reference saturates level 1 (1.000/1.000); levels 2 and 3 drop to 0.400 and 0.200 as multi-break ambiguity and flips bite. The shipped default is level 1; certification requires showing the frontier gap at level 2 plus. Formal clean Linux calibration and independent review remain pending.
