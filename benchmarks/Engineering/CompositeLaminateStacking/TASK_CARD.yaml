schema_version: 2
scientific_question: Can a structure-general policy order a fixed composite ply multiset to improve buckling
  and first-ply reserve while transferring across aspect ratios, load mixtures and orthotropic materials?
artifact: A symmetric balanced discrete ply-angle sequence with fixed composition and manufacturing constraints.
oracle:
  exact: Classical laminate A and D matrices, Navier simply-supported buckling modes 1 through 4, and
    Tsai-Hill first-ply reserve.
  feasibility: Exact ply count and multiset, allowed angles, symmetry, balance, and maximum consecutive
    equal plies; malformed values fail closed.
  deterministic: true
  model: Classical symmetric laminate A/D assembly; paired membrane and bending loads; both-face Tsai-Hill
    failure and reduced Navier buckling screening.
normalization:
  baseline: Quasi-isotropic repeating sequence satisfying every manufacturing rule.
  reference: Ten seeded permutation starts followed by one adjacent-exchange refinement pass; it
    scores 0.733 against a 900-start, full pair-exchange anchor recomputed by the oracle.
  score: Development reserve improvement is uncapped above the stronger search anchor; held-out panels and sealed material/load degradation
    remain separate.
citations:
- id: doi:10.2514/3.11710
  title: Optimization of laminate stacking sequence for buckling load maximization by genetic algorithm
- id: doi:10.1016/j.compstruct.2016.01.052
  title: An improved genetic algorithm for optimal design of composite laminates
invariants:
- Extensional stiffness is invariant to sequence permutations with fixed ply counts while bending stiffness
  is not.
- Symmetric balanced sequences have vanishing bending-extension coupling and paired off-axis counts.
- Malformed, asymmetric, unbalanced, composition-changing and over-consecutive sequences score zero without
  escaping the evaluator.
- Held-out and degradation metrics never control combined_score.
known_shortcuts: 'The quasi-isotropic repeating baseline and historical random-screening method
  both score 0 on current development panels; the latter retains 0.290505 robustness. The current
  0.732584 witness-to-anchor gap comes from additional permutation starts and wider pair exchanges
  and is finite-search headroom, not a frontier-model result. Lamination-parameter rounding and
  block-pattern families remain unmeasured. Fixed ply counts remove composition optimization, and
  the CLT/Navier surrogate still omits holes, delamination, postbuckling and anisotropic mode coupling;
  clean Linux replay and independent FEA remain required.'
