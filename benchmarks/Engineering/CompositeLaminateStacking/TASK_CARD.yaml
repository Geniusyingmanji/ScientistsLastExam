schema_version: 2
scientific_question: Can a structure-general policy order a fixed composite ply multiset to improve buckling and first-ply reserve while transferring across aspect ratios, load mixtures and orthotropic materials?
artifact: A symmetric balanced discrete ply-angle sequence with fixed composition and manufacturing constraints.
oracle:
  exact: Classical laminate A and D matrices, Navier simply-supported buckling modes 1 through 4, and Tsai-Hill first-ply reserve.
  feasibility: Exact ply count and multiset, allowed angles, symmetry, balance, and maximum consecutive equal plies; malformed values fail closed.
  deterministic: true
normalization:
  baseline: Quasi-isotropic repeating sequence satisfying every manufacturing rule.
  reference: Fixed-seed truth-blind permutation search recomputed per run over the public half-laminate.
  score: Development reserve improvement is uncapped; held-out panels and sealed material/load degradation remain separate.
citations:
- id: doi:10.2514/3.11710
  title: Optimization of laminate stacking sequence for buckling load maximization by genetic algorithm
- id: doi:10.1016/j.compstruct.2016.01.052
  title: An improved genetic algorithm for optimal design of composite laminates
invariants:
- Extensional stiffness is invariant to sequence permutations with fixed ply counts while bending stiffness is not.
- Symmetric balanced sequences have vanishing bending-extension coupling and paired off-axis counts.
- Malformed, asymmetric, unbalanced, composition-changing and over-consecutive sequences score zero without escaping the evaluator.
- Held-out and degradation metrics never control combined_score.
known_shortcuts: Fixed ply counts remove thickness and composition optimization but retain the order-sensitive bending problem. The CLT and Navier model omit holes, delamination, postbuckling and nonlinear finite-element effects; server-held panels and independent FEA remain required.
