schema_version: 2
scientific_question: Decide whether a structure's modal frequencies have shifted because an internal element lost stiffness, and if so which element and by how much, when temperature moves every frequency, the validated model carries a few per cent of error, and a changed support can move them as much as damage does.
artifact: A damage decision, an element index and a severity when damage is claimed, a confidence, and an optional refusal.
oracle:
  model: procedurally generated chains of masses joined by springs with two grounded ends, modal frequencies from the generalized eigenproblem; worlds are healthy, damaged at one internal element, or softened at one support, with a bilinear-in-temperature stiffness law whose knees lie outside the commissioning band and measurement noise scaling as the inverse square root of a day's excitation quality
  feasibility: charged measurement days from a public calendar, exact gating on the claimed element, severity scored against a declared tolerance, healthy structures scored on the decision, and calibrated refusal on support changes
  deterministic: true
normalization:
  baseline: linear temperature extrapolation of absolute frequencies against the commissioning campaign, never declining
  reference: temperature-invariant frequency ratios, a search over the declared damage family by re-solving the eigenproblem, and a refusal when the residual stays large relative to the shift
  score: development mechanism recovery normalized above always-abstain; localisation, severity, healthy false alarm, false discovery, refusal, coverage and the held-out split stay separate
citations:
- id: doi:10.1098/rsta.2006.1928
  title: An introduction to structural health monitoring
- id: doi:10.1098/rsta.2006.1935
  title: Effects of environmental and operational variability on structural health monitoring
- id: doi:10.1177/058310249803000201
  title: A summary review of vibration-based damage identification methods
invariants:
- temperature multiplies every spring by one common factor, so it scales every eigenvalue equally and cancels exactly from the frequency ratios; the ablation that uses absolute frequencies instead loses 0.31 of the score and all of the held-out score
- the stiffness-temperature law bends at both ends of the commissioning band, so any law fitted to that band and extrapolated is wrong in both directions, and the calendar spans well outside it
- excitation quality is drawn independently of temperature, so no day is both quiet-proof and confound-proof; an earlier version tied them together and a threshold rule on absolute frequencies scored 0.55 against a reference of 0.65 without ever using the ratios
- the support changes are sized so their ratio signal overlaps the damage range, so the two cannot be separated by how large the shift is, only by whether one family member explains it
- a support change is thirteen times less explainable by the declared single-element family than a true damage is, measured as the smallest relative residual over every element and severity, so every refusal world is decidable
- the published model carries up to three per cent of error against the structure the commissioning campaign measured, so the model's own healthy ratios are not the honest baseline; the reference pays 0.125 of score for using them
- the chain's nominal stiffnesses are non-uniform, which breaks the mirror symmetry that would otherwise make elements j and mass_count-j indistinguishable
- declining every structure scores exactly zero by construction, and so does never claiming damage; the axes separate blanket abstention from confident publication
- measurement days are charged and overspend fails closed; malformed submissions score zero and never raise out of the evaluator
- held-out split, per-structure rows and the discovery axes remain evaluator-only
known_shortcuts: A sweep of 1012 low-dimensional strategies - threshold the shift, declare healthy below it, decline above it, name the mode with the largest deviation - reaches 0.459 without the ratio insight and 0.321 with it, against a reference of 0.665 and a ceiling of 1.0. The spring-chain structure and the single-element damage family are controlled research abstractions of vibration-based damage identification; mode shapes, damping, multiple simultaneous damages and operational load variation are out of scope. World seeds are repository-visible and require a future server-held split. The reference declines two damaged structures it should have solved, so coverage and the model-calibration step deliberately retain headroom.
