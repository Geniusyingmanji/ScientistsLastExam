novelty_risk:
  level: medium
  rationale: Vibration-based damage identification and the temperature confound are textbook (Farrar and Worden 2007; Sohn 2007) and a model may recognise that frequency ratios cancel a global stiffness factor. What is not published is which structure has which defect, and the ablation shows the score turns on combining the ratio insight with a family search, a refusal test and a measurement budget rather than on recalling any one of them. The shortcut probe bounds what a searcher gets without the science at 0.459.
