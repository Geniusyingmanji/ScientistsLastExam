schema_version: 2
scientific_question: Can one stateful HVAC supervisory policy reduce cost, carbon and peak power across
  climates while meeting occupied comfort and indoor-air-quality constraints under forecast and plant
  error?
artifact: A stateful two-zone observation-to-heating, cooling and ventilation controller.
oracle:
  model: Deterministic coupled two-zone RC thermal and CO2 emulator at fifteen-minute resolution with
    weather, occupancy, tariff and grid-carbon traces.
  feasibility: Published finite action bounds, occupied mean excursion <=0.10 C, maximum <=0.50 C, excursion-rate
    <=0.05 and CO2 <=1100 ppm.
  deterministic: true
normalization:
  baseline: Load-compensated, occupancy-aware conservative thermostat with demand ventilation; feasible
    on every development and heldout world.
  reference: Forecast boundary tracking with online thermal disturbance estimation and one-step CO2 control.
  score: Development cost-carbon-peak-comfort improvement is uncapped; held-out climates, forecast bias,
    sensor bias, parameter drift and actuator loss stay separate.
citations:
- id: doi:10.1080/19401493.2021.1986574
  title: Building optimization testing framework BOPTEST
- id: url:https://ibpsa.github.io/project1-boptest/docs-userguide/introduction.html
  title: BOPTEST user guide introduction
invariants:
- With HVAC and gains disabled, zone temperature moves toward outdoor temperature under positive envelope
  conductance.
- CO2 generation occurs only with occupancy and ventilation removes indoor excess above outdoor concentration.
- Comfort and IAQ gate economic comparison so disabling equipment cannot win.
- Controller errors and malformed actions fail closed; held-out metrics remain sealed.
known_shortcuts: 'The lightweight emulator follows the BOPTEST interaction and KPI shape but is not an
  official Modelica FMU. The name must not be read as certification; pinned official test-case replay,
  server-held traces and external controls review are required. Hardening: A load-compensated baseline
  and sufficient 30 kW capacity make all declared climates feasible. Public comfort excursion/rate tolerances
  replace permissive hidden thresholds; CO2 enforces the published limit. Anchor errors are separated
  from candidate errors. Reproduce local sweeps with scripts/diagnose_new_task_hardening.py --sweeps;
  numerical admission evidence is pending clean Linux replay.'
