schema_version: 2
scientific_question: Can one policy jointly place turbines and schedule direction-dependent yaw to improve
  annual farm value while transferring across wind roses, boundaries and wake-model uncertainty?
artifact: A continuous two-dimensional turbine layout and a direction-by-turbine yaw matrix.
oracle:
  model: Deterministic Gaussian and Jensen hybrid wake superposition with yaw deflection, own-power loss,
    rated-power cap and wind-rose integration.
  feasibility: Exact shapes, finite values, rectangular boundary, pairwise minimum spacing and yaw bounds;
    violations fail closed.
  deterministic: true
normalization:
  baseline: Regular rectangular grid with zero yaw.
  reference: Ten seeded layout starts, coordinate yaw search and one 80 m feasible layout-refinement
    scale; it scores 0.741 against the oracle's 180-start, three-scale anchor.
  score: Development annual-value gain is uncapped above the stronger search anchor; held-out geometries and direction, wake-expansion
    and turbulence shifts stay separate.
citations:
- id: doi:10.1088/1742-6596/1618/2/022028
  title: Overview of FLORIS updates
- id: url:https://nrel.sitefinity.cloud/wind/floris
  title: NREL FLORIS wake modeling and controls software
invariants:
- With wake interaction removed and zero yaw, identical turbines have identical free-stream power.
- Yaw decreases own-turbine power while potentially deflecting its downstream wake.
- Duplicated, too-close, out-of-bound, malformed and over-yawed layouts fail closed.
- Held-out model-shift metrics never control combined_score.
known_shortcuts: 'The regular-grid zero-yaw baseline scores 0, while the historical yaw-only search
  reaches 0.490932 development and 0.347172 robustness against the current 0.741392/0.613817
  co-design witness. Yaw is therefore a substantial partial shortcut; row staggering, boundary
  packing and fixed-yaw grids remain unmeasured. The visible wind roses and reduced wake equations
  may be overfit, and the oracle omits terrain, electrical balance, availability and loads; clean
  Linux replay, pinned FLORIS comparison and server-held roses remain required.'
