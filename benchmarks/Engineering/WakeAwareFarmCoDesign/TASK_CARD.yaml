schema_version: 2
scientific_question: Can one policy jointly place turbines and schedule direction-dependent yaw so that both layout and wake-steering control add annual energy across wind roses and boundaries?
artifact: A continuous two-dimensional turbine layout and a direction-by-turbine yaw matrix.
oracle:
  model: Deterministic reduced Gaussian/Jensen wake superposition with yaw deflection, own-power loss and wind-rose integration. Layout and yaw-control gains are scored as separate axes.
  feasibility: Exact shapes, finite values, rectangular boundary, pairwise minimum spacing and yaw bounds; violations fail closed.
  deterministic: true
normalization:
  baseline: Regular rectangular grid with zero yaw.
  reference: Twelve seeded layout starts, one bounded multiscale layout/yaw alternation and a final yaw sweep. The stronger component anchor includes this exact path plus 600 layout draws, additional multiscale alternations and zero-yaw/yaw-only controls.
  score: The geometric mean of normalized layout-only GWh gain and incremental yaw-control GWh gain. Each axis is floored at zero and the result is uncapped; held-out geometries and the widened-expansion/rotated-direction tier stay separate.
evaluation_budget:
  timeout_seconds: 600
  expected_evaluator_seconds: 35
  measurement: A clean local macOS Python 3.12 run on 2026-09-12 took 25.92 s for the complete reference evaluation, including recomputing all six strong anchors. Linux sandbox timing remains pending.
citations:
- id: doi:10.1088/1742-6596/1618/2/022028
  title: Overview of FLORIS updates
- id: doi:10.1017/jfm.2016.595
  title: Experimental and theoretical study of wind turbine wakes in yawed conditions
- id: url:https://nrel.github.io/floris/
  title: NREL FLORIS wake modeling and controls documentation
invariants:
- With wake interaction removed and zero yaw, identical turbines have identical free-stream power.
- Yaw decreases own-turbine power while it can deflect an upstream wake.
- A zero-yaw design has yaw_control_score zero and a baseline-layout design has layout_score zero, so neither can receive positive combined score alone.
- Duplicated, too-close, out-of-bound, malformed and over-yawed layouts fail closed.
- Held-out and model-shift metrics never control combined_score.
known_shortcuts: >-
  The 2026-09-08 review found that a repulsion/spreading layout with zero yaw scored 0.509220 under the obsolete single total-value scale, while yaw-only scored 0.003391 and a larger-budget copy of the old reference reached 1.169086. The 2026-09-12 revision does not hide those failures: it removes the unsupported structural-load penalty, gives yaw a physically motivated public deflection term, makes the runnable reference alternate both capabilities, and scores layout and yaw increments separately. Every zero-yaw layout family, including the repulsion probe, now has combined_score 0 while retaining a visible positive layout_score; every baseline-layout yaw family likewise scores 0 with a visible yaw_control_score. The complete reference measures 0.782836 development / 0.782388 heldout with development mean layout/yaw axes 0.714964/0.864917. These structural controls are not a bound on a family optimizing both axes; a fresh joint shortcut sweep and frontier-model draw remain required.
