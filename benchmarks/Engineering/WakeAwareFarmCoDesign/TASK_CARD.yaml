schema_version: 2
scientific_question: Can one policy jointly place turbines and schedule direction-dependent yaw to improve annual farm value while transferring across wind roses, boundaries and wake-model uncertainty?
artifact: A continuous two-dimensional turbine layout and a direction-by-turbine yaw matrix.
oracle:
  model: Deterministic Gaussian and Jensen hybrid wake superposition with yaw deflection, own-power loss, rated-power cap and wind-rose integration.
  feasibility: Exact shapes, finite values, rectangular boundary, pairwise minimum spacing and yaw bounds; violations fail closed.
  deterministic: true
normalization:
  baseline: Regular rectangular grid with zero yaw.
  reference: Fixed-seed valid layout jitter recomputed per run followed by truth-blind coordinate yaw refinement on the public model.
  score: Development annual-value gain is uncapped; held-out geometries and direction, wake-expansion and turbulence shifts stay separate.
citations:
- id: doi:10.1088/1742-6596/1618/2/022028
  title: Overview of FLORIS updates
- id: url:https://nrel.sitefinity.cloud/wind/floris
  title: NREL FLORIS wake modeling and controls software
invariants:
- With wake interaction removed and zero yaw, identical turbines have identical free-stream power.
- Yaw decreases own-turbine power while potentially deflecting its downstream wake.
- Duplicated, too-close, out-of-bound, malformed and over-yawed layouts fail closed.
- Held-out model-shift metrics never control combined_score.
known_shortcuts: The visible wind roses and reduced wake equations may be overfit. The oracle omits terrain, electrical balance, availability, loads and high-fidelity atmospheric effects; independent pinned-FLORIS replay and server-held roses are mandatory.
