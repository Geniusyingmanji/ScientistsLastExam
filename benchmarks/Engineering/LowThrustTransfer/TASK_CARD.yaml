schema_version: 2
scientific_question: Can one compact finite-thrust guidance policy transfer across orbit-raising, lowering, eccentricity-change and plane-change missions while trading terminal orbit accuracy against propellant and retaining feasibility under execution and navigation shifts?
artifact: Four segments of bounded harmonic radial-transverse-normal thrust guidance, with seven finite coefficients per segment.
oracle:
  model: deterministic modified-equinoctial-element propagation with propellant depletion, a documented Earth point-mass plus J2 gravity field, and independent terminal-orbit, phase and execution-shift diagnostics
  feasibility: continuous resultant-thrust bound, minimum perigee altitude, eccentricity and dry-mass reserve, plus a five-component terminal MEE tolerance
  deterministic: true
normalization:
  baseline: valid zero-thrust coast policy, which reaches none of the nontrivial target orbits
  reference: independently repropagated feasible finite-thrust reachability witnesses generated before target freezing, repropagated through the same dynamics and scored the same way; the score is normalized so the witness is exactly 1.0 and is uncapped above it. They are not claimed globally optimal.
  score: nominal development terminal accuracy times rocket-equation propellant efficiency, normalized above coast; held-out mission transfer, terminal phase and thrust/ISP/J2/pointing/navigation/cutoff robustness remain separate
