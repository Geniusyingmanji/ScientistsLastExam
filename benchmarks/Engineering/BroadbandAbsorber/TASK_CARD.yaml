schema_version: 2
scientific_question: Can one geometry policy distribute subwavelength Helmholtz cells across changing bands and thickness limits while retaining broadband absorption under angle, air-property and manufacturing shifts?
artifact: One cavity depth, neck length and neck radius per equal-area panel cell.
oracle:
  proxy: public low-frequency Helmholtz compliance, Poiseuille neck loss and inertance model
  nominal: circular-tube Stinson dynamic density, finite-depth rigid cavity, small-aperture radiation resistance and parallel surface admittance
  feasibility: exact finite geometry shape, public variable bounds and per-cell cavity-plus-neck depth limit
  deterministic: true
normalization:
  baseline: identical cells tuned near the geometric center of each supplied band and evaluated by the same oracle
  reference: separately calibrated fixed-seed nominal and worst-shift witnesses in a four-parameter log-spaced-resonance family
  score: development nominal broadband utility controls search; proxy agreement, held-out bands and physical shifts remain separate
citations:
- id: doi:10.1121/1.400379
  title: The propagation of plane sound waves in narrow and wide circular tubes, and generalization to uniform tubes of arbitrary cross-sectional shape
- id: doi:10.1063/1.4962328
  title: Ultra-thin metamaterial for perfect and quasi-omnidirectional sound absorption
- id: doi:10.1063/1.4941338
  title: Acoustic metasurface-based perfect absorber with deep subwavelength thickness
invariants:
- each returned row is finite, in bounds and obeys the public total-depth constraint
- exact and proxy cell impedances have nonnegative resistance over every benchmark band
- zero resistance mismatch cannot create absorption above one or below zero
- the weak baseline is valid and has normalized nominal score zero by construction
- nominal and robust reference witnesses strictly improve their corresponding weak-baseline utilities in every instance
- manufacturing shifts that leave the hard panel envelope receive zero shifted utility without changing nominal artifact validity
- the circular-tube dynamic-density implementation agrees with an independent scalar Bessel implementation
- non-finite, malformed and out-of-bound geometry fails closed
- every scientific instance receives fresh candidate process and private temporary-filesystem state
- held-out, proxy/exact-gap and shifted metrics remain evaluator-only
known_shortcuts: The locally reacting reduced-order model omits thermal boundary-layer loss, inter-cell coupling, structural elasticity, grazing flow, nonlinear response and fabrication detail. Fixed procedural instances require future server-held bands and geometries. Engineering claims require thermoviscous finite-element and impedance-tube replication. Reference witnesses are reproducible anchors, not global optima.
