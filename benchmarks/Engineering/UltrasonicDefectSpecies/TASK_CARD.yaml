schema_version: 2
scientific_question: From a budgeted pulse-echo A-scan, name whether the echo is a crack, a pore, a lack-of-fusion doublet or a clean plate, and decline when two species or a mode-converted extra arrival make a single-species claim non-unique.
artifact: A species name, a confidence, and an optional refusal.
oracle:
  model: procedurally parameterized Gaussian pulse-echo traces with frozen noise, plus mixture and mode-converted out-of-family worlds
  feasibility: charged time samples, species recovery on in-family worlds, and calibrated refusal of mixed-sign or two-body traces
  deterministic: true
normalization:
  baseline: always publish a clean scan
  reference: coarse polarity scan plus a +0.55 us doublet check, abstaining when both signs are strong
  score: development mechanism recovery normalized above always-abstain; signal recovery, false discovery, refusal, coverage and the held-out split stay separate
citations:
- id: doi:10.1109/PROC.1985.13367
  title: "Ultrasonics in nondestructive evaluation"
- id: doi:10.1007/978-3-319-30463-2
  title: "Fundamentals of Ultrasonic Nondestructive Evaluation"
invariants:
- a crack inverts phase; a pore does not; lack of fusion is a same-sign doublet; a clean plate is in-family
- two defects, or a mode-converted extra echo, produce both polarities or two incommensurate arrivals and must be refused
- declining every world scores exactly zero; the axes separate blanket abstention from confident publication
- measure calls are charged and overspend fails closed; malformed submissions score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: The laboratory is a one-dimensional Gaussian echo catalog, not a full elastodynamic scatterer. World seeds are repository-visible and require a future server-held split. Recovering depth as well as species is leftover headroom, not an exploit.
review:
