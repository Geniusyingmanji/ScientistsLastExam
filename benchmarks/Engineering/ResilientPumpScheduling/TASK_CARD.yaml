schema_version: 2
scientific_question: Can one open-loop pumping policy reduce tariff-weighted energy while respecting pressure, storage and terminal recovery and retaining service under demand growth and pump outage?
artifact: A bounded 24-hour pump-speed schedule satisfying a public ramp-rate contract.
oracle:
  model: Deterministic extended-period mass balance, tank-head remote-pressure calculation and speed-dependent pump energy model.
  feasibility: Hourly tank bounds, remote pressure at least 20 metres, terminal storage recovery, finite speed bounds and ramp limits.
  deterministic: true
normalization:
  baseline: Conservative constant-speed schedule sized above mean public demand.
  reference: Deterministic public-forecast tariff coordinate search recomputed per run with storage, pressure and ramp replay.
  score: Development energy-cost savings are uncapped; held-out networks, demand growth and four-hour outage resilience remain separate.
citations:
- id: url:https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=P10113EM.TXT
  title: EPANET 2.2 User Manual
- id: doi:10.5194/dwes-7-53-2014
  title: A multiobjective approach to optimal pump scheduling in water distribution systems
invariants:
- Tank volume equals initial storage plus cumulative pump inflow minus cumulative actual demand.
- Pump power is nonnegative and increases with delivered flow and head.
- Invalid shapes, nonfinite speeds, bound violations, ramp violations and nominal hydraulic failures score zero.
- Forecast growth and outage axes remain evaluator-only.
known_shortcuts: The compact storage-pressure oracle omits a full pipe-network nonlinear solve. It must be independently reproduced on frozen EPANET/WNTR networks; visible deterministic profiles also require server-held replacements.
