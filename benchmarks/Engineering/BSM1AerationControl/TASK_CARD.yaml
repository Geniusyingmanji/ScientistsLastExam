schema_version: 2
scientific_question: Can a stateful aeration and recycle controller meet effluent limits with less energy
  and smoother operation while transferring to storms, biased sensors and degraded actuators?
artifact: A stateful observation-to-action controller for oxygen-transfer intensity and internal recycle.
oracle:
  model: Deterministic five-state ASM1-inspired bounded reactor, 0.5-hour control intervals with ten 0.05-hour
    Euler integration steps; not official BSM1. Concentrated return-flow ammonia, observed compressor
    derating and time-varying electricity prices.
  feasibility: Finite bounded actions at every step and hard mean ammonia, total-nitrogen and COD-proxy
    limits after warmup.
  deterministic: true
normalization:
  baseline: Dissolved-oxygen PI control with fixed internal recycle.
  reference: Ammonia/oxygen feedback with observed compressor derating compensation and electricity-price
    moderation.
  score: Uncapped savings in flow-weighted effluent, upper-decile ammonia, priced energy and variation
    above a feasible PI baseline.
citations:
- id: url:https://iwa-mia.org/wp-content/uploads/2018/01/BSM_TG_Tech_Report_no_1_BSM1_General_Description.pdf
  title: Benchmark Simulation Model No. 1 general description
- id: doi:10.3182/20110828-6-IT-1002.01664
  title: Dynamic optimization of aeration operations for BSM1
invariants:
- Increasing oxygen transfer cannot directly remove nitrogen or substrate without the declared kinetic
  rates.
- Effluent limits gate energy comparison so an off controller cannot win by saving power.
- Every candidate receives only the current observation and no future or sealed plant state.
- Malformed actions and controller exceptions score zero without crashing the trusted evaluator.
known_shortcuts: Transient ammonia, compressor availability, flow-weighted effluent, tail ammonia and
