schema_version: 2
scientific_question: Can one device-aware policy discover drive-current-versus-leakage halo-profile Pareto archives that transfer across silicon nMOS geometries and remain feasible under operation, process and source-drain asymmetry shifts?
artifact: A bounded archive of six-parameter Gaussian background/source-pocket/drain-pocket acceptor profiles in log10 cm^-3 and normalized channel coordinates.
oracle:
  exact: transparent reduced-order screened-Poisson, MOS electrostatics, Caughey-Thomas mobility, charge-sheet current and Poisson random-dopant compact model
  feasibility: finite archive shape, public design bounds, minimum unique and nominal-feasible profiles, threshold window, drive-current floor, DIBL, subthreshold swing, random-dopant variation, implant dose, active concentration and profile-gradient limits
  deterministic: true
normalization:
  baseline: conservative eight-profile background-only archive that is nominally feasible on every device
  reference: fixed-seed 2048-point scrambled-Sobol screens followed by full compact-model nominal and all-shift-feasible Pareto selection
  score: development nominal drive-current-per-width versus log-leakage-per-width Pareto hypervolume controls search; held-out transfer and worst-shift robustness remain separate and sealed
citations:
- id: doi:10.1002/0470068329
  title: Physics of Semiconductor Devices
- id: doi:10.1017/CBO9781139195065
  title: Fundamentals of Modern VLSI Devices
- id: doi:10.1109/PROC.1967.6123
  title: Carrier mobilities in silicon empirically related to doping and field
invariants:
- all concentrations use cm^-3 internally and are converted to m^-3 only for SI electrostatics
- higher acceptor doping raises the modeled threshold voltage and lowers Caughey-Thomas mobility on a fixed device
- higher temperature raises modeled subthreshold swing and off current for a fixed profile
- every weak-baseline profile is nominally feasible on all six devices
- nominal and robust reference archives reconstruct exactly from committed Sobol seeds and indices
- every nominal and shifted reference hypervolume exceeds its corresponding weak-baseline hypervolume
- every robust reference profile is feasible under all six sealed shifts
- the nominal witness attains unit nominal development and held-out score but loses source-drain-reversal robustness
- the robust witness trades nominal hypervolume for unit worst-shift development and held-out robustness
- boolean, non-finite, malformed, duplicated-only, out-of-bound and insufficiently feasible archives fail closed
- held-out, shift, detailed device and per-instance metrics remain evaluator-only
known_shortcuts: The compact model omits two-dimensional self-consistent carrier transport, quantum confinement, gate and junction leakage, band-to-band tunneling, interface traps, velocity overshoot, series resistance and detailed implant-anneal chemistry. Repository-visible deterministic devices require future server-held procedural regimes. Physical claims require independent TCAD, process integration and measured-device validation. Sobol archives are reproducible witnesses, not global optima.
