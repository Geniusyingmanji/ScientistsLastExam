schema_version: 2
scientific_question: Can a policy place n points in the unit square with a larger minimum triangle area than the published record, matching a certified-optimal configuration at n=8 and making a genuine new improvement to best-known-only records at n=10, n=11 and n=12?
artifact: A list of n [x, y] points with coordinates in [0,1], for n in {8, 10, 11, 12}.
oracle:
  model: exact minimum over all C(n,3) triangle areas via the direct shoelace/cross-product formula (a finite, deterministic computation)
  feasibility: exactly n points, all coordinates finite and in [0,1]
  deterministic: true
normalization:
  baseline: regular n-gon inscribed in the unit square's largest inscribed circle, giving min-areas 0.05178/0.02806/0.02146 at the three sizes
  reference: the maintained Heilbronn-triangle-problem record table (Erich's Packing Center) -- proven optimal at n=8 ((sqrt(13)-1)/36), best-known only at n=10 (~0.04654), n=11 (1/27) and n=12 (~0.03260)
  score: mean over the four sizes of (min_area - baseline) / (sota_ref - baseline), clipped below at 0, unbounded above -- matching the published record scores 1.0 at that size, a verified larger minimum area scores above 1.0 (mathematically impossible at n=8, since it is proven optimal; genuinely open at n=10, n=11 and n=12)
citations:
- id: web:erich-friedman-heilbronn-packing-center
  title: Heilbronn's Triangle Problem (Erich's Packing Center record table)
- id: arxiv:2506.13131
  title: "AlphaEvolve: A coding agent for scientific and algorithmic discovery"
invariants:
- the minimum-triangle-area check is the exact direct shoelace/cross-product formula over every 3-point combination, no approximation and no sampling beyond ordinary floating-point arithmetic
- the baseline (regular n-gon) is checked to score exactly 0.0000 on all three sizes
- the n=8 anchor is a proven-optimal certified value (Dehbi & Zeng, 2022); the n=10, n=11 and n=12 anchors are best-known-only, not proven optimal -- this task discloses rather than hides the resulting difference in whether combined_score can genuinely exceed 1.0 per size
- reciting a minimum-area value is worth nothing without producing the literal point set; the oracle checks the submitted points directly, never a claimed number
- the shipped reference construction (randomized coordinate hill-climbing) is a real, standard technique, not the certified global-optimization or computer-assisted-proof methods behind the cited records, and does not reach any of the three published values, leaving real headroom
known_shortcuts: The Heilbronn triangle problem and its small proven-optimal values are documented (e.g. on Erich's Packing Center and in MathWorld) and may occur in training data; reciting a minimum-area value is not sufficient, since the oracle requires an actual point set that passes the same exact triangle-area check anyone else would run, and beating the n=10, n=11 or n=12 best-known record is a real result the oracle cannot be talked out of accepting or rejecting.
review:
  domain: pending_external_discrete_geometry
  evaluator_security: automated_bad_candidate_crash_sweep_determinism_and_uncapped_normalization_checks
provenance:
  class: known_answer
  target_source: A proven-optimal value (n=8) and best-known-only records (n=10, n=11, n=12) from a maintained public table, used only as score=1.0 witnesses; a verified larger n=10, n=11 or n=12 minimum area scores above 1.0 and is a real mathematical result, not a benchmark artifact.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_completed
novelty_risk:
  level: high
  rationale: The Heilbronn triangle problem and its small proven values are well documented and likely recalled directly by a capable model, but the exact literal point-set coordinates achieving any of these three specific records (particularly the n=10/n=11/n=12 best-known values) are not something a model can merely recite -- reconstructing or improving on them is the actual task.
