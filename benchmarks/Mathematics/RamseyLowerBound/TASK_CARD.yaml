schema_version: 2
scientific_question: Construct 2-edge-colourings of complete graphs with no monochromatic clique of the prescribed orders, beating the published Ramsey lower-bound witnesses.
artifact: A symmetric 0/1 adjacency matrix for each (s, t) pair, 0 red and 1 blue.
oracle:
  model: exhaustive monochromatic-clique search on a finite colouring, fail-closed on shape
  feasibility: square symmetric 0/1 matrix, zero diagonal, n at most the checker cap, no red K_s and no blue K_t
  deterministic: true
normalization:
  baseline: complete bipartite colouring with parts of size t-1
  reference: Exoo construction orders n=42 for (5,5) and n=35 for (4,6)
  score: uncapped fraction of order improvement; beating the witness exceeds 1
citations:
- id: doi:10.1002/jgt.3190130114
  title: A lower bound for R(5,5)
- id: url:https://www.combinatorics.org/ojs/index.php/eljc/article/view/DS1
  title: Small Ramsey Numbers (Dynamic Survey DS1)
invariants:
- complement of colours swaps (s, t)
- vertex-permutation invariance
- asymmetric or off-binary matrices are infeasible
known_shortcuts: Public Exoo colourings may occur in training; a colouring larger than the witness is the novelty claim, and there is no unique required colouring.
