  target_source: Published records (Polymath8b) used only as score=1.0 witnesses; a narrower verified tuple scores above 1.0 and is a real mathematical result, not a benchmark artifact.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_completed
novelty_risk:
  level: high
  rationale: The k=50/diameter=246 connection to bounded prime gaps is extremely well known and likely recalled directly by a capable model; the exact 50 (or 54) integers achieving it are not something a model can merely recite, so reconstructing or improving on them is the actual task, but pretraining familiarity with the general result is real and should be weighed accordingly.
