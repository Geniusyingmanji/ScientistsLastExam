novelty_risk:
  level: high
  rationale: Schur numbers and the small exact values are well known and likely recalled directly by a capable model, but the exact literal partition achieving any of these three specific witness lengths (particularly the k=6/k=7 lower bounds) is not something a model can merely recite -- reconstructing or extending it is the actual task.
