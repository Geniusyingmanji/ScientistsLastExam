schema_version: 2
scientific_question: Identify the isomorphism type of a finite group presented only as a black-box product on relabelled elements, under a query budget of two and a half times the order, choosing from a public catalogue of explicit constructions - or decline because the operation is not associative or the group is not listed, stating which.
artifact: A catalogue identifier, a confidence, and an optional refusal with its reason.
oracle:
  model: exact Cayley tables of groups of orders 16, 24, 32 and 48 built from explicit constructions (cyclic products, semidirect products, dicyclic groups, direct products, permutation and matrix groups, the Pauli group), randomly relabelled per world; non-group worlds are random isotopes of catalogue groups that visibly fail associativity; outside-catalogue worlds are groups whose scoring invariants differ from every catalogue entry of their order
  feasibility: charged product queries with label validation, exact gating on the catalogue identifier, half credit for a refusal with the wrong reason, and false discovery on any name given to an unsupported world
  deterministic: true
normalization:
  baseline: sampled element-order profile matched to the nearest catalogue entry, never declining
  reference: identity from one element's powers, an attempted left-multiplication closure over generators drawn from the unreached labels, exact invariant matching when it completes, and otherwise a rank lower bound plus subgroup order plus commutation-based centre estimate pruning the catalogue
  score: development mechanism recovery normalized above the better blanket refusal; identification rate, false discovery, refusal, refusal-reason accuracy, coverage and the held-out split stay separate
citations:
- id: doi:10.1109/SFCS.1984.715919
  title: On the complexity of matrix group problems I
- id: doi:10.1145/800133.804331
  title: On the n^log n isomorphism technique
- id: isbn:9781584883722
  title: Handbook of Computational Group Theory
invariants:
- every catalogue and outside construction is a group of the stated order, and no two catalogue entries of one order share (order profile, centre size, derived subgroup order, number of squares); no outside group shares them with a catalogue entry, so "outside" is determinable
- rank and the order profile alone do not separate the catalogue - C8xC2 and M16 agree at order 16, C16xC2 and M32 at order 32, and the unlisted C4:C4, Pauli, C8:C4, C2xM16 and C3xC4:C4 each agree with a catalogue entry - so the centre is the invariant that decides, and it costs two queries per sample
- the element-order profile alone does not separate the catalogue, so a profile-matching candidate books false identifications
- a random isotope of a group is a Latin square that fails associativity on a fifth or more of sampled triples; its reconstruction from generator words has permutation rows and non-permutation columns and disagrees with the oracle on unqueried products
- left-multiplication closure costs exactly k * order queries, so at a budget of 2.5 * order a two-generated world is reconstructible and exactly identifiable while a world of rank three or more is not, at any price available; a stalled closure still yields a rank lower bound and a proper subgroup's order
- declining every world with either blanket reason scores exactly zero by construction; the axes separate blanket abstention from confident naming
- queries are charged and overspend fails closed; malformed submissions score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: The catalogue is a curated subset of the groups of each order, given with constructions, so the task measures identification against a stated library rather than open-ended classification; orders are small enough that full associativity checks are cheap for the oracle. World seeds and constructions are repository-visible and require a future server-held split. The first frontier draw (Claude Opus 5, 2026-09-03) scored 1.000 on its first proposal at the original budget of 6 * order, where the whole Cayley table is affordable and a real isomorphism test wins every world; the budget was cut to 2.5 * order in response, which puts reconstruction out of reach for any world of rank three or more. The reference scores 0.286 there, and pricing the closure before committing to it is the headroom.
