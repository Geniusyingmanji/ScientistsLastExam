novelty_risk:
  level: medium
  rationale: Black-box group algorithms (Babai and Szemeredi 1984) and small-group identification are classical, and a model may recognise the closure-and-invariants route. What is not published is the catalogue, the relabelling and the two refusal reasons under a budget; the ablation shows the score turns on trusting associativity only after checking it and on knowing which invariants separate the catalogue.
