schema_version: 2
scientific_question: Can a policy pack more 5-element blocks of {0,...,28} (no pair of points shared by more than one block) than the published A(29,8,5) lower-bound record?
artifact: A list of 5-element subsets of {0,...,28}.
oracle:
  model: exact pairwise-sharing check over every block (a finite, deterministic computation)
  feasibility: each block exactly 5 distinct entries in 0..28, no pair shared by more than one block, at most 200 blocks
  deterministic: true
normalization:
  baseline: a disjoint partition into 5-element blocks, giving 5 blocks
  reference: published lower bound A(29,8,5) >= 36 (Bluskov, 2018)
  score: (num_blocks - 5) / (36 - 5), clipped below at 0, unbounded above -- matching the published record scores 1.0, a verified larger code scores above 1.0
citations:
- id: web:bluskov-2018-constant-weight-codes
  title: New Constant Weight Codes and Packing Numbers
invariants:
- the pairwise-sharing check is exact (every pair of points across every block), no floating point and no sampling
- the baseline (disjoint partition) is checked to score exactly 0.0000
- the sota_ref anchor (36) is a best-known lower bound, not proven optimal (upper bound 39), so combined_score has genuine uncapped headroom above 1.0
- reciting a block count is worth nothing without producing the literal blocks; the oracle checks the submitted blocks directly, never a claimed number
- the shipped reference construction (randomized greedy packing) is a real, standard technique, not the algebraic/computer-search construction behind the published record, and does not reach it, leaving real headroom
known_shortcuts: A(29,8,5) and its published bounds are documented on maintained tables and may occur in training data; reciting a block count is not sufficient, since the oracle requires an actual set of blocks that passes the same exact pairwise-sharing check anyone else would run, and beating 36 is a real result the oracle cannot be talked out of accepting or rejecting.
