schema_version: 2
scientific_question: Can an auditor with a tight digit-purchase budget certify which
  claimed identities are exact, which are coincidences, and which no purchasable
  precision can ever decide?
artifact: A verdict per claim (exact with the recovered integer row, false, or
  undecidable) plus a confidence scalar.
oracle:
  model: fourteen anonymous constants as integer combinations of six hidden exact
    bases computed by pure-integer series to any precision, planted decimal epsilons
    (hard-false 1e-25..1e-54, capped below public precision caps), twelve claims
    mixing exact, grossly false, hard-false and undecidable kinds
  feasibility: verdicts from the public vocabulary over every claim, coefficient rows
    only for exact verdicts, charged purchases within a ten-unit budget
  deterministic: true
  external_tooling: none (decimal/fractions are stdlib)
difficulty_ladder:
  default_level: 1
  levels:
    1: the shipped claim mix, caps and epsilon scales
normalization:
  baseline: the all-undecided auditor, scoring exactly zero after normalization
  reference: base-precision row fits, cap-driven refusal, fewest-missing-first
    purchases at the 80-digit tier
  score: per-claim scores averaged and normalized above the passive floor, with a
    -0.5 penalty for certified-false verdicts on exactly true relations
citations:
- id: doi:10.1090/S0025-5718-99-01081-3
  title: Analysis of PSLQ, an integer relation finding algorithm
invariants:
- exact-claim residuals are identically zero at every purchasable precision
- an epsilon below its value's cap can never appear in purchased digits
- the passive all-undecided auditor scores exactly zero
- a truth-informed verdict vector scores one
known_shortcuts: A base-precision-only auditor that rejects gross failures and calls
  every near-zero claim exact with its fitted row reaches 0.600 against the 0.900
  reference; the remaining gap is certification and refusal. Formal clean Linux
  calibration and independent review remain pending.
