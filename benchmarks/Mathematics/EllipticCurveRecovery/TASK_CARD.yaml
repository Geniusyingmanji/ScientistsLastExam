schema_version: 2
scientific_question: Can a budgeted choice of primes recover an elliptic curve's integer coefficients
  from exact point counts, while refusing worlds whose counts no elliptic pair can reproduce?
artifact: A bounded integer coefficient pair, optional abstention and a confidence scalar.
oracle:
  model: Bounded nonsingular integer cubics, exact Legendre-sum point counts, singular cubics from disjoint
    signed t families, smooth genus-two quintics and Q-isomorphic coefficient twins.
  feasibility: Five-unit budget with published prime costs; integer bounded claims, including scientifically
    wrong singular claims (scored as discoveries, not malformed artifacts).
  deterministic: true
  external_tooling: none (pure integer arithmetic)
difficulty_ladder:
  default_level: 1
  levels:
    1: the shipped coefficient window and prime tiers
normalization:
  baseline: one small-prime query and a fixed (0, 1) guess
  reference: Truth-blind residue enumeration and complete bounded lifting with per-query filtering, greedy
    entropy-based prime selection and final discriminant/uniqueness checks.
  score: Exact supported recovery only when independently recomputed purchased counts identify the claimed
    pair uniquely; no unused-budget reward. Normalize above full abstention; false discoveries and refusals
    remain separate diagnostics.
citations:
- id: url:https://math.mit.edu/~drew/Definitions.html
  title: Hyperelliptic curves of odd degree — definitions and notation
- id: isbn:9780387094939
  title: The Arithmetic of Elliptic Curves
invariants:
- exact point counts agree with direct finite-field enumeration
- a coefficient claim needs a singleton nonsingular bounded compatibility set from actual purchased queries
- zero-query and one/two-prime literal-answer probes score zero on both splits
- development and heldout singular curves have disjoint complete point-count signatures
- singular-only and empty compatibility sets are distinct; quantitative traces in review_evidence.json
- Q-isomorphic twins remain indistinguishable at every published prime
- a full abstention scores zero; one invalid world does not erase valid-world recovery
- fresh sandbox sessions isolate module globals and temporary files between worlds
known_shortcuts: 'Historical reviewer at 0310ab2: 25-point threshold grid 0.000, four-prime 0.000, six-prime
  0.4875, adaptive stopping 0.8063, 1-2-prime memorization 0.9438, zero-query literals 1.000. Revised
  clean Linux: reference 0.875000 / 0.944444; 25-point heuristic grid and current-world literal programs
  with 0, 1 or 2 queries all 0.000 / 0.000. Four-query ablation 0.166667 / 0.111111; no discriminant filtering
  0.791667 / 0.833333; fixed prime order 0.875000 / 0.777778. Full source-bound results in references/review_evidence.json;
  no frontier calibration.'
