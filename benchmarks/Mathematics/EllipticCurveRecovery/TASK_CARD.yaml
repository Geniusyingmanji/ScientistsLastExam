schema_version: 2
scientific_question: Can a budgeted choice of primes recover an elliptic curve's
  integer coefficients from exact point counts, while refusing worlds whose
  counts no elliptic pair can reproduce?
artifact: A bounded integer coefficient pair, optional abstention and a confidence
  scalar.
oracle:
  model: seeded nonsingular curves with |a|,|b| <= 40, exact Legendre-sum point
    counts over a published prime list with tiered costs, singular cubics (a = -3t^2,
    b = 2t^3) and genus-two quartics as refusal worlds
  feasibility: primes from the published list, charged by tier within an
    eight-unit budget, bounded integer coefficients
  deterministic: true
  external_tooling: none (pure integer arithmetic)
difficulty_ladder:
  default_level: 1
  levels:
    1: the shipped coefficient window and prime tiers
normalization:
  baseline: one small-prime query and a fixed (0, 1) guess
  reference: six small primes, per-prime residue enumeration, incremental CRT with
    window pruning, discriminant filtering
  score: exp of normalized total absolute coefficient error, normalized above
    always abstaining
citations:
- id: isbn:9780387094939
  title: The Arithmetic of Elliptic Curves
invariants:
- point counts are exact integer computations, reproducible by direct enumeration
- the CRT modulus of six small primes exceeds the coefficient window twice over
- singular lifts are filtered before claiming
- a full abstention scores exactly zero after normalization
known_shortcuts: A fixed (0, 1) guess scores 0.000; the six-prime reference reaches 1.000/1.000 with zero false discoveries, and the four-prime ablation collapses to 0.000 through twin-curve ambiguity. Formal clean Linux calibration and independent review remain pending.
