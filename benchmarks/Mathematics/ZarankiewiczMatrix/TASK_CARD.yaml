novelty_risk:
  level: high
  rationale: The Zarankiewicz problem and the cited 2026 LLM-evolutionary-search papers are recent enough to plausibly be in pretraining data and the general technique (greedy/evolutionary densification of a K_{s,t}-free bipartite graph) is well known, but the exact literal matrix achieving any of these three specific (m,n) records is not something a model can merely recite -- reconstructing or improving on it is the actual task.
