  domain: pending_external_additive_combinatorics
  evaluator_security: automated_bad_candidate_crash_sweep_determinism_and_uncapped_normalization_checks
provenance:
  class: known_answer
  target_source: A published upper bound (arXiv:2511.02864), used only as a score=1.0 witness; a verified smaller ratio scores above 1.0 and is a real mathematical result, not a benchmark artifact.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_completed
novelty_risk:
  level: high
  rationale: Difference bases and the recent AlphaEvolve result are documented and may be recalled directly by a capable model, but the exact literal (n, basis) pair achieving a competitive ratio is not something a model can merely recite -- constructing one is the actual task.
