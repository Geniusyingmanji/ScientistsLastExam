novelty_risk:
  level: high
  rationale: Erdos' minimum overlap problem and its exact small values are documented and may be recalled directly by a capable model, but the exact literal partition achieving M(8), M(11) or M(15) is not something a model can merely recite -- reconstructing it is the actual task.
