schema_version: 2
scientific_question: Can a policy build a balanced partition of {1,...,2n} matching the exactly-known minimum possible difference-overlap M(n), at three sizes where M(n) has been settled by exhaustive search?
artifact: A balanced partition of {1,...,2n} into two sets of size n (given as 2n labels), for n in {8, 11, 15}.
oracle:
  model: exact cross-correlation of the two sets' indicator vectors to compute max_k M_k (a finite, deterministic computation), no floating point
  feasibility: exactly 2n labels in {0,1}, exactly n zeros and n ones
  deterministic: true
normalization:
  baseline: first-half/second-half split (A={1..n}, B={n+1..2n}), giving max-overlap n at every size (8, 11, 15)
  reference: the proven-exact minimum overlap M(n) at each size (4, 5, 6), settled by exhaustive computer search
  score: mean over the three sizes of (baseline_overlap - overlap) / (baseline_overlap - sota_ref), clipped below at 0, unbounded above in form -- matching the exact value scores 1.0; exceeding it is mathematically impossible at these three sizes since M(n) is proven exact
citations:
- id: arxiv:1609.08000
  title: The minimum overlap problem revisited
- id: arxiv:2201.05704
  title: Erdos' minimum overlap problem
- id: arxiv:2506.13131
  title: "AlphaEvolve: A coding agent for scientific and algorithmic discovery"
invariants:
- the max-overlap check is exact cross-correlation of integer indicator vectors (numpy.correlate), no floating point tolerance and no sampling
- the baseline (first-half/second-half split) is checked to score exactly 0.0000 on all three sizes
- all three sota_ref anchors (4, 5, 6) are proven exact values of M(n), independently re-confirmed against the cited record table and cross-checked with a from-scratch brute-force search for n=1..6 during this task's construction
- because M(n) is proven exact at n=8, 11, 15, combined_score has a hard ceiling of 1.0 in practice for this task -- disclosed rather than hidden; the asymptotic constant c that IS still open (and whose upper bound AlphaEvolve and others improved in 2025-2026) does not reduce to a finite partition for one concrete large n, so this task does not use it as an anchor
- reciting a max-overlap value is worth nothing without producing the literal partition; the oracle checks the submitted partition directly, never a claimed number
- the shipped reference construction (randomized hill-climbing) reaches the true optimum at n=8 and n=11 but not at n=15 (reaches 7, not the true 6), leaving real headroom there
known_shortcuts: Erdos' minimum overlap problem and its small exact values are documented (e.g. on Wikipedia) and may occur in training data; reciting a max-overlap value is not sufficient, since the oracle requires an actual balanced partition that passes the same exact cross-correlation check anyone else would run.
