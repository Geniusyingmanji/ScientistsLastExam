novelty_risk:
  level: medium
  rationale: The Kerdock and Preparata families are textbook and a model may recall that nonlinear codes hold these records. What it cannot recall is a specific 136-word code of length 24 at distance 10, and the shortcut probe bounds what generic search gets at 0.000. The risk that matters here is the opposite one - that the published record moves - which is why the anchors carry retrieval dates and are flagged as actively researched by the freshness checker.
