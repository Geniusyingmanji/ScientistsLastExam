  edits_triggered_by_model: >-
    None yet. Four construction decisions were made by measurement before any model saw this: the
    grid linear program was discarded after it produced bounds below the E8 packing; direct search
    over Laguerre coefficients was discarded after 4000 draws produced no candidate that passed a
    numerical screen; a semidefinite formulation over Gram factors with the tail as a penalty was
    discarded after no configuration yielded an extractable certificate; and the zero of the scale
    was moved from Rogers' bound to the two-term certificate once it was clear that no exactly
    certifiable submission reaches Rogers at any degree tried.
