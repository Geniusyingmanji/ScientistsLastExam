schema_version: 2
scientific_question: Construct shorter superpermutations on 7 and 8 symbols than the published records.
artifact: A finite string over the digits 1 through n containing every n-permutation as a contiguous substring.
oracle:
  model: exhaustive sliding-window check against the set of n! permutations
  feasibility: a string on the alphabet 1..n, within the length cap, covering every permutation
  deterministic: true
normalization:
  baseline: concatenation of all n! permutations, length n*n!
  reference: length 5906 on 7 symbols and 46204 on 8 symbols
  score: uncapped fraction of length improvement; beating the witness exceeds 1
