schema_version: 2
scientific_question: Construct larger kissing configurations in Euclidean dimensions whose exact kissing number is still open.
artifact: A finite list of nonzero vectors in R^d that remain at least 60 degrees apart after normalisation.
oracle:
  model: exact integer inner-product checks, with a floating-point 60-degree test for non-integral vectors
  feasibility: nonzero finite length-d vectors, at most 2500 of them, pairwise inner product at most one half on the sphere
  deterministic: true
normalization:
  baseline: the 2d coordinate axes plus or minus e_i
  reference: Cohn-table lower bounds 40, 72, 306, 510 and 841 in dimensions 5, 6, 9, 10 and 12
  score: uncapped fraction of cardinality improvement; beating the witness exceeds 1, but floating-witness acceptance is only a numerical benchmark result
