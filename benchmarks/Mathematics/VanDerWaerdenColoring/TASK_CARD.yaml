  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_completed
novelty_risk:
  level: high
  rationale: Van der Waerden's theorem and the small exact values are extremely well known and likely recalled directly by a capable model, but the exact literal coloring achieving any of these three specific witness lengths (particularly the (2,7) lower bound) is not something a model can merely recite -- reconstructing or extending it is the actual task.
