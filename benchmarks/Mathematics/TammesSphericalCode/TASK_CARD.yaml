  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_completed
novelty_risk:
  level: high
  rationale: The Tammes problem and its small known-optimal values are well known and likely recalled directly by a capable model, but the exact literal coordinates achieving the n=15 best-known record are not something a model can merely recite -- reconstructing or improving on them is the actual task.
