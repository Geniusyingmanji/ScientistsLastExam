schema_version: 2
scientific_question: Can a policy place 15 points on the unit sphere with a smaller maximum pairwise dot product (larger minimum angular separation) than the best-known, genuinely open, Tammes-problem configuration?
artifact: A list of 15 [x, y, z] points on (or near) the unit sphere.
oracle:
  model: exact pairwise dot product of normalized points, maximum taken over all pairs (a finite, deterministic computation)
  feasibility: 15 finite, non-(near-)origin points
  deterministic: true
normalization:
  baseline: a Fibonacci-sphere (golden-angle) spiral, giving max dot product 0.8571428571428572
  reference: Cohn et al.'s Spherical Codes database best-known n=15 configuration (max dot product 0.59260590292507377809642492233276), not proven optimal
  score: (baseline_max_dot - max_dot) / (baseline_max_dot - sota_ref), clipped below at 0, unbounded above -- matching the published record scores 1.0, a verified smaller maximum dot product scores above 1.0
citations:
- id: web:cohn-spherical-codes
  title: Spherical Codes (Cohn et al. maintained record database)
- id: doi:10.1080/10586458.2015.1022842
  title: The Tammes problem for N=14
invariants:
- the pairwise dot product check is exact vectorized floating-point arithmetic over every pair, no sampling
- the baseline (Fibonacci spiral) is checked to score exactly 0.0000
- the sota_ref anchor is a best-known, not proven-optimal, value -- n=14 is the last dimension proven optimal (Musin & Tarasov, 2015), making n=15 the first genuinely open case, so combined_score has real uncapped headroom above 1.0
- reciting an angle or cosine value is worth nothing without producing the literal point set; the oracle checks the submitted points directly, never a claimed number
- the shipped reference construction (randomized hill-climbing) is a real, standard technique, not the certified global-optimization methods behind the cited record, and does not reach it, leaving real headroom
known_shortcuts: The Tammes problem and its small known-optimal values are documented and may occur in training data; reciting a cosine value is not sufficient, since the oracle requires an actual point set that passes the same exact pairwise check anyone else would run, and beating the n=15 best-known record is a real result the oracle cannot be talked out of accepting or rejecting.
