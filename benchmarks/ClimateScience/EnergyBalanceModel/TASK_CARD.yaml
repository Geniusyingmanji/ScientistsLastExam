schema_version: 1
scientific_question: Can an agent select bounded forcing experiments, identify a supported two-layer climate-response model, and refuse null or structurally misspecified responses?
artifact: Five radiative-feedback, heat-capacity, ocean-exchange and forcing-scale parameters with confidence or an explicit model-inadequacy abstention.
oracle:
  model: deterministic annual two-layer energy-balance response with noisy surface-temperature and top-of-atmosphere imbalance observations, plus null, state-dependent-feedback and benchmark-strength three-layer-ocean worlds
  feasibility: finite bounded parameter artifacts and strictly charged forcing-experiment callbacks
  deterministic: true
normalization:
  baseline: make no experiment and abstain on every world
  reference: exact public-model parameters on supported worlds and correct refusal on unsupported worlds
  score: development mechanism/refusal recovery normalized above always abstaining; forcing prediction, forcing shifts and held-out worlds remain separate
citations:
  - id: doi:10.1029/RG019i001p00091
    title: Energy balance climate models
  - id: doi:10.1175/JCLI-D-12-00195.1
    title: "Transient Climate Response in a Two-Layer Energy-Balance Model. Part I: Analytical Solution and Parameter Calibration Using CMIP5 AOGCM Experiments"
  - id: doi:10.1029/2003GL018747
    title: A new method for diagnosing radiative forcing and climate sensitivity
invariants:
  - the public linear two-layer recurrence agrees with an independent ODE implementation
  - informative forcing experiments have full-rank scaled parameter sensitivity on every supported world
  - null and out-of-family responses reward refusal rather than forced two-layer parameters
  - exact supported parameters and correct unsupported refusals score one on both splits
  - always abstaining is valid but has zero normalized mechanism and forcing-transfer utility
  - invalid forcing, budget overspend, malformed artifacts and non-finite values fail closed
  - every hidden world receives a fresh candidate process and private temporary filesystem
  - held-out mechanism, forcing transfer, response kind and per-world metrics remain evaluator-only
known_shortcuts: The model is a synthetic global-mean linear climate abstraction with public equations. It omits spatial climate dynamics, carbon-cycle feedback, correlated internal variability and observational forcing uncertainty. The misspecified feedback and third-ocean-layer effects are deliberately strong enough to resolve inside a 160-year benchmark window and are not Earth parameter estimates. Public deterministic world generators require future server-held seeds, and any Earth-system or discovery claim requires independent GCM and observational validation.
review:
  domain: pending_external
  evaluator_security: automated_budget_artifact_equation_identifiability_refusal_metric_sealing_and_fresh_session_tests
