schema_version: 1
scientific_question: Allocate a finite measurement budget to maximize parameter information across heterogeneous local scientific models.
artifact: A multiset of candidate experiment indices, with repeated indices representing replicate measurements.
oracle:
  model: discrete Fisher information from procedural polynomial, Fourier, exponential-decay and saturation sensitivity matrices
  feasibility: exactly k finite integer indices within the supplied candidate grid; repetitions allowed
  deterministic: true
normalization:
  baseline: allocate measurements to the first k candidate rows
  reference: certified near-optimal fractional design satisfying the Kiefer-Wolfowitz sensitivity bound to relative tolerance 1e-4
  score: clipped D-efficiency improvement over the per-instance baseline; development and shifted validation remain separate
citations:
  - id: doi:10.1214/ss/1177009939
    title: "Bayesian Experimental Design: A Review"
  - id: doi:10.1137/1.9780898719109
    title: Optimal Design of Experiments
  - id: doi:10.4153/CJM-1960-030-4
    title: The Equivalence of Two Extremum Problems
invariants:
  - the fractional reference satisfies the Kiefer-Wolfowitz maximum-sensitivity condition
  - D-efficiency is invariant to nonsingular reparameterization of sensitivity columns
  - non-finite, fractional and out-of-range experiment indices fail closed
  - shifted-family validation metrics remain evaluator-only
known_shortcuts: Local Fisher information assumes a supplied linearization and does not prove that a design remains optimal under severe posterior or structural-model uncertainty. A generic exchange or multiplicative algorithm may also saturate at small outer-search budget, in which case this task is an on-ramp rather than an open-frontier headline task.
review:
  domain: pending_external
  evaluator_security: automated_invariant_sandbox_and_metric_sealing_tests
