invariants:
- registry-primary records sharing a registration are one statistical participant lineage regardless of article count
- the preregistered primary endpoint rather than the publication-highlighted outcome defines the effect estimate
- registry-first screening recovers eligible unpublished/null lineages and rejects wrong population, comparator or nonrandomized records
- supported linear worlds and resolvable nonlinear worlds share publication and noise mechanisms so refusal cannot use a public type label
- the prospective study result is unavailable until site, sample size, screening, model, claim and prediction interval are committed
- the returned confirmation commit must byte-for-structure equal the object submitted before the result
- duplicate confirmation calls, infeasible sample sizes, malformed IDs and non-finite or inconsistent artifacts fail closed
- every corpus receives a fresh candidate process and private temporary filesystem
- evidence integrity, mechanism, prediction, false discovery, forecast calibration, information gain and confirmation remain evaluator-only
known_shortcuts: The worlds are synthetic standardized-effect summaries with known registry linkage and omit full-text extraction, covariance between multiple endpoints, cluster trials, missing-data handling, risk-of-bias judgments, individual participant data, living-review search drift and clinical utility. Public fixed generators require server-held families. Real evidence claims require domain experts, source documents, protocol registration and genuinely independent prospective confirmation.
