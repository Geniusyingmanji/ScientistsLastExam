schema_version: 2
scientific_question: Can an agent screen registered and published studies by participant lineage, detect duplicate and outcome-selective reports, synthesize heterogeneous evidence, commit a calibrated forecast, and choose a fresh prospective confirmation study?
artifact: An executable registry/publication screening, linear random-effects meta-regression, immutable claim/forecast/study-design commit and post-confirmation update policy.
oracle:
  model: procedural randomized-study families with registry-primary records, duplicate participant-lineage publications, selectively highlighted outcomes, ineligible studies, linear supported worlds and resolvable nonlinear misspecification
  feasibility: exact screening schema, finite bounded model and confidence, one immutable pre-result commit, one cost-feasible preregistered confirmation study and consistent post-result artifact
  deterministic: true
normalization:
  baseline: abstain without screening, forecasting or commissioning a prospective study
  reference: truth-blind registry-first REML-style meta-regression, outcome/lineage audit, information-cost next-study design, preregistered prediction interval, nonlinear-family refusal and fresh-result update
  score: evidence integrity, mechanism, prediction, decision/refusal, forecast distribution, next-study information and post-confirmation update remain separate; the minimum defines robustness
