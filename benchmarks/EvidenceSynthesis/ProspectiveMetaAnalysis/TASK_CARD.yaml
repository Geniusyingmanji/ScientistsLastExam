schema_version: 1
scientific_question: Can an agent screen registered and published studies by participant lineage, detect duplicate and outcome-selective reports, synthesize heterogeneous evidence, commit a calibrated forecast, and choose a fresh prospective confirmation study?
artifact: An executable registry/publication screening, linear random-effects meta-regression, immutable claim/forecast/study-design commit and post-confirmation update policy.
oracle:
  model: procedural randomized-study families with registry-primary records, duplicate participant-lineage publications, selectively highlighted outcomes, ineligible studies, linear supported worlds and resolvable nonlinear misspecification
  feasibility: exact screening schema, finite bounded model and confidence, one immutable pre-result commit, one cost-feasible preregistered confirmation study and consistent post-result artifact
  deterministic: true
normalization:
  baseline: abstain without screening, forecasting or commissioning a prospective study
  reference: truth-blind registry-first REML-style meta-regression, outcome/lineage audit, information-cost next-study design, preregistered prediction interval, nonlinear-family refusal and fresh-result update
  score: evidence integrity, mechanism, prediction, decision/refusal, forecast distribution, next-study information and post-confirmation update remain separate; the minimum defines robustness
citations:
  - id: doi:10.1016/0197-2456(86)90046-2
    title: Meta-analysis in clinical trials
  - id: doi:10.1002/sim.1186
    title: Quantifying heterogeneity in a meta-analysis
  - id: doi:10.1002/sim.1482
    title: Improved tests for a random effects meta-regression with a single covariate
  - id: doi:10.1001/jama.291.8.974
    title: Different Patterns of Duplicate Publication
  - id: doi:10.1001/jama.291.20.2457
    title: Empirical Evidence for Selective Reporting of Outcomes in Randomized Trials
  - id: doi:10.1136/bmj.l5342
    title: A guide to prospective meta-analysis
  - id: doi:10.1136/bmj.n71
    title: The PRISMA 2020 statement
invariants:
  - registry-primary records sharing a registration are one statistical participant lineage regardless of article count
  - the preregistered primary endpoint rather than the publication-highlighted outcome defines the effect estimate
  - registry-first screening recovers eligible unpublished/null lineages and rejects wrong population, comparator or nonrandomized records
  - supported linear worlds and resolvable nonlinear worlds share publication and noise mechanisms so refusal cannot use a public type label
  - the prospective study result is unavailable until site, sample size, screening, model, claim and prediction interval are committed
  - the returned confirmation commit must byte-for-structure equal the object submitted before the result
  - duplicate confirmation calls, infeasible sample sizes, malformed IDs and non-finite or inconsistent artifacts fail closed
  - every corpus receives a fresh candidate process and private temporary filesystem
  - evidence integrity, mechanism, prediction, false discovery, forecast calibration, information gain and confirmation remain evaluator-only
known_shortcuts: The worlds are synthetic standardized-effect summaries with known registry linkage and omit full-text extraction, covariance between multiple endpoints, cluster trials, missing-data handling, risk-of-bias judgments, individual participant data, living-review search drift and clinical utility. Public fixed generators require server-held families. Real evidence claims require domain experts, source documents, protocol registration and genuinely independent prospective confirmation.
review:
  domain: pending_external_research_synthesis_and_biostatistics
  evaluator_security: automated_lineage_primary_endpoint_misspecification_commit_confirmation_sandbox_fresh_session_metric_sealing_and_fail_closed_tests
