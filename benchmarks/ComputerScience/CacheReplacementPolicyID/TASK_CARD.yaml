schema_version: 2
scientific_question: Identify the replacement policy of one set of a set-associative cache from charged access traces whose hit and miss outcomes arrive through a noisy timing channel, and either write it as a deterministic machine over the ways that is observationally equivalent to the hidden policy or decline because the policy is randomised.
artifact: A verdict, and for a policy a machine with a next state per way for hits and a victim way and next state for a miss in every state, with a confidence and an optional refusal.
oracle:
  model: one set of 4, 6 or 8 ways, reset by a flush and the loads of blocks 0..W-1 into ways 0..W-1; each world's policy is textbook LRU or tree PLRU, an age-table policy of the RRIP kind with its hit table and insertion age drawn, with or without ageing every way to the top on a miss, an age-table policy whose fills age every other way, a permutation policy in the sense of Abel and Reineke with its hit and miss permutations drawn at random, or an LRU that inserts at the evict-next end after four misses in a row; the refusal worlds run a bimodal insertion policy at 1/64 or 1/32, a tree PLRU whose victim is drawn at random once in 32 or 16 misses, or an age-table policy with random tie breaking; deterministic policies are compiled to their minimised reachable machines, 15 to 720 states, and a submission is compared with the truth by a breadth-first search over pairs of states
  feasibility: charged runs of W + len(trace) accesses against a budget of 200000 per world, traces of at most 4096 integer blocks, each outcome flipped with probability 0.02, each run seeded by the world, the trace and how many times that trace has run, overspend failing closed; a machine has at most 1024 states; calibrated refusal on the randomised worlds
  deterministic: true
normalization:
  baseline: ten random traces of 32 accesses played once each, the closest of LRU, FIFO and tree PLRU submitted as its machine at confidence 0.9, never declining
  reference: victim queries answered by replaying a prefix, missing once and probing the old blocks in a shuffled order, accumulated to a likelihood lead of 10^4 and remembered; a per-position tail test on six random traces and a pooled minority test on 32 bursts and loops at 48 runs each, either one failing a refusal; a library of 2064 age-table policies fitted by majority vote on 24 mixed traces, survivors settled by the victim query their difference names and checked on 16 traces; otherwise L* for Mealy machines with Rivest-Schapire counterexample processing, its equivalence queries 64 targeted traces at five runs each with every disagreement confirmed by six more, before L*, a permutation-policy fit in the manner of Abel and Reineke from eviction ranks under consecutive misses, checked on 64 traces; no generic L* hypothesis above 32 states claimed (verified family fits may be larger), a false-positive guard under which the 120-state switch policy and the 78- and 134-state fill-ageing policies are declined; it scores 0.778 on the development split and 0.750 held out
  score: development mechanism recovery normalized above always-abstain; a machine equivalent to the policy scores 1 in a deterministic world and one that differs anywhere scores minus one there and zero in a randomised world, declining scores zero and one; recovery, false discovery, refusal, coverage, calibration, runs used and the held-out split stay separate
