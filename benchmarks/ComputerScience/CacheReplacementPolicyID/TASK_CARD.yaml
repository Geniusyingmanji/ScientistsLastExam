novelty_risk:
  level: medium
  rationale: Learning replacement policies from hardware is published, from permutation-policy inference by measurement (Abel and Reineke 2013, 2014) to active automata learning over a cache abstraction (Vila et al. 2020), and the learning algorithms are textbook (Angluin 1987; Rivest and Schapire 1993; Shahbaz and Groz 2009). A model that knows them will reach for L* and a template library at once. What is not published is which policies these are, that two of them are random rarely enough to pass a majority vote, that one differs from LRU only after six misses in a row, and how a budget of 200000 accesses has to be split between the determinism tests, the victim queries and the equivalence checks under noise. The ablation shows the score turns on combining the determinism tests, the library, the permutation fit, L* and its checks rather than on any one of them, and the fixed 343-cell shortcut grid tops out at 86 per cent of the reference, at the permutation fit with L* and without the library. The reference declines three policies of 78 to 134 states under a 32-state claim guard that is a false-positive control, not a reserve. A first proposal that fits an age-table family as well as the permutation family can reach the reference, and the score moves in steps of 1/9. The independent fixed three-proposal review at c0b000c9 measured 2/9, 1/9 and 1/9 development, all fully valid and below the complete reference. This is bounded manual admission evidence on the original frozen input and runtime, not universal frontier difficulty, an independent mechanism-family holdout or a modern receipt-verified model campaign.
