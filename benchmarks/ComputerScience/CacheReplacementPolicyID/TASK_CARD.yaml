  template_source: >-
    frontier_eval/run_eval.py is generated by scripts/gen_task.py; the evaluator's per-world
    scoring, split summary and evaluate skeleton follow StructuralEngineering/ModalDamageAttribution,
    the repository's exemplar task, and the discovery tasks built on it; the policies, the machines,
    the equivalence check, the noisy cache, the metrics, the reference and the baseline are this
    task's own.
  edits_triggered_by_model: >-
    Before the independent calibration, eight edits came from the construction checkpoints. L* with
    Maler-Pnueli counterexample processing, adding every suffix, ran out of budget; it now uses Rivest-Schapire. Victim queries stopped at a likelihood lead of 200, and
    one wrong victim early in a remembered prefix corrupted every row built on it; the lead is now
    10^4. Random-trace equivalence checks missed a deep LRU state; the checks now mix in bursts of
    misses and hit permutations. L* claimed a wrong 88-state machine for the switch policy; no
    hypothesis above 32 states is claimed. A tree PLRU with a random victim once in 64 misses
    passed the per-position test; the pooled test on bursts and loops was added and the rarest
    randomised policies are 1/32 on development and 1/16 held out. With a 60-state five-way policy
    on the development split the reference with its cap raised tied the reference; that world is
    now a 720-state one. L* checked with 24 traces claimed a wrong 24-state machine on one
    prototype seed; it now uses 64. On the package's own evaluator the pooled test at 24 traces let
    the 1/32 policy through on two of 24 seeds, at z of 3.90 and 3.95; it now uses 32 traces.
    The frozen public prompt already mentioned permutation-family inference; policy
    family names were not treated as hidden information. On 2026-09-12,
    three fixed gpt-5.6-sol first proposals at frozen source c0b000c9 all attempted
    discovery and scored below the complete reference. No candidate, oracle, reference,
    world, budget or scientific contract was changed in response to these draws.
    Later metadata records the result and marks the introductory review as a historical
    snapshot. The original model input and runtime bindings remain unchanged in the
    private records; they are not re-signed for the integration source.
