  historical_threshold_rejected: >-
    The builder reference at 0.556 deliberately omits the published permutation-family
    inference used by its own 0.778 headroom rung. That lower score is not an admission
    threshold. The standalone augmented candidate above restores this family. The builder
    measured it in process at 0.778 and 0.750 (references/known_best.md). The independent
    2026-09-12 review repeated it in the real Linux sandbox at source a8cbb99d: both runs
    were valid in all 18 worlds, with exactly equal full metrics, development 7/9 and
    heldout 0.75, zero false claims and complete randomized-world refusal. Nine fixed
    methods were each evaluated twice. The machine contract also includes the strongest
    declared omission probe, without the age-table library, measured at 6/9 development.
    The independent 343-cell grid and eight-shift claim-guard review now also complete
    the bounded comparison. The two original invalid grid cells remain invalid; only
    their separately repaired, fully valid variants supply replacement evidence.
    Three fixed independent first proposals at c0b000c9 subsequently scored 2/9,
    1/9 and 1/9 development, all valid and below 7/9; their six independent replays
    exactly matched the original complete metrics. This passes the bounded D16
    first-proposal comparison, not a universal model-difficulty or certification claim.
