invariants:
- the cache behind run and the machine the score compares against are the same policy; with the noise off the simulator and the minimised truth machine give the same outcome on every trace tested, and the thirteen deterministic worlds are pairwise inequivalent minimal machines of 15, 24 (four of them), 40, 78, 120, 128, 134, 255 and 720 (two) states
- the switch world agrees with LRU until six misses in a row; the shortest word that tells them apart is six misses, and the reference declines it
- the pooled determinism test is what keeps rare randomness from being claimed; over 24 re-drawn seeds its z at 32 traces stays at or below 2.55 in every deterministic world and at or above 5.83 in every randomised one, where at 24 traces the random victim once in 32 misses fell to 3.90; without the test the reference claims two randomised worlds on the graded seed and 25 over eight re-drawn seeds, and averages 0.611 and 0.344
- a false machine costs one world wherever it is made, minus one in a deterministic world and zero where declining scores one; with every check removed the reference scores 0.111 and 0.000 with 49 false discoveries over eight seeds
- the reference declines the 120-state switch policy, the 134-state fill-ageing policy and the held-out 78-state one under its 32-state claim guard; without the permutation fit, which is the builder's first reference and the omission probe, it scores 0.556 and 0.500 and declines the two 720-state permutation policies and tree PLRU on eight ways as well
- raising the claim cap claims nothing more on the graded seed; at 1024 states the reference scores 0.778 and 0.750 there, averages 0.708 and 0.688 over eight re-drawn seeds and claims six wrong machines, five of them for the switch policy
- declining every world scores exactly zero by construction, and the closest textbook policy claimed everywhere scores zero; confidence feeds only the calibration axis
- runs are charged and overspend fails closed; the candidate receives a closure and not the ledger, so it cannot raise its own budget; the same trace run twice gives a fresh run and outcomes do not depend on the order of calls; malformed submissions and traces score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: >-
  a fixed grid of 343 strategies declared before any ran, .research/cache_policy/grid.py: blind
  textbook claims (7, all zero), the textbook templates fitted to noisy traces at five tolerances
  with 0 to 64 checks and every choice of determinism tests (80, best 0.222 and 0.000 held out),
  the age-table library alone (16, best 0.222), the permutation fit alone (16, best 0.333), the
  templates with the fit or the library (24, best 0.444), L* alone at caps of 8 to 1024 states
  with 4 to 128 checks (64, best 0.444), L* with the templates (8, best 0.556), L* with the library
  (64, best 0.556) and L* with the permutation fit (64, best 0.667); the grid tops out at 0.667 on
  the development split and 0.500 held out, 86 per cent of the reference, at the reference without
  its age-table library, and no cell reaches 90 per cent; over eight re-drawn seeds the best cells
  average 0.653 and 0.500 with no false discovery in the builder's construction records.
  The independent Linux replay completed the entire original grid: 341 fully valid cells,
  two oversized invalid templates excluded from the difficulty bound, and valid maximum
  6/9. Separately fixed variants of both invalid templates were each valid twice and
  scored zero. Original invalid observations are retained and never relabeled.
