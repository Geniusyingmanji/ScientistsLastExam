provenance:
  class: procedural
  target_source: >-
    Repository-visible deterministic worlds, twelve for development and eight sealed held out, each
    a (level, weak rate, seed) triple the evaluator instantiates on every run, carrying a measured
    flag for whether the budget can settle it. The level is the ground truth and is fixed before the
    candidate runs; the schedule, the races and the aborts are drawn from the world's own seed.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_completed
novelty_risk:
  level: medium
  rationale: >-
    The isolation-level ladder and the anomaly classes that separate its rungs are published
    (Berenson et al. 1995; Adya, Liskov and O'Neil 2000; Cerone, Bernardi and Gotsman 2015), and
    inferring them from an observed history of list-append registers by cycle detection is exactly
    what Elle does (Kingsbury and Alvaro 2021). A model that knows Elle will reach for a dependency
    graph, and it should: that part of the task is meant to be solvable. What the task adds is the
    part Jepsen leaves to the operator, deciding when a quiet run is evidence. Because the store's
    weak path is rare and the lock drains before it is granted, an anomaly needs two weak
    transactions at once, so a probe that is built correctly still usually returns nothing, and the
    only signal that a round was an experiment at all is in the operation clocks. Every strategy in
    the declared grid that skips that step, including the full Elle-style pipeline with no refusal,
    stays at or below 33 per cent of the reference on the development split and 54 per cent over
    four seed shifts. Task.md names the classes and the levels but not which worlds are starved,
    not the weak rates, and not the exposure rates the thresholds are read off. Three independent
    first proposals, each written from Task.md, solution.py and constraints.txt alone with no sight
    of the evaluator, the reference or any measurement, score 0.167, 0.083 and 0.000 against the
    reference's 0.500, so none reaches 90 per cent of it. No frontier draw through the repository's
    own harness has been run yet, so the difficulty at the frontier is not measured.
lineage:
  status: complete
  builder_model_ids:
  - claude-opus-5
  builder_scaffolds:
  - claude-code
  calibrator_model_ids: []
  calibration_runs: []
  calibration_evidence_status: missing
  template_source: >-
    frontier_eval/ is generated by scripts/gen_task.py; the evaluator's per-world scoring, split
    summary and evaluate skeleton follow Algorithm/JuntaVariableDiscovery and the discovery tasks
    it was built on; the store, the anomaly detection, the contention patterns, the power measure,
    the metrics, the reference and the baseline are this task's own.
  edits_triggered_by_model: >-
    No model has seen the task. The store was first passive, a fixed history handed to the auditor
    to classify, where the reference scored 1.000 because the question was decidable; it is now an
    active budgeted probe. The lock was first taken at the start of a transaction, so a weak
    transaction already in flight was interrupted and a single weak transaction sufficed to produce
    an anomaly; every level was then caught at every rate the budget could reach and the no-refusal
    strategy scored 1.000, 150 per cent of the reference. The lock now drains what is in flight
    before it is granted, an anomaly needs two weak transactions at once, and no-refusal falls to
    33 per cent. Parallel snapshot first delivered writes per element rather than per transaction,
    and then without respecting the committing transaction's causal past, which made it exhibit
    intermediate reads and read skew that its level forbids; delivery is now atomic per session and
    ordered after everything the transaction read. Begin and commit did not consume clock ticks, so
    a writer's commit and the following reader's begin shared an instant and no stale read could be
    witnessed; every event now has its own instant. The world set was last rebuilt when the
    settleability measurement was added: two rules fell out of it that the earlier set broke. An
    unsettleable strict serializable world pays a candidate that never declines the same +1 as one
    that reasoned, because the verdict defaults to the top of the ladder when nothing is witnessed;
    and unsettleable worlds high on the ladder witness nothing at all, so the cheap rule of
    declining only when nothing fired reached 83 per cent of the reference on a set built that way.
    The unsettleable worlds are now read committed, parallel snapshot and snapshot isolation, where
    classes above the truth do still fire and an uncalibrated answer is wrong rather than absent.
  shortcut_discoverer: builder_self_audit_with_a_twelve_strategy_declared_grid
  frozen_before_eval: false
  freeze_timestamp: null
