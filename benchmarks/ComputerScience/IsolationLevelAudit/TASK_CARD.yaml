  independent_recomputation_status: >-
    The reference, the baseline and every probe are runnable from this directory, and
    .research/isolation_level_audit/summary.py recomputes every quoted number in six sections:
    the twelve-strategy score grid, the three discovery axes for the same grid, the grid again
    under four re-drawn world seeds, the soundness sweep that no store exhibits a class its level
    forbids, the opportunity and exposure rates the reference's thresholds are read off, and the
    detection curve of a strategy that never declines by level and weak rate.
    .research/isolation_level_audit/settleable.py recomputes every settleability flag and fails if
    one disagrees with the evaluator or if any world lands in the band between them.
    .research/isolation_level_audit/blind.py scores the independent first proposals against the
    reference and prints the 90 per cent bar. .research/isolation_level_audit/budget.py checks the
    headroom this card and references/known_best.md claim, in three sections: how much concentrating
    the whole budget on the fork shape raises the long-fork hit rate on the starved parallel-snapshot
    worlds, what the reference's own rule scores with its shapes narrowed that way without the
    diagnosis, and whether raising the cycle-length bound changes the score at all, which it does
    not because no round produces more than five transactions. The
    bad-candidate shapes are in tests/test_isolation_level_audit.py. The sandbox evaluation of
    scripts/check_task_contribution.py has not been run because the task was built on a machine
    without Bubblewrap; a frontier-model draw has not been run because the machine has no model
    endpoint.
