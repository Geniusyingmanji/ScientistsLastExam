invariants:
- >-
  the level is a property of the world, fixed before the candidate runs, and the score is +1 for
  naming it, -1 for naming another and 0 for declining; declining every world scores exactly 0.0 and
  every fixed guess scores below that, so points come only from evidence
- >-
  no store ever exhibits an anomaly class its level forbids; the sweep in
  .research/isolation_level_audit/summary.py checks all six levels at three weak rates and three
  seeds, 300 rounds of all four patterns each, and finds no violation, so an auditor that reads the
  evidence correctly never names a level below the truth
- >-
  an anomaly needs two transactions on the weak path at once, because the global lock is not granted
  while anything is in flight; its rate is therefore quadratic in the hidden weak rate, which the
  candidate cannot change, and the operation budget buys opportunities rather than operations
- >-
  whether a round was a real opportunity is visible only in the operation clocks, since a
  transaction on the lock path is never interrupted and interleaved operations therefore prove both
  transactions took the weak path. Measured exposure given one opportunity is 0.57 at read
  uncommitted, 0.91 at read committed, 0.25 at parallel snapshot, 0.90 at snapshot isolation and
  0.95 at serializable, and the reference's per-level thresholds are the smallest counts that put a
  miss under 0.10
- >-
  which worlds the budget can settle is measured, not assumed. A draw counts as settled when a
  full-budget round-robin over the four patterns witnesses the class that pins the world's own level
  and would also have caught a store at every level below it at the same weak rate and seed; the
  flag is the share of 50 re-drawn seeds that come out settled. Six of the twelve development worlds
  and three of the eight held-out worlds are unsettleable, every settleable world measures at or
  above 0.94 and every unsettleable one at or below 0.18, and no world sits between 0.35 and 0.80,
  so no flag turns on where the line was drawn
- >-
  no unsettleable world is strict serializable or read uncommitted. The first is what the verdict
  defaults to when nothing is witnessed, so a starved world there would pay a candidate that never
  declines exactly what it pays one that reasoned; the second cannot be built, because a dirty write
  is the cheapest class to catch and even at min_weak_rate the budget settles such a store about
  half the time
- >-
  an abort carries no information about which path a transaction took, since every transaction on
  either path aborts at the same fixed rate; the abort-rate-only strategy scores 0.000
- >-
  operations are charged and running past the budget fails closed; the candidate receives one run
  closure and not the ledger, so it cannot raise its own budget; malformed submissions and malformed
  batches score the world -1 and never raise out of the evaluator
- held-out split, per-world rows, settleability flags and the discovery axes remain evaluator-only
known_shortcuts: >-
  A declared grid of twelve strategies was scored on the same worlds through the packaged
  evaluator, in five families. Blind answers: decline everything (0.000 by construction) and the
  three fixed guesses read committed, snapshot isolation and strict serializable (0.000 each, each
  wrong in nine to eleven of the twelve development worlds). Cheap readings of the history:
  anomalies per key only, which cannot see any class that spans two keys (0.000), and abort rates
  only, which reads which contention makes transactions abort (0.000). Undesigned traffic: the whole
  budget on random operations, then the full anomaly analysis (0.000, wrong or invalid in every
  world). The reference under-resourced: the same pipeline on a tenth of the budget (0.083, 17 per
  cent, and it declines eleven of the twelve). And the full design with the full anomaly analysis
  but a cheaper refusal: never declining (0.167, 33 per cent), declining only when nothing fired at
  all (0.167, 33 per cent), and measuring power in rounds of contention rather than in the rounds
  the clocks show were races (0.083, 17 per cent). The best of them reaches 0.167, 33 per cent of
  the reference, and it is not clean: it names the wrong level in four or five of the twelve
  development worlds where the reference names none. Over four seed shifts the best rises to 0.292,
  54 per cent, still with 16 wrong calls in 80 world-runs against the reference's zero. Every
  strategy that never names a wrong level scores 0.000 by declining everything. Separately, because
  the headroom the reference leaves is budget concentration, the reference's own rule was rescored
  with its four contention shapes narrowed to one or two, which is what concentration would look
  like without the diagnosis that earns it: fork alone 0.000, disjoint alone 0.000, repeat alone
  0.083, conflict alone 0.167, fork with conflict 0.250, the best of seven and 50 per cent. Blind
  narrowing drops the shapes that rule out the other boundaries, so it declines worlds the full
  sweep names.
