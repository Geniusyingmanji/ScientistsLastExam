schema_version: 2
scientific_question: Decide which of six isolation levels a black-box transactional store implements, from batches of concurrent transactions the auditor designs under an operation budget, when the store takes its weak path only rarely so that the anomaly separating two levels is a race whose rate is quadratic in a hidden probability, and decline when the budget did not buy enough races to rule out the level below the one the evidence reaches.
artifact: The named isolation level, with a confidence, or a refusal.
oracle:
  model: >-
    a store over list-append registers that implements exactly one of read uncommitted, read
    committed, parallel snapshot, snapshot isolation, serializable and strict serializable. Most
    transactions take a global lock, read the authoritative state and run with no other operation
    falling inside theirs; the lock is not granted while any transaction is in flight, so a
    transaction on the weak path is never interrupted by one on the lock path and an anomaly needs
    two weak transactions at once. With a hidden probability drawn per transaction, from 0.04 to
    0.30 across the worlds, a transaction takes the level's own concurrency control instead: read
    uncommitted installs its appends before it commits and may roll them back, read committed reads
    the latest committed state with no certification, parallel snapshot reads a per-session replica
    whose delivery is causally ordered but otherwise reordered, snapshot isolation reads a snapshot
    taken at its start and certifies its writes against it, serializable answers a read-only
    transaction from a replica four ticks behind and certifies a read-write transaction both ways,
    and strict serializable certifies both ways from a fresh view. Every transaction on either path
    aborts on its own with probability 0.04, so an abort does not say which path it took. The level
    is fixed before the candidate runs and does not depend on what it does
  feasibility: at most 9000 operations per world, at most four sessions and eight operations per transaction and 400 per batch; running past the budget fails closed; the schedule is the engine's and not the caller's; calibrated refusal where the opportunities are too few
  deterministic: true
normalization:
  baseline: >-
    symptom scan, contention at two sessions and a scan for a read of an element whose writer went
    on to abort and for a key whose list came back shorter than before; it never builds a dependency
    graph and never declines, and it scores 0.000 with ten of the twelve development worlds named
    wrongly
  reference: >-
    opportunity-counted audit, four packed contention patterns (two writers over the same key pair
    in opposite orders, two writers with disjoint write sets and crossed reads, two causally
    independent writers watched from their own sessions, one writer appending twice while others
    watch), Adya-style cycle detection over the version order recovered from the reads, power
    counted as the rounds whose operation clocks prove two transactions raced on the weak path, the
    budget focused on the patterns that could still lower the verdict, and a refusal when a level
    below the verdict has fewer than its threshold of quiet opportunities; it scores 0.500 on the
    development split and 0.625 held out with no world named wrongly
  score: >-
    development mechanism, the mean of +1 for the right level, -1 for a wrong one and 0 for a
    refusal, clipped below at zero so that declining every world is exactly 0.0; identification,
    misidentification, false discovery, correct refusal, coverage, calibration, operations used and
    the held-out split stay separate
