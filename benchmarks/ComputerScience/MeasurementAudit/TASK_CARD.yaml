schema_version: 2
status: protocol_fixture
difficulty: unmeasured
integration_status: evidence_episode_adapter_outside_legacy_registry
task_id: DiscoveryEvidence/MeasurementAudit
scientific_question: >-
  Form competing, falsifiable explanations from observed measurements; choose
  discriminating observations, register predictions, and assess their empirical
  support and limitations without a reference discovery or hidden answer key.
artifact: Immutable evidence dossier with hypotheses, revisions, rationales, native tool observations, prospective predictions, counterevidence, and reserved-partition tests.
evaluation:
  mode: evidence_only
  ground_truth: absent
  hidden_mechanism_oracle: absent
  candidate_answer_matching: absent
  scientific_correctness_score: absent
  combined_discovery_score: absent
  deterministic_checks: Registration chronology, native evidence references, numerical prediction compatibility, discriminating intervals, counterevidence accounting, and immutable replication requests.
  semantic_review: Scientific reasoning, assumptions, alternative plausibility, causal identification, importance, and novelty require independent expert review.
  interpretation: Compatibility is empirical support for an operational prediction, not proof of a unique or true scientific explanation.
data:
  bundled_source: Hand-entered numerical protocol fixture; no empirical scientific measurements or actual scientific claim.
  bundled_role: protocol_only_unscored
  external_source: Explicit operator-supplied numeric measurement bundle, loaded as a fixed immutable snapshot.
  manifest_contract: Exactly manifest.json and measurements.csv; manifest binds exact CSV SHA256, column units and meanings, provenance, partition design, and limitations.
  loader_limits: At most 16 numeric columns, 10000 rows, 4 MiB per file; finite numbers; unique sample IDs; two or more rows per declared partition.
  filesystem: No symlinks in supplied path or ancestors; no extra files; regular files opened with O_NOFOLLOW; values copied into the trusted broker snapshot.
  provenance_authentication: operator_asserted_not_verified
  seed_semantics: Seed does not generate data, reshuffle partitions, or create independent worlds.
tools:
  exploration: Charged selected row access and numerical summary queries.
  replication: Summary queries from a sealed partition after immutable dossier commitment; no raw replication rows exposed.
  budget: 4096 total row-access units including both phases; summary cost uses total partition size so preflight does not disclose group membership.
  measurements: Repeated requests reuse the same observed rows and are not fresh samples.
  unavailable_result: Groups with fewer than two rows return insufficient_samples and null numbers; no forced numerical conclusion.
isolation:
  candidate_execution: Existing CandidateProxy Linux bubblewrap and seccomp boundary; no direct environment imports or private data files.
  analysis: Persistent candidate-only Python within one episode, fresh state for a new episode, JSON-only observations from the trusted broker.
  access: Replication is one-way and opens after commitment; exploration closes; planned replication uses the same finite budget.
  network_and_processes: Candidate workers cannot open network sockets or fork processes under the existing sandbox policy.
  proof_limits: Hashes bind content, not external origin or scientific validity. Isolation does not prove independence or eliminate model training contamination.
independence:
  held_out_same_source: A reserved measurement partition can test a prospective prediction but is not an independent external collection.
  independent_collection: Requires operator provenance and scientific verification; the manifest label alone does not establish independence.
  sampling_unit: Unique row IDs are enforced, but actual subject identity and clustered dependence require upstream review.
  standard_errors: Conventional independent-sample formulas; not validated for dependent or selected measurements and not converted into significance or correctness labels.
  chronology_limit: A new query on previously exposed fixed rows is not a fresh scientific experiment. Strong replication claims require sealed observations and scientifically justified independence.
controls:
  examples: examples/discovery_actions.json demonstrates competing predictions, registration, native evidence, and frozen replication on the fixture only.
  negative_cases: Empty claims, insufficient samples, unsupported citations, post-hoc tests, and contradictory evidence must not become scientific discovery credit.
frontier:
  eligible: false
  calibrated: false
  model_draws: 0
  fixture_capability_claim: forbidden
  novelty_claim: none
  difficulty_claim: none
review:
  domain: pending_real_dataset_and_external_scientific_review
  local_tests: tests/test_measurement_audit.py
  linux_boundary_tests: tests/test_discovery_evidence_sandbox.py
