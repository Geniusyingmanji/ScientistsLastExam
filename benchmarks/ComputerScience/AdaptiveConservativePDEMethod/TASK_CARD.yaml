schema_version: 2
scientific_question: Can one deterministic adaptive finite-volume method improve cell-average accuracy across a frozen smooth-and-shock scalar conservation-law panel while balancing nonlinear stability and work under a hard work budget and satisfying the shared discrete-conservation gate?
artifact: One exact-field numerical-method design containing a reconstruction, limiter, Riemann solver, time integrator, grid resolution, CFL factor, curvature-sensor threshold, shock blend and flux-dissipation coordinate.
oracle:
  model: Deterministic one-dimensional finite-volume replay of constant-coefficient advection and inviscid Burgers equations using closed-form cell-average targets for smooth, wrapped and Riemann profiles.
  feasibility: One invariant exact-field method, finite public-bounded continuous coordinates, documented discrete choices, and no world exceeding 120000 cell-stage work units; malformed, inconsistent, nonfinite, exception-producing and overbudget methods fail closed.
  deterministic: true
normalization:
  baseline: Legal 32-cell piecewise-constant Rusanov/Euler method with CFL 0.45 and dissipation multiplier 1.15.
  reference: Executable 192-cell adaptive WENO3/Superbee/Godunov/SSPRK3 witness with curvature-triggered fallback; it is not a global optimum.
  score: Smooth/shock-stratified four-world utility whose primary estimand is an accuracy--stability--work tradeoff under a hard work budget; the conservation term audits the shared conservative update and the evidence predicate gates balance failure. It is affinely normalized above the baseline and uncapped at the reference; all held-out axes remain separate. Reported combined_score and raw_utility values are rounded to 6 decimal places.
citations:
- id: doi:10.1016/0021-9991(79)90145-1
  title: Towards the ultimate conservative difference scheme. V. A second-order sequel to Godunov's method
- id: doi:10.1016/0021-9991(88)90177-5
  title: Efficient implementation of essentially non-oscillatory shock-capturing schemes
- id: doi:10.1006/jcph.1996.0130
  title: Efficient Implementation of Weighted ENO Schemes
invariants:
- the artifact is one numerical discretization policy, not a PDE parameter fit, state estimate or physical design
- the same public problem mapping is presented independently at all seven scientific world boundaries and one canonical method is required
- candidate process, module, imported-module and private temporary-filesystem state is reset between panel worlds
- every update is a conservative numerical flux difference and fixed-boundary balance uses the matching Runge--Kutta flux quadrature
- accuracy, stability, discrete balance and cell-stage work remain separately reported; conservation is a shared conservative-update integrity gate rather than a separately learned capability
- the four development worlds alone determine combined_score; three held-out worlds do not affect selection
- the legal weak baseline scores exactly zero, the executable witness scores exactly one, and better utilities can exceed one
- inactive DSL coordinates are canonicalized away before artifact identity is assigned
- evaluator-produced frontier_records bind the canonical method to the frozen evidence predicate and evaluation panel
- later task-family expansion requires a new immutable wave rather than mutation of this panel
known_shortcuts: A first 216-point audit of the original MUSCL task found that removing the sensor improved the score to 1.104486, so that oracle was rejected before freeze. After adding WENO3 with sensor-triggered fallback, a 432-method nonadaptive grid over reconstruction, limiter, flux, integrator, grid and CFL reached 0.988555, below the reference. A 48-point local CFL/sensor search around the formerly exposed reference found score 1.002071 and raw utility 0.9716657335; the exact reference was removed from agent-visible text and the found point is now the wave ledger incumbent, so its reconstruction earns no lifetime credit. Those finite public searches are sufficient to classify this wave as an on-ramp that must not be paired or advertised as hard. The visible seven-world one-dimensional uniform-grid panel remains susceptible to direct deterministic search and omits convergence proofs, systems, multidimensional meshes, stiffness, general positivity, parallel cost and application validation.
