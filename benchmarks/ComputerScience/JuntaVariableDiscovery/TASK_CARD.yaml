schema_version: 2
scientific_question: Recover the set of variables an unknown Boolean function of n variables depends on, its junta, from membership queries whose answers are each flipped with a published noise rate, under a query budget, when some relevant variables act only through a parity or a gate and carry no single-variable correlation with the output, and decline when no junta of the published size can explain the answers.
artifact: A verdict, and for a junta the list of variables the function depends on, with a confidence and an optional refusal.
oracle:
  model: a function of 28 variables; in a supported world it is a multiplexer that reads a selector variable and returns either a majority-style threshold of a four-variable additive block or the parity of a three-variable block xored with a parity gated on two control variables, so its twelve relevant variables sit at three influence levels, seven near 0.12, one near 0.37 and four near 0.50, and seven of them carry zero degree-one correlation; an unsupported world is a parity of 14 to 18 variables, more than the published junta size, whose every variable has influence one; each answer is flipped independently with probability 0.10; the true relevant set and each variable's influence are functions of the world alone and the excess influence kappa* that any junta of the published size must leave uncovered is zero in every supported world and the parity size minus twelve in every unsupported one
  feasibility: at most 20000 queried labels per world; running past the budget fails closed; each campaign's label noise is seeded by its own run seed; calibrated refusal on the unsupported worlds
  deterministic: true
normalization:
  baseline: degree-one correlation, one random point per query over the whole budget, each variable's Fourier coefficient with the answer, a family-wise margin from zero, decline when more than the published size clear it; it never sees a variable that acts only through a parity or a gate and never declines a big parity
  reference: pivotal pairs, the budget split evenly over the variables at ninety per cent of it, each variable flipped against random backgrounds, its disagreement rate read against the noise floor 2 eta (1 - eta) and named relevant when it clears the floor by z standard errors with z the normal quantile of delta over n, declining when more than the published size clear it; delta is 1e-3 per world so the chance any irrelevant variable is named is at most delta by a union bound; it scores 0.548 on the development split and 0.604 held out
  score: development mechanism normalized above always-abstain; in a supported world a named set that is a subset of the true relevant variables scores the fraction of them it recovers, and naming any irrelevant variable is a false discovery worth minus one; in an unsupported world declining scores one and a claim zero; recall, false discovery, refusal, coverage, calibration, queries used and the held-out split stay separate
