provenance:
  class: procedural
  target_source: Repository-visible deterministic worlds with twelve development functions (seven supported, five unsupported) and six sealed held-out functions (four supported, two unsupported), each drawn by the evaluator from its own seed, with the campaign's label noise drawn from a separate run seed; the relevant sets, the influences and kappa* are recomputed from the worlds on every run.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_completed
novelty_risk:
  level: medium
  rationale: That a function can depend on a variable only through a parity, where its degree-one correlation vanishes, is textbook Fourier analysis of Boolean functions (Kahn, Kalai and Linial 1988; O'Donnell 2014), and junta learning and testing are published problems (Blum and Langley 1997; Mossel, O'Donnell and Servedio 2004; Fischer, Kindler, Ron, Safra and Samorodnitsky 2004; Blum, Hellerstein and Littlestone 1995). A model that knows them will reach for correlations or a low-degree fit. Correlation-only methods score zero because they miss the parity and gated variables and claim every big parity. What the task fixes is the budget, the noise rate and the junta size so that the pivotal test barely certifies the weakest relevant variables, and the refusal threshold so that a big parity is declined and a junta is not. The shortcut probe bounds a distinct cheap strategy at 61 per cent of the reference, and not cleanly. The same test at three standard errors scores 0.764 with no false discovery over twelve run seeds, but it keeps no family-wise bound, since its exact chance of a false discovery per junta world is 0.0076 against 1.0e-4 for the reference; the gap is a choice of error rate and not an omitted method. Task.md names neither which worlds are juntas nor which relevant variables act through the parity or the gate. No frontier draw has been run yet, so the difficulty at the frontier is not measured.
