invariants:
- the answers come from the published model; every label is the function at the queried point flipped independently with the published rate, and the test suite checks a campaign's flip rate against the true function
- the true relevant set is a function of the world; a variable is relevant exactly when flipping it changes the function on a positive fraction of inputs, and the recorded influences of the twelve relevant variables of every supported world sit at three levels, seven near 0.12, one near 0.37 and four near 0.50, so the seven weakest sit at the edge of what the budget certifies
- every unsupported world is a parity of more than the published junta size, so kappa* is the parity size minus twelve, from 2 to 6, and is zero in every supported world; no supported world is a false parity and no unsupported world is a junta of the published size
- a variable that acts only through the parity or the gate has degree-one correlation zero, so a method that reads correlations alone recovers none of them and declines nothing; the baseline scores zero and makes a false discovery in seven of the eighteen worlds
- a named irrelevant variable costs one world in a supported world and a claim costs one in an unsupported world; the reference makes no false discovery in 216 world-runs over twelve run seeds and declines every unsupported world
- declining every world scores exactly zero by construction, and so do naming all twelve variables everywhere and a random twelve everywhere; confidence feeds only the calibration axis
- queries are charged and running past the budget fails closed; the candidate receives one query closure and not the ledger, so it cannot raise its own budget; malformed submissions and malformed calls score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: >-
  a probe of ten strategies that do not run the full-budget pivotal test with a family-wise refusal,
  in four families: blind answers (decline everything, name all twelve, name a random twelve; the
  two claiming strategies make a false discovery in every world and score zero, declining scores
  zero), degree-one correlation at a family-wise margin or at a hand-set 0.02 and 0.05 (three, all
  zero with a false discovery in most worlds, since correlation cannot see a parity or a gated
  variable and cannot decline a big parity), the pivotal test without the refusal (one, zero, it
  claims every unsupported world), and the pivotal test with a fixed additive floor margin of 0.02
  and 0.03 or with correlation for the claims and a pivotal pass only for the refusal (three, best
  0.333 on the development split but with false discoveries; the only strategies that make none score
  zero by declining everything). The best of them reaches 0.333, 61 per cent of the reference, and it
  is not clean: every strategy that makes no false discovery over twelve run seeds scores zero. The
  reference under three-quarters of its budget, still the full pipeline, scores 0.469, and under half
  0.428; that is the method under-resourced, not a shortcut.
