novelty_risk:
  level: medium
  rationale: That offsets cannot be separated from delay asymmetry is textbook (Lundelius and Lynch 1984; Freris, Graham and Kumar 2011), the optimal bounds under delay bounds are published (Halpern, Megiddo and Munshi 1985; Attiya, Herzberg and Rajsbaum 1996), and so are the lower-envelope LP for skew (Moon, Skelly and Towsley 1999) and minimum filtering (Mills 1991; Veitch, Babu and Pasztor 2004). A model that knows them will reach for NTP minima or an envelope fit. What is not published is how to turn a floor on the empty-queue probability into rows that make faults visible under jitter, and how to split 20000 exchanges over links and time when rates drift by up to 30 ppm. NTP-style answers score zero because they claim every unsupported world and miss offsets in supported ones, and an envelope LP without the empty-queue rows scores zero too. The shortcut probe bounds what a searcher gets at 68 per cent of the reference. The gap between the reference and the same LP at a three-sigma margin is a safety choice and not an omitted method; its union-bound margins are wide, and at 2.5 sigmas the held-out false discoveries begin. Task.md names neither the faults' kinds nor which worlds carry them. No frontier draw has been run yet, so the difficulty at the frontier is not measured.
