provenance:
  class: procedural
  target_source: Repository-visible deterministic worlds with twelve development networks (seven supported, five unsupported) and six sealed held-out networks (four supported, two unsupported), each drawn by the evaluator from its own seed, with the campaign's queueing and jitter drawn from a separate run seed; the identifiable widths are recomputed from the worlds on every run.
