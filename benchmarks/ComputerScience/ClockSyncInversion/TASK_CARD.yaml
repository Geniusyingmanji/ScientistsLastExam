  edits_triggered_by_model: >-
    No model has seen the task. Six edits came from the construction checkpoints. The oracle's
    identifiable-width LP was first run on the unsupported worlds too, where it is infeasible; widths
    are computed for supported worlds only. Fault sizes were first judged in seconds, and faults on
    software-stamped nodes were invisible under their 2 us jitter; detectability is now measured in
    pair jitters and every unsupported world sits at 13 or more. With an empty-queue floor of 0.01 the
    detection-only shortcut reached 91 per cent of the reference held out; the floor is now 0.05, the
    calibrated asymmetries sit near their bound and the held-out worlds have more calibrated links.
    That change re-drew every world, and three unsupported worlds fell to a detectability of 0 to 2.7;
    their faults were moved and resized. A reference with upper margins at the family-wise z
    on the lowest residuals alone was beaten by 27 and 31 per cent by the same LP at z = 3; the
    order-statistic rows cut that to 15 and 18 per cent, documented as headroom. Robustness runs first
    re-drew whole worlds; they now re-draw only the campaign. Task.md names neither the faults' kinds
    nor which worlds carry them.
