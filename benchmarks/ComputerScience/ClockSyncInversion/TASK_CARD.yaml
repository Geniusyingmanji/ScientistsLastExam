  independent_recomputation_status: >-
    On revision 56778e87 the fixed ten-call Linux sandbox plan completed with two
    valid baseline scores of zero and eight invalid candidate_runtime_error results
    across reference, detection-only, no-order and no-atom pairs; those records keep
    score -1e18 and are not rewritten. The cause was the LP solver: HiGHS starts
    worker threads, which the sandbox's seccomp filter denies, and the interior-point
    fallback stops at its iteration limit in two of the 18 worlds. The reference and
    its three declared candidates now solve the same LPs with SciPy's revised simplex
    (Bland's rule), which runs in the calling thread. .research/clock_sync/solver_check.py
    reproduces the thread count and compares the package solver with HiGHS world by
    world over eight run seeds. The reference, the ladder, the 29-strategy probe and
    the sixteen-seed robustness check were re-run in process on this source, and
    summary.py recomputes every quoted number. Not run here, because the build machine
    has no Bubblewrap and no model endpoint: the Linux sandbox gate that fills the
    shortcut_probe declarations, the wrapper double run and the first-proposal calibration.
