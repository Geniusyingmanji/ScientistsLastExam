  template_source: >-
    frontier_eval/run_eval.py is generated by scripts/gen_task.py; the evaluator's per-world
    scoring, split summary and evaluate skeleton follow StructuralEngineering/ModalDamageAttribution,
    the repository's exemplar task, and the discovery tasks built on it; the network, the clocks,
