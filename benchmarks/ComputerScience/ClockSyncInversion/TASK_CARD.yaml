invariants:
- the exchanges come from the published model; every one-way delay is its propagation plus non-negative queueing plus jitter, at least one probe in twenty finds the queue empty at any time, every propagation is at or above its lower bound and every calibrated asymmetry within 1 us, and the test suite checks a campaign's delays against the true clocks
- the oracle's widths are exact; with unlimited noiseless data the rates are identified and the offsets are not, and what bounds them is the lower bounds and the calibrated links; the identifiable widths of the eleven supported worlds run from 0.90 to 53.82 us
- every unsupported world is detectable and no supported one is; the smallest relaxation that lets affine clocks and constant delays within the bounds reproduce every true floor trajectory is 13.0 to 23.2 pair jitters in the unsupported worlds and zero in the supported ones
- the empty-queue rows are what catch the faults; without them the reference claims six of the seven unsupported worlds and scores 0.000 on both splits, with one row over the whole horizon instead of one per third it claims four and scores 0.116 and 0.228, and used only as a test they catch every fault and leave intervals that score 0.348 and 0.257
- an interval that misses costs one world wherever it is claimed, minus one in a supported world and zero where declining scores one; the reference makes no false discovery in 288 world-runs over sixteen run seeds
- declining every world scores exactly zero by construction, and so do the baseline and a claim of one second either side of zero everywhere; confidence feeds only the calibration axis
- exchanges are charged and running past the budget or the horizon fails closed; the candidate receives two closures and not the ledger, so it cannot raise its own budget or rewind the time; malformed submissions and malformed calls score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: >-
  a 29-strategy sweep over blind answers (2, both zero), NTP midpoints on all the data and NTP with
  a rate at margins from 1 us to 1 ms (10 including the baseline, all zero with false discoveries in
  every world), per-round Cristian boxes from the minimum delays and the lower bounds with and
  without a rate (4, zero, since drift within a round empties the boxes), the reference's LP without
  empty-queue rows with a line test on per-round NTP differences at no threshold or at 2, 5 and 10 us
  (4, zero), and the LP with detection only, by the reference's empty-queue rows at three upper
  margins or by a hand-set floor test at 2, 3 and 5 pair jitters over thirds or rounds (9, best
  0.385), tops out at 0.385 on the development split and 0.298 held out, 68 and 59 per cent of the
  reference, with the empty-queue rows used only as a test and an upper margin of three jitters;
  over eight re-drawn run seeds that strategy averages 0.385 and 0.296 with no false discovery
