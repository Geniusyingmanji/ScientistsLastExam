scientific_question: Bound the clock offset of every node of a small network at the start and at the end of a horizon from charged two-way timestamp exchanges whose one-way delays mix constant propagation, random queueing and timestamp jitter, given a lower bound on every propagation delay and an asymmetry bound on some links, and decline when no affine clocks and constant delays within those bounds explain the exchanges.
artifact: A verdict, and for offsets an interval for every clock at both epochs, with a confidence and an optional refusal.
oracle:
  model: 5 to 8 nodes on a random connected network of 6 to 12 links; node 0 keeps true time and every other clock is affine with an offset within 3 ms and a rate within 30 ppm; each direction's delay is a constant propagation of 50 us to 2 ms plus queueing that is empty with a probability driven by a sinusoidal load between the published floor of 0.05 and 0.5, and exponential with a mean of 6 us to 2.6 ms otherwise; every timestamp carries Gaussian jitter of 0.2 us, or 2 us on software-stamped nodes; the lower bounds sit up to 30 us under each propagation, and a calibrated link's asymmetry is 0.6 to 1.0 of its 1 us bound; the unsupported worlds carry a rate step of 2.5 or 3 ppb halfway through, a jump of 10 us at 40 per cent of the horizon, or a calibrated link whose asymmetry is off by 40 or 60 us; the identifiable width of every offset is computed exactly by two linear programs per clock
  feasibility: at most 20000 exchanges per world, 0.25 s apart within one call, over a horizon of 14400 s; running past the budget or the horizon fails closed; each campaign is seeded by its world; calibrated refusal on the unsupported worlds
  deterministic: true
normalization:
  baseline: NTP with a rate, twelve rounds of exchanges on every link, per-round minimum delays in both directions and half their difference, a line through the rounds, offsets carried from node 0 along a breadth-first tree, five microseconds either side, never declining
  reference: twelve rounds spread over the horizon, rough clocks from per-round minima, upper rows from the three lowest residuals of every round and from a Beta order statistic, a lower-envelope LP, empty-queue rows for each third of the horizon from a binomial count at the published floor and the quantile of the least jitter, lower bounds and calibrated asymmetry bounds, intervals from the LP's extremes and a refusal when it is infeasible; family-wise error at most 0.00075 per world by a union bound, the tilt allowance aside; it scores 0.569 on the development split and 0.503 held out
  score: development mechanism normalized above always-abstain; in a supported world intervals that cover every offset score the mean over clocks and epochs of the identifiable width over the submitted width, capped at one, and a miss scores minus one; in an unsupported world declining scores one and a claim zero; sharpness, false discovery, refusal, coverage, calibration, probes used and the held-out split stay separate
