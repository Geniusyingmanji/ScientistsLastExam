scientific_question: Recover heterogeneous continuous dose-response functions when source covariates are aligned, identify what bridge experiments add, and predict new target mixtures while bounding inaccessible cells.
artifact: Four typed Bernstein response curves, coefficient intervals and covariance, resolved effect-modifier assertions or partial identification.
oracle:
  model: Bernoulli responses with site-invariant cell-specific cubic Bernstein dose effects; four binary-modifier cells, unknown recruitment enrichments, paid random biomarker measurements and known target weights.
  feasibility: 12000 scalar cost units; external session enforces accounting, isolation and immutable commitment.
  deterministic: true
  confirmation: New doses and population mixtures,40960 complete simulated outcomes; same generator family, not external real-world validation.
normalization:
  baseline: Strong fixed factorial and zero-prior controls retained; no scalar score normalization disguises saturation.
  reference: Truth-blind recruitment surveys plus curve fitting; adaptive superiority is not established or required.
  score: Separate response errors, uncertainty scores, resolved modifier recovery, false claims, coverage and conjunction of publicly specified precision conditions.
citations:
- id: doi:10.1073/pnas.1510507113
  title: Causal inference and the data-fusion problem
- id: doi:10.1198/016214506000001437
  title: Strictly Proper Scoring Rules, Prediction, and Estimation
invariants:
- Paired worlds have identical source interventions but different discordant response curves.
- In access-limited pairs all public metadata and all accessible tools agree, while deployment effects differ; full bounds are valid and forced unique answers are not.
- Site enrichments and deployment weights are sampled independently of response coefficients.
- Bernstein nonnegativity ensures valid Bernoulli probabilities and finite identification bounds.
- Confirmation is independent of exploration; only precommitted curves predict new doses and mixtures.
- Fixed and random controls use full public budgets without wasting surveys; zero-prior and metadata-only controls expose vacuous successes.
- Exact generator-mask recovery is diagnostic; meaningful modifier resolution has an explicitly unresolved band.
known_shortcuts: >-
  The public small polynomial family permits generic regression. A strong fixed design can outperform
  adaptive recruitment and can saturate exact-mask diagnostics. Zero priors can score high on negligible
  modifiers and claim coverage. Wide bounds correctly cover inaccessible cells without any discovery.
  These controls must accompany quantitative error, sharpness, calibration and joint-success reports.
