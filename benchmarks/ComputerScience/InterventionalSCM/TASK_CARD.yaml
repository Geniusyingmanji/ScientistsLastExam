schema_version: 2
scientific_question: Recover directed causal structure and structural coefficients by choosing budgeted observations and interventions.
artifact: A directed adjacency matrix, structural coefficient matrix, confidence, and optional null-mechanism abstention.
oracle:
  model: procedurally generated linear-Gaussian acyclic structural causal models with hidden variable order and a null world
  feasibility: fixed sample-budget callbacks, finite matrices of shape seven by seven, no self edges
  deterministic: true
normalization:
  baseline: always abstain and submit the null mechanism
  reference: exact hidden graph and structural coefficients
  score: clipped improvement in mechanism recovery over calibrated no-claim abstention
citations:
- id: doi:10.7551/mitpress/11283.001.0001
