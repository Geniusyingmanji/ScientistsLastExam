schema_version: 2
scientific_question: Can a budgeted size ladder identify which asymptotic class a
  black-box program belongs to, while refusing branching runtimes and noise floors
  that no single law explains?
artifact: Six-class probabilities, a positive scale constant, optional abstention
  and a confidence scalar.
oracle:
  model: deterministic seeded class worlds with log-uniform scales, seven percent
    multiplicative timing noise, sizes bounded by 384, branch worlds mixing c*m^2
    and c*m*log2(m) by size mod 3, and jitter worlds at sixty percent noise
  feasibility: probabilities over exactly the six classes, positive finite scale,
    charged tiers within a nine-unit budget
  deterministic: true
  external_tooling: none beyond NumPy
difficulty_ladder:
  default_level: 1
  levels:
    1: seven percent noise, public mod-three branching, sixty percent jitter
normalization:
  baseline: one timing, uniform probabilities and a fixed mid-range scale
  reference: residue-covering six-size ladder with a 192 top, fixed-shape penalized
    class selection, public mod-three split-fit branch test and repeated-size jitter gate
  score: geometric mean of class probability, log-scale score and sealed
    extrapolation, multiplied by 1 - 0.25 * budget_used / 9 on supported discoveries and normalized
    above always abstaining; refusal credit remains unweighted on its separate axis
citations:
- id: isbn:9780262033848
  title: Introduction to Algorithms
invariants:
- repeated sizes draw fresh multiplicative noise
- branch worlds are exact deterministic functions of the size
- a full abstention scores exactly zero after normalization
known_shortcuts: Uniform probabilities with a fixed scale score 0.000; the full-budget reference
  reaches 0.711/0.703 after profiling-efficiency calibration with zero false discoveries.
  A reconstructed minimal first-shot ladder without refusal gates reaches 0.364/0.030 and
  disabling the jitter gate drops the reference to 0.544/0.370, so difficulty rests on the
  class-separation gap, refusal axes and budget. Formal
  clean Linux calibration and independent review remain pending.
