schema_version: 2
scientific_question: Can finite-size timing experiments separate asymptotic families after fitting a bounded
  nuisance correction, while refusing model inadequacy and budget-limited class ambiguity?
artifact: Six-class probabilities, a positive scale constant, optional abstention and a confidence scalar.
oracle:
  model: Gaussian log timing errors with publicly reported standard deviation; log runtime = log(c*f(m))
    + a*64/m, a in [-2,2]; replicated wide and narrow domains, smooth misspecification, and linear/linearithmic
    ambiguity with a policy-independent KL bound.
  feasibility: Six scalar probabilities, positive finite scale, public size bounds and cost tiers within
    18 units; integer-valued floats accepted; invalid worlds do not erase valid worlds.
  deterministic: true
  external_tooling: none beyond NumPy
difficulty_ladder:
  default_level: 1
  levels:
    1: Finite-size nuisance fitting and domain-dependent likelihood separation; the narrow supported control
      prevents domain-only refusal.
normalization:
  baseline: one timing, uniform probabilities and a fixed mid-range scale
  reference: Public-domain geometric design, bounded nuisance least squares, known-noise adequacy and
    profile-likelihood separation.
  score: Class probability, scale skill and probability-weighted asymptotic size-700 extrapolation geometric
    mean above always abstaining. No artificial budget discount.
citations:
- id: isbn:9780262033848
  title: Introduction to Algorithms
- id: isbn:9781107001732
  title: A Guide to Experimental Algorithmics (McGeoch, 2012)
invariants:
- Integer-valued float queries equal integer queries.
- Every charged query stays within its public domain and total budget.
- Under the Gaussian generative model, ambiguous paired linear/linearithmic worlds have adaptive transcript KL <= 0.13 and binary accuracy
  <= 0.63.
- A narrow supported exponential control remains distinguishable.
- Full abstention has zero normalized score; per-world failures retain other valid results.
known_shortcuts: 'Historical reviewed head: a 275-point grid reached 0.863028/0.858821 and the untuned
  doubling ladder reached 0.792895/0.799391, both above the 0.710786/0.702993 reference. The contrary
  old claim is withdrawn. verification/replay_review.py replays 2304 ladder x RMS gate x probability mass
  x nuisance-fit settings plus four capability ablations on the redesigned worlds. See references/review_replay.json
  and known_best.md for current Linux results; no frontier-model calibration is claimed. Current clean
  Linux replay: best 0.413705/0.360038, reference 0.681348/0.644685; 2304 grid settings. A stronger five-point control retains all inference
  and scores 0.572169/0.626147 (84.0%/97.1% of reference); the 30% guard covers only the restricted
  single-RMS family, not a universal shortcut gap. See references/reduced_design_control.json.'
