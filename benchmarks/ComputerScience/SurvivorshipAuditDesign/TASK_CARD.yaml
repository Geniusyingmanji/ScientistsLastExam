  title: The Problem of Non-Response in Sample Surveys
- id: doi:10.1080/01621459.1952.10483446
  title: A Generalization of Sampling Without Replacement From a Finite Universe
- id: doi:10.1093/aje/kwh188
  title: A structural approach to selection bias
invariants:
- Paired positive, negligible and negative worlds have identical return indicators for the same action sequence; a two-return-rate shortcut cannot identify their different treatment effects.
- Random follow-up has known inclusion probability and no residual nonresponse; weighted expansion estimates the full randomized cohort mean without modeling selection.
- The weighted stratum effects equal the population estimand exactly; population equivalence does not imply vanishing subgroup effects.
- Scientific claim validation checks public shapes only; wrong claims are valid and graded on private axes.
- Exploratory calls do not change reserved confirmation observations; the session must enforce one immutable commitment before releasing them.
- False discovery and null false-positive denominators are distinct; zero-denominator rates are null; all worlds are identifiable so correct refusal on nonidentifiable worlds is unmeasured.
known_shortcuts: >-
  The original return-rate-only shortcut is structurally blocked by matched return patterns.
  Standard two-phase sampling remains powerful: on a 90-world construction panel the fixed audited
  reference recovers 0.9889 of coarse classes with mean absolute effect error 0.0303.
  This is evidence of identifiability and an active coarse-axis saturation risk, not proof of hard difficulty.
  Public generator code and repository-visible diagnostic seeds require a future private calibration freeze.
