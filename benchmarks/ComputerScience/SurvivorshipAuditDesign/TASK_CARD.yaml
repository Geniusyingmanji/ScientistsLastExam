schema_version: 2
status: candidate
difficulty: unmeasured
delivery: episode_pilot_not_registered
scientific_question: Estimate population and subgroup average randomized treatment effects despite outcome-dependent nonresponse and direct treatment-to-selection effects, using costly uniform random follow-up, and confirm committed claims on fresh complete-outcome trials.
artifact: A population effect class and point/interval estimates for the population and four strata, or explicit abstention.
oracle:
  model: Four-stratum nonlinear Gaussian latent-prognosis response model with heterogeneous treatment effects and logistic selection in outcome, latent prognosis and treatment; paid simple random sampling without replacement among nonreturners.
  feasibility: The trusted episode runner owns a 12000-unit exploration budget, immutable claim commitment, isolation and private result storage; action costs are n plus four times reserved audit slots.
  deterministic: true
  confirmation: 4096 independent complete outcomes per stratum and arm, reserved outside exploration; shared model family, new subjects, no external validation.
normalization:
  baseline: Explicit no-query abstention; also supplied constant-positive, return-rate-only and survivor-only diagnostic controls.
  reference: Truth-blind balanced random audit design with inverse sampling expansion and approximate two-phase variance; 11776 exploration units.
  score: No combined score or certified normalization; effect-class recovery, continuous estimation error, interval coverage, false nonzero claims, abstention/coverage and confirmation remain independent.
