invariants:
- implemented as specified the mechanism is epsilon-DP (Lyu, Su and Li 2017, Algorithm 1, with the discrete
  Laplace distribution in place of the continuous one); an exact-objective local search finds at most
  0.904 in the compliant worlds, 0.633 at cutoff two, on events of 0.9 to 2.0 per cent against 0.4 to
  0.8, so plug-in maxima over many pairs and events show a violation in a world where the claim holds;
  the baseline is wrong in every world
- the three compliant-branch deployments differ from the specification only when a correct comparison
  would have dissented at 34 to 42 from the threshold; coupled with the specification they are (epsilon,
  eta (1 + e^epsilon))-DP with that bound at 2.7e-4 to 4.4e-4, below the claimed delta, and the straddling
  event that breaks every branch world has a mass of 2.6e-5 to 1.5e-4 there and a loss of minus infinity;
  a scan at a fixed run count that reads zero dissents as a branch claims them, and its rung scores 0.000
- every violating world has a witness above epsilon, the noise-scale anchors at 1.24 to 1.49 and the branch
  straddles infinite on events of 1.7 to 9.7 per cent; certifying a noise-scale anchor itself with Clopper-Pearson
  bounds takes 4000 to 34000 runs a side at level 0.2 and 8000 to 75000 at 0.05, from a budget of 200000
  shared with the search
- three of the six branch worlds cover the first query and three begin at a later position, 4, 5 or 7;
  the original first-query method declines these three; the existing complete positional method, now packaged
  as the reference, historically scores 0.819 and 0.730 held out with no false discovery on the graded
  seeds
- a false witness costs one world wherever it is made, minus one in a violating world and zero where declining
  scores one; without the first half the reference without its confirmation tied it at 0.570, and with
  it that rung scores 0.427 and 0.000 held out
- the confirmation is load-bearing, since the no-confirmation rung, the probe's best strategy, averages
  0.063 over eight re-drawn seeds with fifty false discoveries in 144 world-runs, where the original first-query
  method averages 0.446 and 0.440 with none
- declining every world scores exactly zero by construction, and so does claiming a violation everywhere;
  confidence feeds only the calibration axis
- runs are charged and overspend fails closed; the candidate receives a closure and not the ledger, so
  it cannot raise its own budget; the same vector run twice gives fresh runs and counts do not depend
  on the order of calls; malformed submissions score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: 'Author provenance records a 318-policy in-process search, not independently rerun in
  full. The fixed current Linux pilot at 5c5b358cdf47ec3ce1319fc722cc88bd4afcb0f2 evaluates seven frozen
  programs twice each; all 14 results are valid on all 18 worlds and all seven complete metric pairs repeat
  identically. Full positional reference: 0.8193980000000003 development / 0.72987 held out; first-position-only:
  0.5702832857142858 / 0.47987; no scan: 0.17679285714285717 / 0.22987; no library: 0.5714285714285715
  / 0.5; positional no confirmation: 0.3223138571428571 / 0; original strongest no-library-confirmation
  shortcut: 0.4274261428571428 / 0. The latter two are the executable probes; both are below the unchanged
  10% margin threshold 0.7374582000000003. Their false claims / valid claims are 2/7 and 1/6 on development,
  5/6 and 2/4 held out; the full reference has 0/6 and 0/3. No invalid low score supports this comparison.
  All three fixed independent first proposals are valid and below the complete reference. This bounded
  first-proposal comparison does not measure iterative improvement or general model difficulty.'
