schema_version: 2
scientific_question: Decide whether a deployed implementation of the sparse vector technique, AboveThreshold
  with a cutoff, keeps the (epsilon, delta)-differential privacy its curator claims for it, by running
  it on query vectors of one's choice under a budget of charged runs, and either name two neighbouring
  query vectors and a set of outputs whose exact probabilities break the claim or decline.
artifact: A verdict, and for a violation two neighbouring query vectors and a list of output strings,
  with a confidence and an optional refusal.
oracle:
  model: the specification is AboveThreshold with a cutoff c over 8 to 12 counting queries in 0..100,
    threshold 50, threshold noise DLap(2/epsilon) drawn once, query noise DLap(4c/epsilon), epsilon 1
    and delta 0.001; each world deploys an implementation that is the specification, or scales one noise
    wrongly (query noise at one half, one third or 0.6 of its scale, threshold noise at one half), or
    skips the query noise for queries beyond an unpublished offset from the threshold at an unpublished
    set of positions; the compliant-branch deployments skip it only where a correct comparison dissents
    with probability small enough that the coupling bound on delta stays below 0.001; the oracle computes
    deterministic output probabilities by finite discrete-threshold enumeration truncated at +/-1200 and
    scores numerical privacy loss; independently checked geometric-tail bounds are documented in references/compliance_argument.md,
    and this is not a formal real-arithmetic certificate
  feasibility: charged runs of the deployed implementation under a budget of 200000 per world, each run's
    randomness seeded by the world, the vector and how many times that vector has been run, overspend
    failing closed; a witness is two neighbouring vectors and a non-empty set of distinct outputs; its
    loss uses that finite enumeration, the larger over both orders of ln((P1 - delta) / P2); calibrated
    refusal on the worlds where the claim holds
  deterministic: true
normalization:
  baseline: the classic pair, the first query one above the threshold and every other one below against
    every query at the threshold, run 2000 times each, the single output with the largest smoothed count
    ratio claimed as a violation, never declining
  reference: verification/reference_positional.py packages the contributor's existing all-position scan
    with its original public helpers, StatDP-style screened library and fresh Clopper-Pearson confirmation,
    without parameter changes. In the fixed current Linux sandbox pilot it scores 0.8193980000000003 development
    / 0.72987 held out, with no false claims. The original first-position method is a lower-capability
    control (0.5702832857142858 / 0.47987), not the admission reference. Remaining headroom is finite
    sampling and event selection; no query position is intentionally omitted.
  score: development mechanism recovery normalized above always-abstain; a witness in a violating world
    scores (min(L, 2 epsilon) - epsilon) / (min(A, 2 epsilon) - epsilon) against the builder's anchor
    A, a false witness scores minus one there and zero in a compliant world, declining scores zero and
    one; witness strength, false discovery, refusal, coverage, calibration, runs used and the held-out
    split stay separate
