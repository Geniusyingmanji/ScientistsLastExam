  edits_triggered_by_model: 'Before independent calibration, no endpoint model had seen this task. Six
    edits came from the construction checkpoints. A compliant world that skipped the threshold noise redraw
    had a pure-DP loss of 0.974 and was cut. A halved threshold noise has no compliance proof above cutoff
    one and is used only as a violating world. The first reference confirmed two screened pairs at 0.05
    after 4000 runs a vector and scored 0.400 and 0.250, since the winner''s curse chose events far below
    their plug-in value and 40000 runs a side cannot certify an anchor of 1.24; it now screens at 8000
    and confirms one pair with the rest of the budget at level 0.2. With a false witness scoring zero
    in a violating world the reference without its confirmation tied the reference, so a false witness
    now costs one world wherever it is made. The headroom''s positional scan missed an offset of nine
    and then raised a false alarm sized for the first position only; its down vector is now sized by the
    last position''s reach. And the baseline''s docstring, which the candidate reads, named the family
    of noise-skipping branches; it no longer does, and Task.md names no deviation family. In the 2026-09-11
