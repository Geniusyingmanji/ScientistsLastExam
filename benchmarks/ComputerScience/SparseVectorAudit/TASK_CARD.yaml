metric_contract:
  mechanism:
    metric: witness_strength
    estimand: normalized_valid_witness_strength
    numerator: summed anchor-normalized exact witness strength on violating worlds
    denominator: violating worlds
    denominator_metric: witness_strength_denominator
    direction: higher
  fdr:
    metric: false_discovery_rate
    estimand: false_discovery_rate
    numerator: false valid non-abstaining violation claims
    denominator: all valid non-abstaining violation claims
    denominator_metric: false_discovery_denominator
    direction: lower
  refusal:
    metric: correct_refusal_rate
    estimand: compliant_world_refusal_rate
    numerator: correct refusals on compliant and compliant-branch worlds
    denominator: compliant and compliant-branch worlds
    denominator_metric: correct_refusal_denominator
    direction: higher
  coverage:
    metric: discovery_coverage
    estimand: violating_world_claim_coverage
    numerator: valid non-abstaining claims on violating worlds
    denominator: violating worlds
    denominator_metric: discovery_denominator
    direction: higher
