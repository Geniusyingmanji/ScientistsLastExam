scientific_question: Can a five-layer one-dimensional dielectric relief direct transmitted light into diffraction order plus one across wavelengths, angles and both polarizations while retaining utility under fabrication and material shifts?
artifact: five-layer binary dielectric relief with depth, fill fraction and lateral offset per layer
oracle:
  model: deterministic lossless isotropic one-dimensional Fourier-modal rigorous coupled-wave analysis across wavelength, incidence-angle and TE/TM grids
  feasibility: finite five-by-three geometry satisfying depth, fill, lateral-offset, minimum-feature and total-depth constraints
  deterministic: true
normalization:
  baseline: aligned half-duty five-layer dielectric relief
  reference: calibrated five-layer RCWA witness with separately replayed nominal and robust variants; not a global optimum or fabricated-device record
  score: development target-order efficiency controls search; held-out material and wavelength transfer, polarization balance, minimum-condition efficiency and four physical shifts remain separate
development_worlds: 4
heldout_worlds: 2
sealed_shifts: 4
invariants:
  - nominal target-order efficiency
  - held-out material and wavelength transfer
  - TE/TM polarization balance
  - minimum-condition efficiency
  - etch and overlay robustness
  - refractive-index and incidence-angle robustness
  - energy conservation and Fourier-order convergence
