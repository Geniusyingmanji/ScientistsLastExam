scientific_scope: deterministic lossless isotropic one-dimensional Fourier-modal grating design
artifact: five-layer binary dielectric relief with depth, fill fraction and lateral offset per layer
objective: target transmitted order efficiency across wavelengths, angles and TE/TM polarization
development_worlds: 4
