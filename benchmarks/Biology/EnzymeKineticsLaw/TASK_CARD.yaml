  rationale: >-
    The rate laws and the inhibition-mode table are textbook. A calibration draw settled what the
    ablation could not: Opus 5 reaches the reference on its first proposal, by titrating at three
    inhibitor levels and running both refusal tests, with no exploit. The task separates a naive
    analysis from a competent one and is an on-ramp; it is not evidence about the frontier.
