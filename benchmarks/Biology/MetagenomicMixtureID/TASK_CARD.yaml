schema_version: 2
scientific_question: Can purchased sequencing depth recover which library strains a
  sample holds and at what abundances, while refusing samples with a novel organism
  no library assignment can explain?
artifact: A claimed genome set, nonnegative abundances summing to one, optional
  abstention and a confidence scalar.
oracle:
  model: deterministic multinomial read allocation over unique and conserved markers
    per purchased depth run (1200 reads per unit), seeded uneven Dirichlet mixtures
    of two to five strains, hidden lognormal per-marker efficiency bias of ~35
    percent, five percent cross-mapping of unique hits, novel organisms
    contributing only conserved-marker reads at 8-18 percent mass
  feasibility: known genome ids, unique claims, abundances summing to one, charged
    runs within a six-unit budget
  deterministic: true
  external_tooling: none beyond NumPy
difficulty_ladder:
  default_level: 1
  levels:
    1: the shipped mixture structure and mapping statement
normalization:
  baseline: three fixed genomes with uniform abundances, ignoring the data
  reference: pooled runs, Poisson presence thresholds, median-over-markers
    abundance estimation, three-sigma conserved-excess novelty refusal
  score: 0.7 set F1 plus 0.3 abundance score on supported worlds, normalized above
    always abstaining; false discovery and refusal separate
citations:
- id: doi:10.1038/nmeth.3589
  title: MetaPhlAn2 for enhanced metagenomic taxonomic profiling
invariants:
- novel organisms contribute zero unique-marker reads
- repeated runs at the same depth draw independent multinomial noise
- a full abstention scores exactly zero after normalization
known_shortcuts: A single depth-5 run reaches 0.888 against the 0.897 reference;
  the difficulty sits in abundance accuracy under hidden marker bias and the
  novelty margin at 8 percent share. Formal clean Linux calibration and
  independent review remain pending.
licensing:
  task_package: repository_license_not_declared
  external_assets: none
  note: All runtime worlds are generated from original repository code; cited
    publications are not redistributed.
contamination:
  status: cannot_be_ruled_out
  rationale: Marker-based profiling is a public methodology; the seeded database,
    mixtures and novel shares are procedural.
review:
  domain: pending_external_metagenomics
  evaluator_security: targeted_local_regressions_added_clean_linux_sandbox_replay_pending
provenance:
  class: procedural
  target_source: Repository-visible deterministic marker-count worlds with
    development and held-out mixtures and novel shares.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_completed
novelty_risk:
  level: medium
  rationale: Library-matching mixture problems share a shape with
    CrowdedSpectrumAssignment; the read-count statistics, abundance axis and
    conserved-excess refusal are distinct and documented.
