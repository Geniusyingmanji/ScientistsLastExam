novelty_risk:
  level: medium
  rationale: Unlike PopulationGenetics/DemographicSFS, this task estimates habitat occupancy rather than demographic history and must marginalize imperfect repeat detection; unlike ClimateScience/ForcedSignalAttribution, its active decision allocates site revisits and methods rather than control-run years, and its unsupported cases are ecological response forms rather than a bad physical fingerprint or variance model. No Frontier-Eng task uses an occupancy-detection likelihood.
