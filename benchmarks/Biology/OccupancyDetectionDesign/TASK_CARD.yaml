schema_version: 2
scientific_question: Can an agent allocate repeat ecological surveys under imperfect detection, recover the direction and magnitude of a linear habitat-occupancy effect, and refuse resolvable nonlinear or spatial occupancy structure?
artifact: A habitat-effect class, logit-scale effect, mean occupancy, confidence and immutable survey evidence, or a model-inadequacy refusal.
oracle:
  model: deterministic latent Bernoulli site occupancy with method- and accessibility-dependent repeat detection; supported worlds use a linear-logit habitat response while unsupported worlds add quadratic habitat or sinusoidal transect structure
  feasibility: rapid and intensive survey costs under a 42-unit budget, at most three visits per site, finite bounded effects and evidence identifiers restricted to current-world surveys
  deterministic: true
normalization:
  baseline: four rapid surveys followed by a fixed positive habitat-effect claim
  reference: broad rapid coverage, balanced intensive revisits, marginal occupancy likelihood and BIC comparison with quadratic and spatial alternatives
  score: development effect and occupancy recovery normalized above valid blanket abstention; false discovery, refusal, coverage, confidence, budget and held-out transfer remain separate
citations:
- id: doi:10.1890/0012-9658(2002)083[2248:EORWPD]2.0.CO;2
  title: Estimating Site Occupancy Rates When Detection Probabilities Are Less Than One
- id: doi:10.1890/0012-9658(2003)084[0777:EAFRPA]2.0.CO;2
  title: Estimating Abundance from Repeated Presence-Absence Data or Point Counts
invariants:
- supported occupancy follows the published linear-logit equation while detection remains a separate latent-state observation process
- unoccupied sites never generate detections in the supported family
- rapid and intensive calls cost one and two units; overspend, invalid methods and excessive revisits fail closed
- every claim or refusal cites at least four distinct surveys made in the current world
- blanket abstention is exactly zero after normalization; effect, false discovery, refusal and coverage remain separate with denominators
- malformed candidates score invalid without escaping the evaluator
- held-out worlds, latent occupancy and per-world truth remain evaluator-only
known_shortcuts: Initial construction uses repository-visible deterministic worlds and a reduced-order occupancy model without closure, colonization, abundance, correlated detection, observer effects or misidentification. Shortcut and ablation values are regenerated by verification/analysis.py before submission; certification remains blocked on server-held surveys, independent ecological review and real field-data replication.
