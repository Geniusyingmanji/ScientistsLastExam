schema_version: 2
scientific_question: Can budgeted voltage-clamp protocols recover the eight
  Hodgkin-Huxley parameters of a three-current membrane, while refusing membranes
  carrying a current outside the family?
artifact: A bounded length-8 parameter row, optional abstention and a confidence
  scalar.
oracle:
  model: classic 1952 gating kinetics with the absolute-to-relative voltage conversion
    u = V + 65 - s applied at holding and clamp potentials, seeded
    bounded parameters, Gaussian trace noise, plus A-type and rectifying
    extra-current worlds
  feasibility: bounded finite parameters, charged protocols within an
    four-unit budget
  deterministic: true
  external_tooling: none beyond NumPy/SciPy
difficulty_ladder:
  default_level: 1
  levels:
    1: 0.5 percent peak-current noise, unit extra-current scale
    2: 1.0 percent noise, 1.4x extra current
    3: 1.8 percent noise, 1.9x extra current
normalization:
  baseline: one protocol and mid-range parameters, never refusing
  reference: four steps, closed-form gating, five-start bounded least squares with a
    residual misfit gate
  score: geometric mean of normalized parameter recovery and a sealed held-out
    protocol prediction, normalized above always abstaining
citations:
- id: doi:10.1113/jphysiol.1952.sp004764
  title: A quantitative description of membrane current and its application to
    conduction and excitation in nerve
invariants:
- at clamped voltage the public gating equations relax exponentially from the holding
  steady state
- extra-current worlds leave structural residual no three-current fit absorbs
- a full abstention scores exactly zero after normalization
known_shortcuts: Mid-range guesses remain zero after the 2026-09-08 voltage-convention
  correction. Oracle-direct debugging gives reference 0.640364 development and
  0.828679 heldout at the complete four-step budget, with development false-discovery
  rate zero. One/two-step ablations score 0.000000/0.000000 and
  0.066144/0.157297; removing refusal drops the full method to 0.240364/0.162013.
  A 325-strategy reviewer sweep topped out at 0.053671/0.000000. Clean Linux
  calibration and independent review remain pending.
