  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_completed
novelty_risk:
  level: medium
  rationale: Hodgkin-Huxley fitting is classical. ForceFieldCalibration is the closest
    in-repository neighbour because it also combines active hypothesis discrimination
    with out-of-family refusal; HamiltonianLearning and ActiveLawDiscovery share active
    identification, but neither returns this task's eight channel parameters from
    voltage-clamp traces.
