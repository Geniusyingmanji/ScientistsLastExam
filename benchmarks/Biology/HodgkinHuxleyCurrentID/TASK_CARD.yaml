  edits_triggered_by_model: 2026-09-05 local build caught a 0/0 singularity in the public alpha forms at shifted 25 mV (replaced by a stable series form), a constant-trace closed-form bug that started relaxation from the step steady state, a math.exp call on an array in the A-type current, an undetectably weak rectifying world, and a reference that imported the hidden evaluator; each was fixed and pinned by tests.
    The 2026-09-08 review corrected a missing +65 mV rate-coordinate conversion
    in oracle and standalone reference, pinned independent resting gate values, and
    stopped invalid outputs from counting as discovery attempts. The A-type
    inactivation transient now also starts at the holding equilibrium and relaxes
    with its stated fast time scale, instead of starting already inactivated.
