schema_version: 2
scientific_question: >-
  Split a synthetic noncoding DNA construct into a fixed number of bounded-length Golden Gate
  fragments, choose a restriction-enzyme condition compatible with the full target, and maximize
  predicted one-pot assembly fidelity from measured overhang-pair ligation counts.
artifact: >-
  One enzyme name, the complete ordered fragment sequences, and the four-base overlap at every
  adjacent junction; overlaps must exactly reconstruct the supplied target.
oracle:
  model: >-
    Pryor et al. equations 1-2 applied to exact integer ligation counts extracted from PLOS ONE
    supplementary Tables S1-S4 for BsaI-HFv2, BsmBI-v2, Esp3I, and BbsI-HF.
  deterministic: true
  feasibility: >-
    exact target reconstruction through four-base adjacent overlaps; fixed fragment count;
    inclusive fragment-length bounds; unique non-palindromic reverse-complement classes from the
    frozen measured panel; and no selected-enzyme recognition site in the assembled product.
normalization:
  baseline: evenly spaced fragments using the nearest legal unused measured junction
  reference: >-
    best of width-8 and width-32 deterministic public-data beam searches, each followed by four
    coordinate-refinement passes
  score: >-
    uncapped logarithmic remaining-gap progress in log predicted fidelity: baseline is zero,
    score one is hung at log fidelity -0.001 (~99.9% predicted fidelity), which the public-data
    beam-search witness does not reach. Maintainer enumeration reports that the current
    24-class panel cannot reach this target; the >1 region is therefore unsubstantiated
    for this package. A revised target or task requires maintainer policy approval;
    malformed artifacts score zero
  measured_anchors: see references/known_best.md
citations:
  - id: doi:10.1371/journal.pone.0238592
    title: Enabling one-pot Golden Gate assemblies of unprecedented complexity using data-optimized assembly design
invariants:
  - every credited overhang is the exact four-base suffix and prefix shared by two submitted adjacent fragments
  - concatenating the first fragment with bases after each later four-base overlap exactly equals target_sequence
  - only overhangs actually used in the submitted assembly enter the crosstalk denominator
  - the correct ligation cell for row s is column reverse_complement(s), and both directional counts enter its numerator
  - original PLOS workbook hashes and the derived sparse-table hash are fixed and independently tested
  - the baseline scores exactly zero; the beam-search witness is below one (score one is hung at log fidelity -0.001)
known_shortcuts: >-
  September 12 in-process redesign audit rejects panel expansion alone: all 120
  non-palindromic reverse-complement classes with unchanged targets and constraints
  let the existing width-8/four-pass search reach exact F=1 on dev_a and dev_c.
  These are hypothetical-panel raw objectives, not current-task scores or model draws;
  see references/known_best.md and references/audit_full_panel.py.
  September 12 self-contained beam64/two-pass sandbox control scores
  0.573364500287/0.501698019821, exceeding reference development 0.536921991354.
  The declared strong shortcut guard fails; this is algorithm evidence, not calibration.
  Maintainer PR18 review on 2026-09-09 reports exhaustive 24-class ceilings of
  0.685658 development / 0.512899 heldout and public-only multistart search attaining
  them in 75.5 seconds; scientific admission remains blocked pending maintainer task/scale
  decision. These are maintainer measurements, not fresh model calibration.
  Empty or one-fragment artifacts cannot satisfy the fixed 14-17 fragment counts. A list of
  high-fidelity overhangs without matching fragment ends cannot pass exact reconstruction. Reusing
  an overhang or its reverse complement fails closed. Choosing an enzyme with an internal forward
  or reverse-complement recognition site fails closed. Unused matrix rows do not enter fidelity.
review:
  domain: pending_external_synthetic_biology_and_dna_assembly
  evaluator_security: >-
    Candidate code runs across the standard trusted-driver boundary; validation and ligation data
    stay in the trusted evaluator. Submission size is bounded by target and fragment counts.
  reference_implementation_verified: >-
    truth-blind and public-input-only; the builder replay checked orientation and every source
    cell against the original PLOS workbooks and a fixed third-party CSV mirror; independent
    source replay remains pending
provenance:
  class: public_data_replay
  target_source: >-
    Synthetic noncoding targets from fixed seeds; measured ligation counts from Pryor et al. 2020
    PLOS ONE Tables S1-S4 under CC BY 4.0.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: source_workbooks_retrieved_and_hashed_2026-09-06
novelty_risk:
  level: medium
  rationale: >-
    Published high-fidelity overhang sets can be remembered, but they do not determine legal cut
    positions in these seeded target sequences, enzyme compatibility, or bounded fragment lengths.
    RNAInverseDesign and RNAEnsembleDesign optimize single-sequence folding; ProteinStabilityDesign
    selects protein mutations from measured assays. None performs construct segmentation with
    measured DNA ligation crosstalk.
