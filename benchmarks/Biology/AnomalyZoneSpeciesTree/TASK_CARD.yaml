schema_version: 2
scientific_question: Recover the unrooted species tree of eight species and its internal branch lengths in coalescent units from a budgeted catalogue of loci, when the species tree lies in the anomaly zone so the most frequent gene tree is a different tree, two species evolve fast enough that the free uncorrected gene trees join them, and some worlds contain a hybrid species that no species tree can explain.
artifact: A verdict, a Newick species tree with branch lengths when the verdict is tree, a confidence, and an optional refusal.
oracle:
  model: procedurally generated eight-species trees and one-hybrid networks; per locus a gene tree under the multispecies coalescent with per-species rate multipliers, then a Jukes-Cantor alignment with gamma-distributed site rates of an unpublished shape, a log-spaced grid over 0.2 to 1 within each kind of world, in one of three rate classes about a factor of three apart, and a neighbour-joining tree on the plain Jukes-Cantor distance returned with the alignment; worlds are anomaly-zone caterpillars, two-cherry trees with two species at ten to fifteen times the rate, or one-hybrid networks with inheritance probability between 0.4 and 0.5
  feasibility: charged loci from a public catalogue, exact gating on the unrooted topology, internal branch lengths scored by log error, tree worlds scored on the tree, and calibrated refusal on reticulate worlds
  deterministic: true
normalization:
  baseline: concatenation of the longest fast loci, neighbour joining on the plain Jukes-Cantor distance, never declining
  reference: the site-rate shape estimated from the constant-site share of the first sixty loci, gamma-corrected distance gene trees re-estimated at that shape from 500 slow loci of 800 sites, exhaustive quartet consensus over the 10395 unrooted topologies, branch lengths inverted from the quartet frequencies, and a refusal when the minority-topology imbalance around one species exceeds a threshold
  score: development mechanism recovery normalized above always-abstain; topology, branch lengths, false discovery, refusal, coverage, calibration, spend and the held-out split stay separate
