invariants:
- the four development and two held-out anomaly-zone worlds are in the anomaly zone by measurement, not by assumption; over four hundred thousand simulated gene trees per world the species-tree topology is behind the most frequent topology by 5.2 to 9.5 standard errors of the difference, and the test checks each world against a competitor topology named in advance, with fresh gene trees under another seed; the six long-branch worlds are built outside the zone, and there the species tree is the most frequent gene tree by the same measurement
- no quartet is anomalous under the coalescent, and the reference's exhaustive quartet consensus is consistent where the most frequent gene tree, greedy consensus and concatenation are not; greedy consensus in its place loses 0.46 of the score; neighbour joining on the mean gamma-corrected distance is also consistent here, and quartet consensus buys statistical efficiency over it on the short branches, 0.11 on the development split and 0.24 held out, not consistency
- the sequencing centre's gene trees use the plain Jukes-Cantor distance while sites evolve under gamma-distributed rates of an unpublished shape, so the two fast-evolving species attract each other; measured against the true gene trees of the same loci, the free trees join them more often by 11 to 64 percentage points on slow loci, 23 to 70 on medium loci and 28 to 71 on fast loci, in every long-branch world, and the trees corrected at the true shape cut the excess to between +1 and +16 points; the free trees lose 0.80 of the score; the rate multipliers are unpublished, so the correction has to come from the site-rate model, not from knowing which species are fast
- the shape of the site-rate distribution is unpublished and spread over a factor of five within each kind of world, and pairwise distances cannot see it; the reference estimates it from the constant-site share to within ten per cent on every world, and fixing it at a guess of 0.5, 0.2 or 1.0 instead loses 0.34, 0.46 and 0.47, mostly by declining tree worlds whose mis-corrected gene trees carry an imbalance of their own; the true shape, which no candidate has, gains 0.006 over the estimate
- under any species tree the two minority topologies of a quartet are equally probable, so a hybrid is detectable only from the imbalance in the quartets that contain it; on the reference's loci at its estimated shape the imbalance statistic is at most 146.7 on any tree world and at least 598.3 on any reticulate world, with the threshold at 260; on the free gene trees it reaches 974.9 on a tree world, above every reticulate world, so no threshold on the free trees separates them
- the catalogue prices length and not rate class, so the choice of rate class is a scientific choice and not a budgeting one; medium loci in place of slow lose 0.26 on the development split, fast loci 0.59, and the free gene trees on fast loci score zero
- half the reference's budget costs 0.14 and a quarter 0.54 on the development split, so the budget is not free; the anomaly-zone worlds are sampling-limited, since quartet consensus on 240 true gene trees names their species tree only 94 to 99 times in a hundred and on 500 every time
- declining every world scores exactly zero by construction, and so does naming one fixed tree everywhere; declining a tree world is a false discovery, not a shrug, because it claims a hybrid, and a wrong tree is a false discovery whatever its confidence, so confidence feeds only the calibration axis
- loci are charged and overspend fails closed; buying a locus twice returns the same data and is charged once; malformed submissions score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: A sweep of 102060 low-dimensional strategies - gene trees taken free from the sequencing centre, re-estimated at a guessed site-rate shape of 0.2, 0.35, 0.5, 0.7 or 1.0, or, as an oracle no candidate has, at the true shape; one catalogue cell or a topology cell and a refusal cell; topology by greedy consensus, the most frequent gene tree, neighbour joining on the mean distance or quartet consensus; refusal never, on a discordance threshold or on the minority-imbalance statistic; branch lengths constant or from the quartet frequencies - reaches 0.780 on the development split and 0.644 held out without the true shape, against a reference of 0.912 and 0.903 and a ceiling of 1.0; on the free gene trees it reaches 0.319 and 0.215. The top candidate-reachable strategy averages distances corrected at a guessed shape of 0.5 over slow loci, which reads the worlds whose shape is near the guess and fails the rest. With the true shape the same averaging reaches 0.910 and quartet consensus 0.918, so what separates a searcher from the reference is estimating the shape, which pairwise distances cannot see. A first version of the worlds, with the fast species at five to eight times the rate, let a free-tree strategy reach 0.838 because the bias was confined to fast loci; the review of the first pull request caught it. A second version published the shape, and the review of the second pull request found that correcting at the published shape reached 0.859 against 0.873; the shape is now unpublished and spread over the worlds. Every world seed is repository-visible and a future server-held split is required. The reference is deliberately not at the ceiling; its branch-length score is 0.82 because it does not correct the quartet frequencies for gene-tree estimation error, it weights every quartet equally, and it declines on a fixed threshold rather than a test of the fitted tree, so those axes retain headroom. The eight-taxon, one-genome-per-species setting with Jukes-Cantor sequences is a controlled research abstraction; gene flow between non-sister lineages, multiple hybrids, recombination within loci and missing data are out of scope.
