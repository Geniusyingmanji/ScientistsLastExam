    skeleton are adapted from Engineering/ModalDamageAttribution, the repository's exemplar task;
    the worlds, the oracle, the metrics, the reference and the baseline are this task's own.
  edits_triggered_by_model: >-
    No model has seen the task. Four edits came from the construction checkpoints, three from
    the maintainer's review of the first pull request and one, with two consequences, from the
    review of the second. Construction: the first two-fast-species
    worlds showed no long-branch attraction at all, because the fast species' sisters were not
    short enough and the joining branch was not short, so the worlds became two cherries joined by
    a short branch. At the first budget of 80 units no quartet strategy recovered any anomaly-zone
    tree and the refusal statistic did not separate the worlds; the budget is now 480 and the
    branches were lengthened until the reference reads them. One anomaly world at short branches
    of 0.12 to 0.2 coalescent units was not anomalous by simulation; the range is now 0.1 to 0.16.
    At a budget of 400 the reference lost one development world by 0.2 quartet votes out of 243
    and a probe strategy tied it at 0.779 against 0.774; the budget was raised to 480. Review: the
    attraction had been reported as the raw rate at which free trees join the fast species, which
    is mostly incomplete lineage sorting, and measured as the excess over the true gene trees it
    held in only two of the six worlds; the fast species are now at ten to fifteen times the rate
    on species branches of 0.4 to 0.7 coalescent units, and the excess is positive in every world
    and rate class. The probe's best strategy had reached 0.838 against a reference of 0.877 by
    averaging uncorrected distances over slow loci, where the bias was absent; it now reaches
    0.512. And the card had claimed every tree world was in the anomaly zone when only the six
    anomaly worlds are; the claim, the test that carried its name, and the construction script
    now cover exactly those six, and the six long-branch worlds are measured to be outside the
    zone. A wrong tree at low confidence had also escaped the false discovery count; it no longer
    does. Second review: the site-rate shape had been published, and one more row in the
    shortcut grid, re-estimating the distances at that shape, reached 0.859 against a reference
    of 0.873. The shape is now unpublished, a log-spaced grid over 0.2 to 1 within each kind of
    world in an order fixed by the split's seed, and the reference estimates it from the
    constant-site share. With the shapes spread out the slow rate class became the right one and
    the reference moved to it; and the anomaly-zone worlds proved sampling-limited at 240 loci,
    so the budget is now 1000 with 500 loci per catalogue cell. The best strategy without the
    true shape now reaches 0.780 against 0.912.
