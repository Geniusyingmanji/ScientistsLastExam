novelty_risk:
  level: medium
  rationale: The anomaly zone (Degnan and Rosenberg 2006), the inconsistency of concatenation (Kubatko and Degnan 2007), quartet-based species-tree estimation (Allman, Degnan and Rhodes 2011; Mirarab et al. 2014) and long-branch attraction under uncorrected distances (Felsenstein 1978; Roch, Nute and Warnow 2019) are all published, and a model that knows them may reach for quartet consensus at once. What is not published is the site-rate shape, which pairwise distances cannot see and which has to be estimated from a joint statistic of the alignments before any correction works; which loci to buy; that the free gene trees carry a systematic bias that also mimics the reticulation signature; and which worlds are reticulate. The ablation shows the score turns on combining the quartet insight with gene trees re-estimated at an estimated shape, the right locus class and length, a refusal test and the budget rather than on recalling any one of them, and the shortcut probe bounds what a searcher gets without estimating the shape at 0.780 on the development split and 0.644 held out. The nearest task in the repository, Microbiology/MetagenomeCompositionAssignment, also buys sequencing under a budget and declines when the data cannot be explained, but its object is a composition over a fixed reference library and its refusal is library inadequacy, not a quartet asymmetry under the coalescent. No frontier draw has been run yet, so the difficulty at the frontier is not measured.
