schema_version: 2
scientific_question: Recover differential expression under batch effects and refuse when condition is structurally confounded.
artifact: Gene-effect claims or a calibrated identifiability refusal after charged follow-up samples.
oracle:
  model: Deterministic negative-binomial procedural count panels with supported, null, and fully confounded worlds.
  feasibility: Claims use declared genes and finite effects; only available cells may be sampled within budget.
  deterministic: true
normalization:
  baseline: Batch-blind marginal fold-change thresholding normalizes to zero.
  reference: Recomputed per run by truth-blind rank checks, balanced sampling and batch-aware log-count regression.
  score: Development scientific utility is normalized above the baseline and all no-discovery policies; discovery axes remain separate.
citations:
- {id: "doi:10.1186/s13059-014-0550-8", title: "Moderated estimation of fold change and dispersion for RNA-seq data with DESeq2"}
- {id: "doi:10.1093/nargab/lqaa078", title: "ComBat-seq: batch effect adjustment for RNA-seq count data"}
invariants:
- Floating-point aggregation order is independent of process hash randomization.
- Fully confounded worlds expose no legal cross-cell sample.
- Null worlds contain no condition effects.
- False-discovery rates publish numerator and denominator.
- Blanket abstention and the shipped baseline score zero.
known_shortcuts: Identical initial layouts and identical supported/null query menus remove the sample-count label shortcut. Blanket denial and all layout-only no-discovery policies score zero. Fixed-regression saturation and independent calibration remain pending.
