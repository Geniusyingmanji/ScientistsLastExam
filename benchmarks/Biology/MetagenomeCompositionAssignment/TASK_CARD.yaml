schema_version: 2
scientific_question: Recover taxa and abundance from marker counts while preserving strain aliases and
  rejecting a detectably inadequate reference library.
artifact: Concrete taxon-abundance claims, alias groups, or library-inadequacy refusal after charged panels.
oracle:
  model: Deterministic multinomial marker mixtures with identifiable, exact-alias, and outside-reference-cone
    worlds.
  feasibility: Taxa, groups, abundances, panel identifiers and budget are strictly checked.
  deterministic: true
normalization:
  baseline: Legal single-marker nearest-reference solution.py policy scores exactly zero.
  reference: 'Unchanged mixture reference after continuous abundances: 0.723821438 development, 0.555464463
    held-out. Withdrawn instance family.'
  score: Composition above blanket-refusal floor; absolute abundance tolerance 0.025, with separate false
    claims and held-out quality.
citations:
- id: doi:10.1093/bioinformatics/btu721
  title: 'TIPP: taxonomic identification and phylogenetic profiling'
invariants:
- Floating-point aggregation order is independent of process hash randomization.
- Identical reference columns cannot earn strain-level credit.
- Detectable library-inadequacy worlds contain a marker outside the reference cone.
- Taxon and marker permutations preserve scores.
- False-discovery rates publish numerator and denominator.
known_shortcuts: Replaced the four fixed abundance values with continuous simplex draws (each component
  exceeds the reporting threshold), varied the number of active taxa from 2 to 4, and varied the identifiable
  members in alias mixtures. Alias scoring now handles all identifiable members rather than assuming t2
  is the sole member. FDR counts every world, including supported-world false claims. Alias resolution
  and library refusal have separate rates and denominators; held-out uses the same blanket-refusal normalization
  rule as development.  Before repair, reference + nearest {0.35,0.45,0.55,0.65} rounding scored 0.942
  development / 1.0 held-out versus reference 0.694504257. After repair, the unchanged reference scores
  0.723821438 / 0.555464463 and rounding scores 0.620526320 / 0.537500000. Thus the confirmed fixed-abundance
  advantage is removed on this panel; this is not a proof against all quantization probes.  The current
  public alias list and zero-weight sentinel marker still make two scientific decisions lookup operations.
  There are only nine worlds. Repairing those issues requires new panel-dependent identifiability and
  shared-marker library-inadequacy models, followed by calibration. This family is withdrawn, not claimed
  to satisfy the September 8 scientific requirements.
