schema_version: 2
scientific_question: Design feed, induction, and harvest schedules that retain productivity across growth and oxygen-transfer shifts.
artifact: Three bounded feed rates and two process times; the oracle independently simulates trajectories.
oracle:
  model: Deterministic reduced-order fed-batch ODE with substrate limitation, overflow inhibition, induction burden and dilution.
  feasibility: Feed, time, volume, acetate and terminal biomass constraints fail closed.
  deterministic: true
normalization:
  baseline: Constant low feed with fixed induction and harvest normalizes to zero.
  reference: Recomputed per run by a bounded truth-blind robust grid-search witness.
  score: Worst-shift productivity is clipped between baseline and reference; held-out reactor regimes are separate.
citations:
- {id: "doi:10.1016/j.ifacol.2020.12.1167", title: "Optimal control of a fed-batch reactor with overflow metabolism"}
invariants:
- Negative or non-finite schedules are invalid.
- Every design is evaluated under identical nominal and shifted regimes.
- Candidate-reported trajectories and objectives are ignored.
known_shortcuts: The three-stage open-loop policy is low dimensional and may be saturated by grid or differential-evolution search; calibration must show headroom before admission.
review: {domain: pending_external_bioprocess_engineering, evaluator_security: internal_integrator_bounds_shift_schema_and_malformed_output_tests}
