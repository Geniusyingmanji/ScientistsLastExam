  rationale: No repository or Frontier-Eng task uses fluorescence photobleaching recovery or bleach-radius perturbations. PopulationGenetics/DemographicSFS returns demographic parameters from allele-frequency summaries, Ecology/OccupancyDetectionDesign returns occupancy/detection estimates from surveys, Biology/CatalystDeactivationLab diagnoses reactor kinetic failure, and Spectroscopy/ActiveNoiseSpectroscopy returns noise spectra from quantum-probe measurements. Their misspecified families, refusal axes, and instance generators differ; none recovers shared intracellular transport-binding parameters and sealed FRAP predictions while attributing anomalous scaling, two mobile pools, or radius-dependent binding.
