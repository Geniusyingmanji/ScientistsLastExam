schema_version: 2
scientific_question: Can an agent separate intracellular diffusion from reversible binding by choosing FRAP bleach radii and recovery times, recover four shared kinetic parameters, and refuse anomalous transport, two mobile pools, or spatially varying binding?
artifact: Four reaction-diffusion parameters, conditional recovery predictions, a supported or model-inadequacy diagnosis, confidence, and immutable measurement evidence.
oracle:
  model: deterministic seeded single-radial-mode FRAP recovery with freely diffusing and immobile bound pools, plus three structured unsupported transport or binding families
  feasibility: listed radii and times, a 16-unit measurement budget, exact bounded finite outputs, matching diagnosis and abstention, and current-world evidence identifiers
  deterministic: true
normalization:
  baseline: one early measurement followed by a valid undetermined abstention with fixed in-bounds parameters
  reference: cross-radius deterministic bounded fits of the supported reaction-diffusion family and three structured alternatives with BIC attribution
  score: mean supported-world parameter/prediction/confidence composite multiplied by exact unsupported-family refusal rate; mechanism accuracy requires science_score at least 0.5 on supported worlds, while false discovery, coverage, attempts, unwarranted refusal, and held-out transfer remain separate
citations:
- id: doi:10.1529/biophysj.103.026765
  title: Analysis of Binding Reactions by Fluorescence Recovery after Photobleaching
- id: doi:10.1016/S0006-3495(96)79846-6
  title: 'Constrained diffusion or immobile fraction on cell surfaces: a new interpretation'
- id: doi:10.1016/S0006-3495(76)85755-4
  title: Mobility measurement by analysis of fluorescence photobleaching recovery kinetics
invariants:
- supported recovery uses a transport rate proportional to diffusion coefficient divided by bleach-radius squared while binding rates remain shared across radii
- every supported recovery begins at zero, stays bounded by the mobile fraction, and approaches that fraction at late time
- anomalous transport, two freely mobile pools, and radius-dependent binding violate different parts of the supported family
- every measurement has listed finite coordinates, bounded recovery, stated standard error, and an immutable current-world identifier
- blanket undetermined abstention is valid and scores exactly zero
- malformed, non-finite, extra-key, fabricated-evidence, and over-budget submissions fail closed
- development and held-out worlds use different parameters and seeds
- the truth-blind reference consumes only public problems and measurement callbacks
known_shortcuts: An optimizer-free coarse fit profiles mobile fraction and searches 1,200 supported parameter points plus 120 anomalous, 462 two-pool, and 2,016 spatial-binding points under the same 16-measurement budget. It reaches 0.752831/0.784107 development/held-out versus the truth-blind multi-start reference at 0.903145/0.898634. One radius reaches 0.294398/0.559214, a four-time two-radius half-budget fit reaches 0.842761/0.816432, fixed binding rates reach 0.209945/0, and never refusing scores zero. The reduced-order laboratory omits full bleach geometry, finite exposure, three-dimensional transport, photoswitching, cell motion, drift, and image-level inference.
