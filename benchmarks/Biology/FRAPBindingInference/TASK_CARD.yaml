scientific_question: Can an agent separate intracellular diffusion from reversible binding by choosing FRAP bleach radii and recovery times, recover four shared kinetic parameters, and refuse anomalous transport, two mobile pools, or spatially varying binding?
artifact: Four reaction-diffusion parameters, conditional recovery predictions, a supported or model-inadequacy diagnosis, confidence, and immutable measurement evidence.
oracle:
  model: deterministic seeded single-radial-mode FRAP recovery with freely diffusing and immobile bound pools, three structured unsupported transport or binding families, and a local Fisher-information identifiability limit
  feasibility: listed radii and times, a 16-unit budget with a four-unit first-use setup charge per radius plus one unit per measurement, exact bounded finite outputs, matching diagnosis and abstention, and current-world evidence identifiers
  deterministic: true
normalization:
  baseline: four early measurements followed by a high-confidence supported claim with fixed in-bounds parameters; it is legal, confidently wrong, and scores zero
  reference: cross-radius deterministic multi-start bounded least-squares fits of the supported reaction-diffusion family and three structured alternatives with BIC attribution, plus a fitted local Fisher-information identifiability check
  score: mean supported-world parameter and prediction composite multiplied by mean continuous science score across unsupported and unidentifiable worlds; confidence calibration is diagnostic only, a correct abstention must also predict sealed recovery contexts, and mechanism accuracy requires science_score at least 0.5 on supported worlds
citations:
- id: doi:10.1529/biophysj.103.026765
  title: Analysis of Binding Reactions by Fluorescence Recovery after Photobleaching
- id: doi:10.1016/S0006-3495(96)79846-6
  title: 'Constrained diffusion or immobile fraction on cell surfaces: a new interpretation'
- id: doi:10.1016/S0006-3495(76)85755-4
  title: Mobility measurement by analysis of fluorescence photobleaching recovery kinetics
invariants:
- supported recovery uses a transport rate proportional to diffusion coefficient divided by bleach-radius squared while binding rates remain shared across radii
- every supported recovery begins at zero, stays bounded by the mobile fraction, and approaches that fraction at late time
- anomalous transport, two freely mobile pools, and radius-dependent binding violate different parts of the supported family; local Fisher sensitivity, rather than either rate alone, separates identifiable and non-identifiable binding regimes
- every measurement has listed finite coordinates, bounded recovery, stated standard error, and an immutable current-world identifier
- the first measurement at each distinct radius incurs four setup units in addition to its one-unit measurement cost
- blanket undetermined abstention is valid and scores exactly zero
- malformed, non-finite, extra-key, fabricated-evidence, and over-budget submissions fail closed
- development and held-out worlds use different parameters and seeds
- the truth-blind reference consumes only public problems and measurement callbacks
known_shortcuts: Optimizer-free model grids profile mobile fraction under the same 16-unit priced-radius design and apply the public Fisher refusal rule. The 3,798, 15,240, 26,586, and 103,196 point ladder reaches at most 0.575222 development and 0.532828 held out, versus 0.778831/0.837369 for the truth-blind continuous reference; every rung is regression-tested for more than 0.20 absolute split-wise headroom. The reduced-order laboratory omits full bleach geometry, finite exposure, three-dimensional transport, photoswitching, cell motion, drift, and image-level inference.
