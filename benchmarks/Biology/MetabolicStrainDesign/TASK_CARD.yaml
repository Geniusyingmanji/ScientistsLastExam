  rationale: 'Growth-coupled reaction-knockout design minimizes product over the near-optimal-growth
    face. PR #9 used enzyme knockouts plus overexpression under sealed capacity draws;
    its author has deferred that package from split PRs #20-#24 to leave this ID to
    #13. Distinct objective and artifact are documented, but broad FBA-design overlap
    and small-network saturation remain review risks.'
