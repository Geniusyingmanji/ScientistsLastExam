schema_version: 2
scientific_question: Can an edit set under a five-edit budget raise product flux
  across sealed enzyme-capacity draws while holding the biomass gate, and beat a
  frozen truth-blind witness design?
artifact: A knockout list and overexpression multipliers over public reactions.
oracle:
  model: ten-reaction steady-state network solved as linear programs per sealed
    capacity draw (nominal capacities perturbed up to 35 percent), wild-type and
    witness anchors recomputed by the same solver
  feasibility: known reactions only, essential reactions untouched, at most five
    edits, multipliers within the public range
  deterministic: true
  external_tooling: scipy linprog (HiGHS)
difficulty_ladder:
  default_level: 1
  levels:
    1: the shipped draw structure and gate
normalization:
  baseline: the wild type with no edits, scoring exactly zero by construction
  reference: worst-case greedy edit search over stratified public deviation draws
  score: per-draw gap closed between wild type and the frozen witness design,
    averaged; beating the witness scores above one with no cap
citations:
- id: doi:10.1038/nbt.1614
  title: What is flux balance analysis?
invariants:
- wild-type and witness fluxes are recomputed per draw; no literal anchors are stored
- the biomass gate is a fraction of the un-engineered maximum under the same draw
- essential knockouts and out-of-range multipliers invalidate the design
known_shortcuts: A single pdh overexpression closes most of the gap; the greedy
  reference reaches 0.998/1.000. The remaining headroom sits in capacity-corner
  draws where higher multipliers beat the witness. Formal clean Linux calibration
  and independent review remain pending.
