schema_version: 2
scientific_question: Choose reaction knockouts that robustly couple product secretion
  to optimal growth in a frozen stoichiometric model.
artifact: A bounded set of reaction identifiers; the oracle independently solves the
  flux programs.
oracle:
  model: Deterministic steady-state stoichiometric LP with alternate growth-optimal
    fluxes.
  feasibility: Only distinct allowed knockouts within budget are accepted; growth
    and product are recomputed.
  deterministic: true
normalization:
  baseline: The unchanged strain has zero worst-case product and normalized score
    zero.
  reference: Recomputed per run by exhaustive truth-blind search over the declared
    small knockout budget.
  score: Development worst-case product-growth utility is clipped between baseline
    and reference; held-out regimes are separate.
citations:
- id: doi:10.1002/bit.10803
  title: 'OptKnock: A bilevel programming framework for identifying gene knockout
    strategies for microbial strain optimization'
- id: doi:10.1093/bioinformatics/btp704
  title: 'Predicting metabolic engineering knockout strategies for chemical production:
    accounting for competing pathways'
invariants:
- Product is minimized over the entire near-optimal-growth face rather than read from
  an arbitrary LP optimum.
- Reaction ordering does not change a design value.
- Candidate-supplied fluxes are never trusted.
known_shortcuts: Deleting all pure terminal drains scores zero; deleting all allowed
  redox-consuming reactions scores 0.8223 development and 0.8547 heldout. Energy-coupled
  intermediate routes defeat the former full-score column rule. Exhaustive search
  still saturates these reduced networks; frontier difficulty remains unproven.
