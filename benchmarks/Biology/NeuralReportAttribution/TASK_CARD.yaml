  target_source: Original bounded simulator with counter-seeded development and heldout
    instances; no human neural recordings or claims about subjective experience.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_completed
novelty_risk:
  level: medium
  rationale: StructuralEngineering/ModalDamageAttribution supplies the discovery-axis
    and blanket-refusal-offset scoring pattern; this task instead fits report-gated
    neural response and separately calibrated instruments. QuantumControl/ActiveNoiseSpectroscopy
    compares second-order-matched noise mechanisms, while this task's supported families
    are distinguishable in calibrated inverse response entries. This is a controlled
    local abstraction, not a validated theory of consciousness or proven budget-allocation challenge.
