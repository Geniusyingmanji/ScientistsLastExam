schema_version: 2
scientific_question: Disentangle intrinsic feedback from report-mediated feedback
  and sensor readout paths
artifact: An explicit model or abstention, finite parameter estimates for a supported
  mechanism, and calibrated decision confidence.
oracle:
  model: Linearized four-population input-state-output system with report-gated coupling,
    calibrated sensor and actuator mixing, lowpass observation, and additive feedthrough;
    omitted slow state as unsupported model
  feasibility: strict typed query and submission validation; per-unit counter-keyed
    sampling; budget overspend permanently invalidates the instance
  deterministic: true
normalization:
  baseline: overconfident legal baseline scores zero; blanket none and blanket abstention
    also score exactly zero
  reference: exact-derivative joint Gaussian fit with algebraic and midpoint starts, calibration uncertainty included,
    bounded experiment cost; allocation difficulty is not established
  score: mean mechanism utility minus the 0.2 blanket refusal utility, divided by
    0.8; false discovery rate, refusal, coverage, confidence and heldout diagnostics
    remain separate
citations:
- id: doi:10.1016/S1053-8119(03)00202-7
  title: Dynamic causal modelling
invariants:
- Repeated observation units are independent and charged; splitting a batch preserves
  the same counter-indexed observations.
- The public problem is identical across all worlds and splits; noise SDs are shared
  experimental settings, not latent parameters or identifiers.
- Search-visible validity and feasibility depend only on development; the wrapper
  writes only the closed search-visible metric allowlist.
- Global random state does not affect the frozen generator.
- Malformed or overspent candidates fail closed without exposing exception text.
- An omitted mechanism is not the same scientific decision as a valid null mechanism.
known_shortcuts: >-
  Original variable-noise version, independently reviewed at PR 73 comment
  5615520113: calibrated algebraic probe dev 0.449754 / heldout 0.311061
  (3024 strategies, 8 units); null-or-refusal dev/heldout 0.25 (3 units,
  zero supported-world coverage). The earlier 972 raw-response strategies scored
  zero but did not bound calibrated methods. The 0.2 offset removes blanket refusal,
  not the 0.25 null-plus-refusal strategy. Revised shared-noise Linux measurements
  (Python 3.12.3, NumPy 1.26.4, SciPy 1.13.1): calibrated grid dev 0.7540713032 /
  heldout 0.5456852969 (8 units), null-or-refusal 0.25 / 0.25 (3 units), reference
  0.8594885223 / 0.7433017461. Full provenance and reproducible probes are in references/known_best.md and
  experiments/neural_report_revision_2026-09-10.json at repository root.
  All are finite builder probes, not exhaustive bounds or independent model calibration.
  Public seeds and deterministic paid observations remain vulnerable to memorization
  outside the sandbox; admission requires server-held instances.
