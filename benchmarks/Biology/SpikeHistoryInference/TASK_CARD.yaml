schema_version: 2
scientific_question: Can an agent recover stimulus drive and a refractory spike-history kernel from repeated neural spike trains while refusing burst history, latent trial-gain mixtures, and stimulus-dependent refractoriness?
artifact: Four point-process parameters, sealed conditional firing probabilities, a calibrated model-family diagnosis, and immutable trial evidence.
oracle:
  model: deterministic seeded conditional Bernoulli point-process generator with an exponential refractory kernel and three unsupported history or latent-gain mechanisms
  feasibility: exact output keys, bounded finite parameters and probabilities, allowed diagnosis, boolean refusal, and at least four unique supplied trial IDs
  deterministic: true
normalization:
  baseline: valid undetermined blanket abstention with fixed in-bounds parameters
  reference: truth-blind regularized logistic fits, exponential time-constant search, light shrinkage toward public-bound midpoints, and likelihood or BIC comparisons against three structured alternatives
  score: bounded-by-construction mean supported-world quality (70% parameter recovery, 20% prediction, 10% confidence, gated by a supported diagnosis) multiplied by exact unsupported-family refusal; both blanket abstention and never refusing are exactly zero, while false discovery, coverage, attempts, and held-out transfer remain separate
citations:
- id: doi:10.1152/jn.00697.2004
  title: A point process framework for relating neural spiking activity to spiking history, neural ensemble, and extrinsic covariate effects
- id: doi:10.1088/0954-898X/15/4/009
  title: Maximum likelihood estimation of cascade point-process neural encoding models
- id: doi:10.1038/nature07140
  title: Spatio-temporal correlations and visual signalling in a complete neuronal population
invariants:
- supported worlds generate conditional Bernoulli spikes from the published stimulus plus negative exponential spike-history equation
- a recent spike strictly lowers supported conditional firing probability at fixed stimulus and parameters
- burst history, trial-level latent gain mixtures, and stimulus-history interactions violate different parts of the supported conditional model
- every trial has aligned finite stimulus and binary spike sequences with an immutable trial ID
- blanket abstention is valid and scores zero after normalization
- never refusing scores zero because the headline requires correct unsupported-family refusal
- malformed, non-finite, incomplete, extra-key, and fabricated-evidence submissions fail closed
- development and held-out worlds use different seeds and parameters
- every candidate session is reset at each world boundary, preventing cross-world or development-to-held-out state transfer
- reference outputs are computed from public trials without reading hidden world labels or parameters
known_shortcuts: A 3,456-strategy development-selected sweep combines low-order moment thresholds, logit-scale conditional-history contrasts, constant gain/amplitude/tau profiles, and a two-point logit-drive variant without point-process likelihood fitting. It reaches 0.626217/0.463498 development/held-out with no false discoveries, below the truth-blind shrinkage reference's 0.697016/0.829388. Replacing every fitted parameter with public-bound midpoints while retaining reference diagnosis reaches 0.496777/0.328371; fixing tau at 20 ms reaches 0.617365/0.751527; never refusing and rate-only inference score zero. The reduced-order laboratory omits continuous-time spike jitter, coupled neurons, sorting errors, nonstationary stimulus filters and long adaptation.
