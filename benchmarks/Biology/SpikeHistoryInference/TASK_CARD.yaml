novelty_risk:
  level: medium
  rationale: No repository or Frontier-Eng task performs neural point-process inference. GeneNetworkIntervention uses active multi-gene ODE perturbations and HamiltonianLearning uses coherent spin dynamics; neither estimates spike-history likelihoods or attributes refractory-model failure. The parallel SingleMoleculeKinetics candidate infers latent molecular-state transitions rather than a stimulus-conditioned neural history kernel and trial-level neural heterogeneity.
