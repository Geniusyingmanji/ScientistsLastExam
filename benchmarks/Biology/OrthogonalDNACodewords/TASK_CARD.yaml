schema_version: 2
scientific_question: How large an orthogonal DNA word library can be built under fixed
  GC, Hamming, shifted cross-dimer and homopolymer constraints, where verification is
  exact counting and the record is open?
artifact: One word list per constraint family; every word and pair must pass exact
  verification.
oracle:
  model: exact integer constraint counting over encoded words — pairwise Hamming
    matrices with the diagonal excluded, Watson-Crick complementary matches over all
    thirty-one shifted reverse-complement alignments including self-dimers, homopolymer
    run lengths, exact GC counts
  feasibility: 2..512 unique words per family, alphabet ACGT, fixed length
  deterministic: true
  external_tooling: none beyond NumPy
difficulty_ladder:
  default_level: 1
  levels:
    1: two constraint families (dna16, dna12) with the frozen witness anchor
normalization:
  baseline: the trivial two-word library per family, scoring exactly zero
  reference: seeded pool-greedy restarts plus a removal-repair phase; the frozen
    witness sizes are dna16 32 and dna12 29
  score: mean over families of (size - 2)/(witness - 2); larger libraries score above
    one with no cap
citations:
- id: doi:10.1089/10665270152530818
  title: On combinatorial DNA word design
- id: doi:10.1038/s43588-024-00646-z
  title: Scalable design of orthogonal DNA barcode libraries
- id: url:https://www.combinatorics.org/ojs/index.php/eljc/article/view/v10i1r33
  title: Bounds for DNA codes with constant GC content
invariants:
- the verifier is independent of the construction method
- a word never pairs with itself for Hamming purposes but must pass the self-dimer cap
- zero-overlap alignments contribute nothing to the cross-dimer count
- the trivial two-word library scores exactly zero and the witness exactly one
known_shortcuts: A five-restart greedy under a different seed reaches 0.864 — the
  search is seed-sensitive rather than shortcut-prone; no low-dimensional family
  applies because the artifact is the object itself. Formal clean Linux calibration
  and independent review remain pending.
licensing:
  task_package: repository_license_not_declared
  external_assets: none
  note: All witness libraries are generated from original repository code; cited
    publications are not redistributed.
contamination:
  status: cannot_be_ruled_out
  rationale: The constraint families mirror published DNA word design and published
    constructions may exceed the witness; that is legitimate record-chasing, but a
    memorized published library must still pass verification, which is the intended
    difficulty.
