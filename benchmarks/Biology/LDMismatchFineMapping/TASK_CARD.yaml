schema_version: 2
scientific_question: Name the causal variants at a genome-wide association locus of sixty typed variants and their per-allele effects, or declare the association unresolvable, from marginal summary statistics and a public reference panel whose linkage disequilibrium differs from the cohort's by an unpublished amount, when six rows of the cohort's own linkage disequilibrium can be bought.
artifact: A verdict, a list of causal variant indices with signed per-allele effects when the verdict is typed, a confidence, and an optional refusal.
oracle:
  model: procedurally generated loci of sixty common variants from a founder haplotype panel copied as a Li-Stephens mosaic in two populations with different founder weights and switch rates, one for the cohort of 20000 and one for the reference panel of 500; a quantitative trait additive in one to three typed causal variants; marginal z-scores and standard errors from the cohort; worlds are single-variant with a panel-invisible proxy, masked pairs of opposite sign, three signals in three haplotype blocks, or a causal variant with a near-duplicate the cohort cannot separate and the panel says it can, the pair the weakest of three signals in most of them; every world carries exactly one secondary hit, a variant whose conditional chi-square given the causal set is 9.5 to 13.5, the real masked partner in the masked worlds and a genome-wide significant decoy in weak LD with every causal variant elsewhere
  feasibility: charged in-sample linkage-disequilibrium rows, set overlap gated on naming no non-causal variant, effects scored by signed log error, typed worlds scored on the set, and calibrated refusal on unresolved worlds
  deterministic: true
normalization:
  baseline: PLINK-style clumping of the genome-wide significant variants on the reference panel at r-squared 0.1, the strongest variant per clump with its marginal effect, never declining
  reference: verification/reference_masking_aware.py is the complete truth-blind reference; it acquires residual and resolution rows, tests masked partners within strong-LD neighbourhoods, declines ambiguous configurations, and converts marginal t-statistics to exact joint least-squares per-allele effects; the original region-wide reference is retained as an ablation, not the admission threshold
  score: development mechanism recovery normalized above always-abstain; set overlap, effects, false discovery, refusal, coverage, calibration, rows bought and the held-out split stay separate
