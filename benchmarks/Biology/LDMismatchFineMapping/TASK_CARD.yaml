novelty_risk:
  level: medium
  rationale: Fine-mapping from summary statistics (Hormozdiari et al. 2014; Benner et al. 2016; Wang et al. 2020), the damage done by a mismatched reference panel (Benner et al. 2017; Chen et al. 2021; Kanai et al. 2022) and conditional analysis (Yang et al. 2012) are all published, and a model that knows them will reach for a joint model on in-sample linkage disequilibrium at once. What is not published is which rows to buy under a budget of six, that the answer is a chase of the conditional residual rather than a purchase by rank, that a refusal has to be reasoned from a comparison of configurations on bought rows rather than read off the panel, and which worlds are unresolved. The ablation shows the score turns on combining the purchase rule, the joint model, the refusal and the budget rather than on recalling any one of them, and the shortcut probe bounds what a searcher gets at 69 per cent of the reference. The reference's own headroom is deliberate and documented, since it applies one region-wide selection line and so never names a masked partner, while a model that knows masking is a local LD phenomenon and tests the lead's neighbourhood conditionally recovers every partner without taking the decoys. The nearest task in the repository, PopulationGenetics/DemographicSFS, is a coalescent parameter inversion with no linkage disequilibrium in it. No frontier draw has been run yet, so the difficulty at the frontier is not measured.
