provenance:
  class: procedural
  target_source: Repository-visible deterministic generator with twelve development worlds (three single-variant, three masked, two multi-signal, four unresolved of which three have the pair as the weakest of three signals) and six sealed held-out worlds, each with its own founder panel, cohort and reference panel.
