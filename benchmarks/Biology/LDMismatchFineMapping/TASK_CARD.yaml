invariants:
- the reference panel's correlations differ from the cohort's by an unpublished amount, a mean absolute difference of 0.07 to 0.17 on correlated pairs and a largest difference of 0.34 to 0.83 over the graded worlds; in every single-variant world the causal variant has a proxy at cohort r-squared 0.30 to 0.39 and panel r-squared 0.09 or less that is itself genome-wide significant, so clumping and conditional analysis on the panel report a second signal; the reference fed the panel's rows in place of the cohort's falls from 0.806 to 0.000
- in every masked world the second causal variant has a marginal |z| of 2.6 to 4.6 at rank 4 to 8, with the wrong sign in all five, so no marginal or clumping rule calls it; given the lead's exact row its conditional chi-square is 11.2 to 12.6, below the extended BIC penalty of 18.1, so the reference names only the lead and the masked worlds score 0.51 to 0.55
- every typed and unresolved world carries exactly one decoy, a non-causal variant whose conditional chi-square given the causal set is 9.5 to 12.6, the masked partner's band, with every other non-causal variant at least 2 below the band; the decoy is genome-wide significant on its own at |z| 5.5 to 8.1 and correlated with every causal variant at 0.30 or less, so clumping on any LD takes it as an independent signal and every region-wide selection line that takes the masked partners takes decoys with it; the plain BIC scores 0.599, the Bonferroni line for sixty variants 0.842 with one false discovery and 0.709 held out, clumping on the bought rows 0.199; the masking-aware local test, a conditional scan of each modelled variant's strong-LD neighbours at a line for that neighbourhood alone, scores 0.962 and 0.947 held out with no false discovery, which is the reference's documented headroom
- in every multi-signal world the weakest of three signals ranks 9th to 20th by |z| behind the proxies of the strongest, so rows bought by rank never reach it; the six-largest-|z| purchase scores 0.382 against 0.806
- resolvability is defined by the summary-statistic likelihood under the cohort's own linkage disequilibrium, in which twice the maximised log-likelihood of a configuration is z_S' R_SS^-1 z_S; every typed world has its causal set at least 6 ahead of every single-member swap, 6.2 to 134.4 over the graded worlds, and every unresolved world has its pair within 2, 0.3 to 1.3 here, and at least 11 ahead of everything else; the reference's swap margin lands at 20.9 to 134.4 on typed worlds and 0.3 to 1.3 on unresolved ones, and on one hundred and twenty-five extra worlds outside the graded seeds it makes no false discovery
- the near-duplicate is correlated with the causal variant at 0.992 to 0.996 in the cohort and 0.57 to 0.86 in the panel, so the panel presents it as an ordinary resolvable proxy; in four of the six unresolved worlds the pair is the weakest of three signals at rank 12 to 19, so rows by rank or by predicted z-score never reach it; nothing in the public problem separates the unresolved worlds from the typed ones
- the budget is not free, since three or four rows score 0.507 and six 0.806; the chase alone models every world with 2.4 rows on average and one proxy row per modelled variant is what reaches the near-duplicate, so stopping when the chase stops scores 0.306, the same as never declining, and proxy rows by predicted z-score score 0.431
- two rungs of the ladder gain or match on the development split and lose held out, the Bonferroni line at 0.709 and refusal margin 1 at 0.749 against 0.431 on the development split, so the sealed split is load-bearing
- declining every world scores exactly zero by construction, and so does naming one fixed variant everywhere; naming the top variant by |z| everywhere scores 0.180; declining a typed world is a false discovery because it claims an ambiguity that is not there, and naming any non-causal variant is a false discovery whatever the confidence, so confidence feeds only the calibration axis
- rows are charged and overspend fails closed; the candidate receives a closure and not the ledger, so it cannot raise its own budget; buying a row twice returns the same row and is charged once; malformed submissions score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: >-
  The independently rerun fixed 1120-strategy grid at source 83e2e3c executes all 1120 cells
  with valid results on all 18 worlds. Its best development score is 0.5568645 (heldout
  0.25574175), 57.90 per cent of the complete reference at 0.96183425; the largest heldout
  score in the grid is 0.510255. A separate stronger omission probe, the original region-wide
  reference without the local masked-partner test, scores 0.806301625, below the complete
  reference by 0.155532625. Panel-only clumping and universal refusal both have combined_score
  zero. These are a bounded construction screen, not a universal difficulty bound; the
  machine-readable candidates below must additionally match through the real sandbox, and
  a new frontier first-draw calibration remains required.

