  template_source: >-
    frontier_eval/run_eval.py is generated by scripts/gen_task.py; the evaluator's per-world
    scoring, split summary and evaluate skeleton follow Phylogenomics/AnomalyZoneSpeciesTree and
    through it Engineering/ModalDamageAttribution, the repository's exemplar task; the haplotype
    simulator, the worlds, the oracle, the metrics, the reference and the baseline are this
    task's own.
  edits_triggered_by_model: >-
    No model has seen the task. Eleven edits came from the construction checkpoints. The first
    refusal world had an untyped causal variant, whose best typed tag was to be declined as a
    poor fit; the residual chi-square that was meant to detect it had a noncentrality of ten to
    forty against a spread the chase rows inflated, so the refusal was not detectable at any
    threshold, and the world was replaced by the near-duplicate pair, whose unresolvability is a
    likelihood identity and not a test. The first near-duplicate was planted on the founder
    haplotypes and could not exceed a cohort correlation of 0.91 because the mosaic's copying
    error and switches separated the two sites; it is now planted on the realised haplotypes
    with a per-population mismatch rate. The first residual covariance was wrong and is now the
    Schur complement. The reference's verification rows, ranked by observed |z|, inflated the
    residual in weak worlds and are now ranked by predicted |z|. A budget of eight rows left the
    reference two rows of slack, four rows scoring 0.892 and six the full score, so the budget
    is six. Two masked worlds had no genome-wide significant variant, which no scan would have
    sent to fine-mapping; every world now has one. The candidate was handed the campaign object
    and is now handed a closure. With every unresolved pair the strongest signal in its world, a
    two-row purchase with stepwise selection reached 0.940 against a reference of 0.959; three
    development unresolved worlds now have the pair as the weakest of three signals and the
    reference buys one proxy row per modelled variant, weakest first. The reference then scored
    0.959 with the masked partners above every selection line, so the task had no headroom; the
    partner's band was moved below the extended BIC penalty, which alone made the plain BIC the
    best rung at 0.958, so every other world now carries a genome-wide significant decoy in the
    same band, in weak LD with every causal variant, and only the lead's LD neighbourhood
    separates partner from decoy. That band could not be met by redrawing haplotypes, so the
    construction now redraws the phenotype noise with the haplotypes fixed. With the decoys below
    genome-wide significance, chased rows with clumping and a swap-margin refusal tied the
    reference at 0.807; every decoy is now genome-wide significant. And one world had a second
    variant within the band, so every other non-causal variant is now required to sit at least
    2 below it.
