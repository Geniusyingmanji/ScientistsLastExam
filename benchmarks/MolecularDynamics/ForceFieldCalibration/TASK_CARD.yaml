  - id: doi:10.1063/1.1723844
    title: Interaction of the van der Waals type between three atoms
invariants:
  - supported energies and forces are analytic sums over all three pair distances and obey translation, rotation and force-balance invariance
  - every active batch records the submitted pre-observation weights and retained set before returning data
  - retained hypotheses carry at least one percent probability, omitted hypotheses carry zero, and eliminated hypotheses cannot be silently restored; protocol or budget violations fail closed even when caught
  - the first screening query is limited to one exactly equilateral near-equilibrium configuration at the designated screening temperature, while later repulsive, tail and temperature queries discriminate the hypotheses
  - every world exposes an identical public problem dictionary; hidden noise scale, family, parameters, kind and split appear only through queried observations or evaluator-only records
  - the selected model is tied to a maximum final hypothesis weight, and submitted virial/Boyle quantities must be self-consistent with submitted potential parameters
  - supported worlds reward model selection, parameter/interval recovery, sealed energy-force prediction, an explicitly submitted self-consistent second-virial curve and Boyle-temperature decisions
  - Buckingham, three-body and state-dependent worlds reward evidence-supported refusal rather than a fabricated supported model
  - the weak all-world refusal baseline is valid and scores zero by construction
  - held-out worlds, sealed distance/temperature regimes, true-family retention, information gain, false discovery, reference-policy and oracle-clean controls remain evaluator-only
  - every world receives a fresh candidate process and private temporary filesystem
  - missing or extra fields, non-finite values, malformed weights/intervals, fabricated evidence and callback overspend fail closed
known_shortcuts: The deterministic three-particle reduced-order laboratory omits electronic structure, periodic boundaries, many-body condensed phases, sampling, finite-size effects and real force labels. Repository-visible world generators require server-held cohorts. This task calibrates active hypothesis management and model refusal; it is not molecular dynamics, a material potential, a thermodynamic experiment or autonomous-discovery evidence.
review:
  domain: pending_external_molecular_simulation_and_statistical_mechanics_review
  evaluator_security: automated_force_energy_invariance_active_budget_hypothesis_monotonicity_parameter_interval_virial_refusal_fresh_sandbox_fail_closed_and_metric_sealing_tests
